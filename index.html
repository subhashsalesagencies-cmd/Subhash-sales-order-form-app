async function dispatchOne(bookingId){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b || b.status==='dispatched') return;
  markBusy(t('processing_word'));
  b.status = 'dispatched';
  b.dispatchedAt = new Date().toISOString();
  b.dispatchedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  await saveData();
  await logActivity('Item Dispatched', `${b.customerName} — Design ${b.designNumber}, ${b.size} × ${b.qty}`);
  render();
}

// Dispatches every pending item in one customer's whole Pending-tab group
// (i.e. one date group) in a single tap, straight from the Pending tab.
// It's the exact same status flip as dispatchOne, just applied to every
// row in that group — so it shows up correctly (blurred/✓) the moment
// someone searches for it in the Article tab or opens the Dispatched tab.
async function dispatchGroupDated(cname, dk){
  const now = new Date().toISOString();
  const dispatchedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  const rows = bookings.filter(b=>b.customerName===cname && b.status==='pending' && !b.trashed && dispatchDateKey(b.orderedAt)===dk && pdBrandOk_(b));
  if(!rows.length) return;
  let total = 0;
  rows.forEach(b=>{
    b.status = 'dispatched';
    b.dispatchedAt = now;
    b.dispatchedBy = dispatchedBy;
    total += b.qty;
  });
  await saveData();
  await logActivity('Order Dispatched', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

/* ---------------- DISPATCHED ORDERS TAB ---------------- */

function dispatchDateKey(iso){
  const d = new Date(iso);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// Text for the date line under the customer name in order PDFs (the order's own date, or a range).
function pdfOrderDateText_(rows){
  const ks = [...new Set((rows || []).map(b=>b.orderedAt).filter(Boolean).map(dispatchDateKey))].sort();
  if(!ks.length) return dispatchDateLabel(dispatchDateKey(new Date().toISOString()));
  return ks.length === 1 ? dispatchDateLabel(ks[0]) : dispatchDateLabel(ks[0]) + ' to ' + dispatchDateLabel(ks[ks.length - 1]);
}
function dispatchDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function renderDispatchedOrders(main){
  let dispatchedAll = bookings.filter(b=>b.status==='dispatched' && !b.trashed);

  if(doSearchDesign.trim()){
    const q = doSearchDesign.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>b.designNumber.toLowerCase().includes(q));
  }
  if(doSearchBrand.trim()){
    const q = doSearchBrand.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>(b.brand||'').toLowerCase().includes(q));
  }
  if(doSearchCustomer.trim()){
    const q = doSearchCustomer.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>String(b.customerName||'').toLowerCase().includes(q));
  }
  if(doSearchDate){
    dispatchedAll = dispatchedAll.filter(b=>dispatchDateKey(b.dispatchedAt)===doSearchDate);
  }

  let resultsHtml = '';
  if(!dispatchedAll.length){
    resultsHtml = `<div class="empty">${t('no_dispatched_orders')}${(doSearchDesign||doSearchBrand||doSearchCustomer||doSearchDate) ? ' '+t('no_dispatched_match') : ' '+t('no_dispatched_yet')}</div>`;
  } else {
    const dateGroups = {};
    dispatchedAll.forEach(b=>{
      const dk = dispatchDateKey(b.dispatchedAt);
      if(!dateGroups[dk]) dateGroups[dk] = {};
      if(!dateGroups[dk][b.customerName]) dateGroups[dk][b.customerName] = [];
      dateGroups[dk][b.customerName].push(b);
    });
    const dateKeys = Object.keys(dateGroups).sort((a,b)=>b.localeCompare(a));
    resultsHtml = dateKeys.map(dk=>{
      const custMap = dateGroups[dk];
      // Whoever's item was dispatched most recently shows first, so ticking
      // off orders one by one keeps moving the latest one to the top
      // instead of it settling at the bottom of the day's list.
      const custNamesSorted = Object.keys(custMap).sort((a,b)=>{
        const maxA = Math.max(...custMap[a].map(r=>new Date(r.dispatchedAt).getTime()));
        const maxB = Math.max(...custMap[b].map(r=>new Date(r.dispatchedAt).getTime()));
        return maxB - maxA;
      });
      const custCards = custNamesSorted.map(cname=>{
        const rows = custMap[cname].sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
        const total = totalsUi_(rows);
        const brands = [...new Set(rows.map(b=>b.brand).filter(Boolean))].join(', ');
        const lines = rows.map(b=>
          `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}</span><span>${qtyUi_(b)} <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></span></div>`
        ).join('');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(cname)}${brands ? ` <span class="subtle">(${escapeHtml(brands)})</span>` : ''}</span><span class="set-pill done">${total}</span></div>
          ${lines}
          <div class="order-total-line"><span>${t('total')}</span><span>${total}</span></div>
          <div class="action-row">
            <button class="action-btn wa" onclick="shareWhatsAppDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('whatsapp')}</button>
            <button class="action-btn pr" onclick="printOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('print')}</button>
            ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('delete_btn')}</button>` : ''}
          </div>
        </div>`;
      }).join('');
      return `<div class="date-section-label">${dispatchDateLabel(dk)}</div>${custCards}`;
    }).join('');
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_dispatched')}</h2>
      <label>${t('by_article_number')}</label>
      <input id="doSearchDesign" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(doSearchDesign)}" oninput="onDoSearch('design', this.value)">
      <label style="margin-top:10px;">${t('by_customer_name')}</label>
      <input id="doSearchCustomer" list="customerList" placeholder="${t('type_name')}" value="${escapeHtml(doSearchCustomer)}" oninput="onDoSearch('customer', this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')}</label>
      <input id="doSearchBrand" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(doSearchBrand)}" oninput="onDoSearch('brand', this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="doSearchDate" type="date" value="${escapeHtml(doSearchDate)}" oninput="onDoSearch('date', this.value)">
    </div>
    <div id="doResults">${resultsHtml}</div>
  `;
}

let doSearchDebounce_ = null;
function onDoSearch(which, val){
  if(which==='design') doSearchDesign = val;
  else if(which==='brand') doSearchBrand = val;
  else if(which==='customer') doSearchCustomer = val;
  else doSearchDate = val;
  // Only the results list is redrawn; the search boxes stay as they are, so the
  // phone keyboard does not jump up/down while typing.
  clearTimeout(doSearchDebounce_);
  doSearchDebounce_ = setTimeout(refreshDispatchedResultsOnly_, which==='date' ? 0 : 120);
}

function refreshDispatchedResultsOnly_(){
  const live = document.getElementById('doResults');
  if(!live){ render(); return; }
  const tmp = document.createElement('div');
  renderDispatchedOrders(tmp);
  const fresh = tmp.querySelector('#doResults');
  if(fresh) live.innerHTML = fresh.innerHTML; else render();
}

// Row passes the Article-number / Brand text typed in the Dispatched tab (if any).
function doRowOk_(b){
  const dq = doSearchDesign.trim().toLowerCase();
  const bq = doSearchBrand.trim().toLowerCase();
  if(dq && !String(b.designNumber||'').toLowerCase().includes(dq)) return false;
  if(bq && !(b.brand||'').toLowerCase().includes(bq)) return false;
  return true;
}
function getDatedRows(cname, dk){
  return bookings.filter(b=>b.customerName===cname && b.status==='dispatched' && !b.trashed && dispatchDateKey(b.dispatchedAt)===dk && doRowOk_(b))
    .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
}

function buildDatedOrderPdf(cname, dk){
  const rows = getDatedRows(cname, dk);
  const total = totalsUi_(rows);
  const hdr = unitHdr_(rows);
  const tableRows = rows.map(b=>[b.designNumber, b.colour||'-', b.size, b.brand||'-', qtyCell_(b, hdr)]);
  const pp = pdfWithPrice_(['Design Number','Colour','Size','Brand',hdr], tableRows, rows, hdr);
  return {
    blob: buildPdfBlob(`${cname}`, `Subhash Sales Agencies · Dispatch Date: ${dispatchDateLabel(dk)}`, pp.columns, pp.tableRows, `Total: ${totalsPdf_(rows)}${amtFooter_(pp)}`, { heading: 'Dispatched Order' }),
    total
  };
}

function printOrderDated(cname, dk){
  const { blob } = buildDatedOrderPdf(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  openPdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`);
}

async function shareWhatsAppDated(cname, dk){
  const { blob, total } = buildDatedOrderPdf(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`, `Order — ${cname}`, `Order — ${cname} (${dispatchDateLabel(dk)}), Total ${total}`);
}

async function deleteOrderDated(cname, dk){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`Delete this dispatched order of ${cname}?\nAre you sure?`)) return;
  markBusy(t('deleting_word'));
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.status==='dispatched' && !b.trashed && dispatchDateKey(b.dispatchedAt)===dk && doRowOk_(b)){
      b.trashed = true;
      b.trashedAt = new Date().toISOString();
      b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Deleted', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

// Restores just ONE deleted line (not the whole party).
async function restoreOne(id){
  const b = bookings.find(x=>x.id===id);
  if(!b || !b.trashed) return;
  markBusy(t('restoring_word'));
  b.trashed = false;
  b.trashedAt = null;
  await saveData();
  await logActivity('Order Item Restored', `${b.customerName} — Design ${b.designNumber}${b.colour ? ' '+b.colour : ''}, ${b.size} × ${b.qty} ${unitEn_(unitOf_(b))}`);
  render();
}

async function restoreOrder(cname){
  markBusy(t('restoring_word'));
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.trashed){
      b.trashed = false;
      b.trashedAt = null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Restored', `${cname} — ${total} sets`);
  render();
}

async function permanentDeleteOrder(cname){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`${cname} — ${t('perm_delete_confirm')}`)) return;
  markBusy(t('deleting_word'));
  let total = 0;
  bookings = bookings.filter(b=>{
    if(b.customerName===cname && b.trashed){ total += b.qty; return false; }
    return true;
  });
  await saveData();
  await logActivity('Order Permanently Deleted', `${cname} — ${total} sets removed for good`);
  render();
}

function renderPendingOrders(main){
  const pendingAll = bookings.filter(b=>b.status==='pending' && !b.trashed);

  const searchBar = `
    <div class="card">
      <h2>${t('search_party')}</h2>
      <input id="pdSearchCustomer" placeholder="${t('enter_customer_name')}" value="${escapeHtml(pdSearchCustomer)}" oninput="onPdSearch('customer', this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')} (${t('optional_word')})</label>
      <input id="pdSearchBrand" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(pdSearchBrand)}" oninput="onPdSearch('brand', this.value)">
      <label style="margin-top:10px;">${t('from_date')} (${t('optional_word')})</label>
      <input id="pdFromDate" type="date" value="${escapeHtml(pdFromDate)}" oninput="onPdSearch('from', this.value)">
      <label style="margin-top:10px;">${t('to_date')} (${t('optional_word')})</label>
      <input id="pdToDate" type="date" value="${escapeHtml(pdToDate)}" oninput="onPdSearch('to', this.value)">
    </div>
  `;

  if(!pendingAll.length){
    main.innerHTML = searchBar + `<div id="pdResults"><div class="empty">${t('no_pending_orders')}</div></div>`;
    return;
  }

  let filtered = pendingAll;
  if(pdSearchBrand.trim()){
    const bq = pdSearchBrand.trim().toLowerCase();
    filtered = filtered.filter(b=>(b.brand||'').toLowerCase().includes(bq));
  }
  if(pdFromDate || pdToDate){
    filtered = filtered.filter(b=>inPdRange_(b.orderedAt));
  }

  let customers = [...new Set(filtered.map(b=>b.customerName))];
  if(pdSearchCustomer.trim()){
    const q = pdSearchCustomer.trim().toLowerCase();
    customers = customers.filter(n=>n.toLowerCase().includes(q));
  }

  if(!customers.length){
    main.innerHTML = searchBar + `<div id="pdResults"><div class="empty">${t('no_customer_found')}</div></div>`;
    return;
  }

  // Group by the date the order was placed (orderedAt), same pattern as the
  // Dispatched tab's dispatch-date grouping, so today's orders sit under
  // today and older orders sit under their own date.
  const dateGroups = {};
  filtered.filter(b=>customers.includes(b.customerName)).forEach(b=>{
    const dk = dispatchDateKey(b.orderedAt);
    if(!dateGroups[dk]) dateGroups[dk] = {};
    if(!dateGroups[dk][b.customerName]) dateGroups[dk][b.customerName] = [];
    dateGroups[dk][b.customerName].push(b);
  });
  const dateKeys = Object.keys(dateGroups).sort((a,b)=>b.localeCompare(a));

  const cards = dateKeys.map(dk=>{
    const custMap = dateGroups[dk];
    // Most recently created order shows at the top of its date group, so
    // whichever customer's order was just booked appears first, not
    // whichever customer happened to be first in the underlying data.
    const custNamesSorted = Object.keys(custMap).sort((a,b)=>{
      const maxA = Math.max(...custMap[a].map(r=>new Date(r.orderedAt).getTime()));
      const maxB = Math.max(...custMap[b].map(r=>new Date(r.orderedAt).getTime()));
      return maxB - maxA;
    });
    const custCards = custNamesSorted.map(cname=>{
      const rows = custMap[cname].sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
      const total = totalsShort_(rows);
      const isEditing = editingPendingGroup && editingPendingGroup.cname===cname && editingPendingGroup.dk===dk;

      if(isEditing){
        // Edit mode: every line becomes editable (design/colour/size/qty),
        // so a mistake made while booking can be corrected right here
        // instead of deleting and re-creating the whole order.
        const editRows = rows.map(b=>`
          <div class="item-line" style="flex-wrap:wrap;gap:6px;align-items:center;">
            <input id="editDesign-${b.id}" value="${escapeHtml(b.designNumber)}" style="width:90px;" placeholder="${t('design_number')}">
            <input id="editColour-${b.id}" value="${escapeHtml(b.colour||'')}" style="width:90px;" placeholder="${t('colour_optional')}">
            <input id="editSize-${b.id}" value="${escapeHtml(b.size)}" style="width:80px;" placeholder="${t('size')}">
            <input id="editQty-${b.id}" type="number" min="1" value="${b.qty}" style="width:60px;">
            ${unitSelectHtml_(`editUnit-${b.id}`, unitOf_(b), 'width:72px;')}
            <button class="chip x" style="border:none;background:none;color:var(--rust);font-weight:700;" onclick="removePendingEditRow('${b.id}')">✕</button>
          </div>
        `).join('');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(cname)}</span><span class="set-pill pending">${t('editing')}</span></div>
          ${editRows}
          <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);">
            <div class="section-label" style="margin-top:0;">➕ ${t('add_more_lines')}</div>
            <div id="editNewList">${editNewListHtml_()}</div>
            <div id="editNewMsg"></div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
              <input id="editNewDesign" placeholder="${t('design_number')}" style="width:92px;">
              <input id="editNewColour" placeholder="${t('colour_optional')}" style="width:92px;">
              <input id="editNewSize" placeholder="${t('size')} (2/6 8/16)" style="width:118px;" onkeydown="if(event.key==='Enter'){event.preventDefault();addEditNewLine_();}">
              <input id="editNewQty" type="number" min="1" value="1" style="width:56px;">
              ${unitSelectHtml_('editNewUnit', 'set', 'width:72px;')}
              <input id="editNewBrand" placeholder="${t('brand_word')}" value="${escapeHtml((rows[0] && rows[0].brand) || '')}" style="width:100px;">
              <input id="editNewPrice" type="number" inputmode="decimal" min="0" placeholder="₹" style="width:64px;">
              <button class="action-btn pr" style="padding:8px 12px;" onclick="addEditNewLine_()">${t('add_line_btn')}</button>
            </div>
            <div style="font-size:11.5px;color:#7e8896;margin-top:4px;">${t('add_line_hint')}</div>
          </div>
          <div class="action-row">
            <button class="action-btn pr" onclick="saveEditPendingGroup('${cname.replace(/'/g,"\\'")}','${dk}',this)">${t('save_changes')}</button>
            <button class="action-btn del" onclick="cancelEditPendingGroup()">${t('cancel')}</button>
          </div>
        </div>`;
      }

      const lines = rows.map(b=>{
        const cit = catItemForRow_(b);
        const th = cit ? `<span class="pend-th" onclick="pendPhotoZoom('${cit.id}')"><img data-cid="${cit.id}" alt=""></span>` : '';
        return `<div class="item-line"><span style="display:inline-flex;align-items:center;">${th}<span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''}</span></span>
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <span>${qtyUi_(b)}</span>
            <button class="chip" style="cursor:pointer;padding:3px 9px;font-size:11px;border:1px solid var(--navy);background:#fff;color:var(--navy);" onclick="this.disabled=true;this.style.opacity='0.45';this.textContent='...';dispatchOne('${b.id}')">${t('dispatch_btn')}</button>
          </span>
        </div>`;
      }).join('');
      return `<div class="cust-card">
        <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>
          <span style="display:inline-flex;align-items:center;gap:6px;">
            <span class="set-pill pending">${total} ${t('badge_pending')}</span>
            <button class="action-btn pr" style="padding:5px 10px;font-size:12px;" onclick="this.disabled=true;this.style.opacity='0.45';this.textContent='${t('dispatching')}';dispatchGroupDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('dispatch_btn')}</button>
          </span>
        </div>
        ${lines}
        ${pendLocHtml_(rows)}
        <div class="action-row">
          ${pendLocBtn_(rows)}
          <button class="action-btn wa" onclick="shareWhatsAppPendingDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('whatsapp')}</button>
          <button class="action-btn pr" onclick="printPendingOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('print')}</button>
          <button class="action-btn pr" onclick="startEditPendingGroup('${cname.replace(/'/g,"\\'")}','${dk}')">${t('edit_btn')}</button>
          ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deletePendingOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('delete_btn')}</button>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="date-section-label">${dispatchDateLabel(dk)}</div>${custCards}`;
  }).join('');

  main.innerHTML = searchBar + `<div id="pdResults">${cards}</div>`;
  catHydrate_(main);
}

function removeEditNewLine_(i){

function startEditPendingGroup(cname, dk){

function removePendingEditRow(bookingId){
  if(!confirm('Delete this line from the order?\nAre you sure?')) return;
  const row = document.querySelector(`#editDesign-${bookingId}`)?.closest('.item-line');

// Stages one new design/size line (sizes can be typed together, e.g. "2/6 8/16").
// Returns true if something was staged, false if there was an error or nothing to add.
function addEditNewLine_(){
  if(!editingPendingGroup) return false;
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const design = val('editNewDesign'), colourRaw = val('editNewColour'), rawSize = val('editNewSize');
  const brand = val('editNewBrand'), price = val('editNewPrice');
  const qty = parseInt(val('editNewQty')) || 0;
  const unit = val('editNewUnit') || 'set';
  const msg = document.getElementById('editNewMsg');
  if(!design && !rawSize) return false;                         // nothing typed
  if(!design){ if(msg) msg.innerHTML = `<div class="msg err">${t('enter_design_err')}</div>`; return false; }
  if(!rawSize || qty <= 0){ if(msg) msg.innerHTML = `<div class="msg err">${t('size_qty_err')}</div>`; return false; }

  const tokens = rawSize.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
  const sizes = tokens.length === 1 ? expandSizeRange_(tokens[0], brand) : tokens;
  if(!sizes.length){ if(msg) msg.innerHTML = `<div class="msg err">${t('size_qty_err')}</div>`; return false; }
  const colours = parseColourList_(colourRaw);

  const { cname, dk } = editingPendingGroup;
  const groupRows = getPendingDatedRows(cname, dk);
  const nd = normKey_(design), nb = normKey_(brand);
  const dups = [], ok = [];
  colours.forEach(col=>{
    const nc = normKey_(col);
    sizes.forEach(size=>{
      const ns = normKey_(size);
      if(ok.some(x=>normKey_(x.colour)===nc && normKey_(x.size)===ns)) return;
      // exactly the same line already in THIS order (or already staged)
      const inOrder = groupRows.some(b=>normKey_(b.designNumber)===nd && normKey_(b.colour)===nc && normKey_(b.size)===ns && normKey_(b.brand)===nb) ||
        editNewLines_.some(l=>normKey_(l.design)===nd && normKey_(l.colour)===nc && normKey_(l.size)===ns);
      if(inOrder){ dups.push({ colour: col, size, saved: null }); return; }
      // exactly the same line ordered earlier on ANOTHER date
      const other = nb ? bookings.find(b=>!b.trashed && normKey_(b.customerName)===normKey_(cname) && normKey_(b.brand)===nb &&
        normKey_(b.designNumber)===nd && normKey_(b.colour)===nc && normKey_(b.size)===ns && dispatchDateKey(b.orderedAt)!==dk) : null;
      if(other){ dups.push({ colour: col, size, saved: other }); return; }
      ok.push({ colour: col, size });
    });
  });
  if(dups.length){
    showDuplicateList_(design, dups, ok.length > 0);
    if(!ok.length) return false;
  }

  ok.forEach(x=> editNewLines_.push({ design, colour: x.colour, size: x.size, qty, unit, brand, price }));
  ['editNewDesign','editNewColour','editNewSize','editNewPrice'].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ''; });
  const q = document.getElementById('editNewQty'); if(q) q.value = '1';
  if(msg) msg.innerHTML = '';
  refreshEditNewList_();
  const d = document.getElementById('editNewDesign'); if(d) d.focus();
  return true;
}

async function saveEditPendingGroup(cname, dk, btn){
  if(isSavingEdit_) return;
  // Anything typed in the "add new line" boxes but not yet tapped "+ Add" is added now.
  const hasTyped = ['editNewDesign','editNewSize'].some(id=>{ const el = document.getElementById(id); return el && el.value.trim(); });
  if(hasTyped && !addEditNewLine_()) return;     // error already shown — stay in edit mode

  // Show the button reacting RIGHT AWAY
  isSavingEdit_ = true;
  if(btn){ btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '⏳ ' + t('saving_word'); }
  const cancelBtn = btn && btn.parentElement ? btn.parentElement.querySelector('.del') : null;
  if(cancelBtn) cancelBtn.disabled = true;
  await new Promise(r=>setTimeout(r, 30));       // lets the browser paint the "Saving…" state first

  try{
    const rows = getPendingDatedRows(cname, dk);
    const baseOrderedAt = rows[0] ? rows[0].orderedAt : new Date().toISOString();
    const fallbackBrand = rows[0] ? (rows[0].brand || '') : '';
    for(const b of rows){
      const designEl = document.getElementById(`editDesign-${b.id}`);
      if(!designEl) continue; // row was marked removed
      const row = designEl.closest('.item-line');
      if(row && row.dataset.removed === '1'){
        b.trashed = true;
        b.trashedAt = new Date().toISOString();
        b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
        continue;
      }
      const newDesign = designEl.value.trim();
      const newColour = document.getElementById(`editColour-${b.id}`).value.trim();
      const newSize = document.getElementById(`editSize-${b.id}`).value.trim();
      const newQty = parseInt(document.getElementById(`editQty-${b.id}`).value) || b.qty;
      if(newDesign) b.designNumber = newDesign;
      b.colour = newColour;
      if(newSize) b.size = newSize;
      b.qty = newQty;
      const unEl = document.getElementById(`editUnit-${b.id}`);
      if(unEl) b.unit = unEl.value;
    }
    // New lines join the SAME order (same customer + same order date), so they show in this same card.
    let added = 0;
    editNewLines_.forEach(l=>{
      bookings.push({
        id: uid(),
        customerName: cname,
        brand: l.brand || fallbackBrand,
        designNumber: l.design,
        colour: l.colour || '',
        size: l.size,
        qty: l.qty,
        unit: l.unit || 'set',
        pricePerPcs: l.price || '',
        status: 'pending',
        orderedAt: baseOrderedAt,
        dispatchedAt: null,
        orderedBy: currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null,
        addedLater: true
      });
      added += l.qty;
    });
    await saveData();
    await logActivity('Pending Order Edited', `${cname} — ${dispatchDateLabel(dk)}${added ? ' (+' + added + ' sets added)' : ''}`);
    editingPendingGroup = null;
    editNewLines_ = [];
    render();
    showInAppToast_(t('saved_ok'));
  } finally {
    isSavingEdit_ = false;
  }
}

// Row passes the Brand / Date filters typed in the Customers tab (if any), so the
// card, its totals, Print, WhatsApp and Delete all use exactly the same rows.
function custRowOk_(b){
  const bq = customerBrandFilter.trim().toLowerCase();
  if(bq && !(b.brand||'').toLowerCase().includes(bq)) return false;
  if(customerDateFilter){
    const od = dispatchDateKey(b.orderedAt)===customerDateFilter;
    const dd = b.dispatchedAt && dispatchDateKey(b.dispatchedAt)===customerDateFilter;
    if(!od && !dd) return false;
  }
  return true;
}
function buildCustomerOrderPdf(cname){
  // Grouped by date first (oldest at top, going down to the most recent),
  // so every line from the same date sits together as one block, instead
  // of dates being mixed together by design number.
  const rows = bookings.filter(b=>b.customerName===cname && !b.trashed && custRowOk_(b))
    .sort((a,b)=> dispatchDateKey(a.orderedAt).localeCompare(dispatchDateKey(b.orderedAt)) || (a.designNumber).localeCompare(b.designNumber));
  const hdr = unitHdr_(rows);
  // Includes the order date per line — this list spans every order a
  // customer has ever placed, so staff need to see which line came from
  // which date. Pending and Dispatched sets sit in separate columns.
  const tableRows = rows.map(b=>{
    const done = b.status==='dispatched';
    return [dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.designNumber, b.colour||'-', b.size, b.brand||'-', done ? '' : qtyCell_(b, hdr), done ? qtyCell_(b, hdr) : ''];
  });
  const total = totalsUi_(rows);
  const pendRowsX = rows.filter(b=>b.status!=='dispatched'), doneRowsX = rows.filter(b=>b.status==='dispatched');
  const pp = pdfWithPrice_(['Date','Design Number','Colour','Size','Brand',`Pending ${hdr}`,`Dispatched ${hdr}`], tableRows, rows, 'Brand');
  const setIdx = pp.columns.length - 2;
  const colStyles = {}; colStyles[setIdx] = { halign:'center' }; colStyles[setIdx+1] = { halign:'center' };
  return {
    blob: buildPdfBlob(`${cname}`, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, pp.columns, pp.tableRows, `Pending: ${totalsPdf_(pendRowsX)}   |   Dispatched: ${totalsPdf_(doneRowsX)}   |   Total: ${totalsPdf_(rows)}${amtFooter_(pp)}`, { columnStyles: colStyles, heading: 'Order Status' }),
    total
  };
}

/* ---------------- EDIT CUSTOMER NAME / CITY ----------------
   Fixes a wrongly typed customer name (or city). Every order of that customer — pending,
   dispatched and deleted — moves to the corrected name. If the corrected name is the same
   as another existing customer, the two are merged into one. */
function editCustomerName(oldName){
  const old = document.getElementById('renameCustOverlay');
  if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'renameCustOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `
    <div style="background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px 22px;box-shadow:0 -6px 24px rgba(0,0,0,.25);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="font-weight:700;font-size:16px;color:#1B2430;">✏️ Edit Customer Name</div>
        <button id="renCustClose" style="background:none;border:none;font-size:22px;color:#5b6472;">✕</button>
      </div>
      <div style="font-size:12.5px;color:#5b6472;margin-bottom:8px;">Correct the name / city. All orders of this customer will be updated.</div>
      <input id="renCustInput" value="${escapeHtml(oldName)}" autocomplete="off" style="margin-bottom:10px;">
      <div id="renCustMsg"></div>
      <div style="display:flex;gap:8px;">
        <button id="renCustCancel" style="flex:1;background:#EAF1FB;color:#1656A6;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">${t('cancel')}</button>
        <button id="renCustSave" style="flex:1;background:#1656A6;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">${t('save_changes')}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.getElementById('renCustClose').onclick = close;
  document.getElementById('renCustCancel').onclick = close;
  const inp = document.getElementById('renCustInput');
  inp.focus(); inp.select();
  const doSave = async ()=>{
    const btn = document.getElementById('renCustSave');
    const msg = document.getElementById('renCustMsg');
    const newRaw = inp.value.trim().replace(/\s+/g,' ');
    if(!newRaw){ msg.innerHTML = `<div class="msg err">${t('enter_customer_err')}</div>`; return; }
    if(newRaw === oldName){ close(); return; }
    // Same name as a DIFFERENT existing customer -> merge into that customer's spelling
    const other = bookings.find(b=>b.customerName !== oldName && normKey_(b.customerName) === normKey_(newRaw));
    const finalName = other ? String(other.customerName) : newRaw;
    if(other && !confirm(`"${finalName}" already exists.\nMerge all orders of "${oldName}" into it?\nAre you sure?`)) return;
    btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '⏳ ' + t('saving_word');
    await new Promise(r=>setTimeout(r, 30));
    let n = 0;
    bookings.forEach(b=>{ if(b.customerName === oldName){ b.customerName = finalName; n++; } });
    if(expandedCustomer === oldName) expandedCustomer = finalName;
    editingPendingGroup = null;
    await saveData();
    await logActivity('Customer Renamed', `${oldName} → ${finalName} (${n} lines)`);
    close();
    render();
    showInAppToast_(t('saved_ok'));
  };
  document.getElementById('renCustSave').onclick = doSave;
  inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); doSave(); } });
}

function renderCustomers(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  let customers = [...new Set(activeBookings.map(b=>b.customerName))]
    .filter(c=>c.toLowerCase().includes(customerFilter.trim().toLowerCase()));

  // Only customers who have at least one order matching the Brand AND Date filters together.
  if(customerBrandFilter.trim() || customerDateFilter){
    customers = customers.filter(c=>activeBookings.some(b=>b.customerName===c && custRowOk_(b)));
  }

  if(!activeBookings.length){
    main.innerHTML = `<div class="card"><div class="empty">${t('no_order_yet')}</div></div>`;
    return;
  }

  const cards = customers.map(cname=>{
    const rows = activeBookings.filter(b=>b.customerName===cname && custRowOk_(b));
    const doneRows_ = rows.filter(b=>b.status==='dispatched');
    const pendRows_ = rows.filter(b=>b.status!=='dispatched');
    const total = totalsShort_(rows);
    const done = totalsShort_(doneRows_);
    const pending = totalsShort_(pendRows_);
    const hasPending_ = pendRows_.length > 0;
    const isOpen = expandedCustomer === cname;

    let detail = '';
    if(isOpen){
      const dispatchedRows = rows.filter(b=>b.status==='dispatched');
      const pendingRows = rows.filter(b=>b.status==='pending');
      detail = `<div class="cust-detail">
        ${dispatchedRows.length ? `<div class="section-label">${t('ready_goods')}</div>` + dispatchedRows.map(b=>`
          <div class="li"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${qtyShort_(b)}</span>
          <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></div>
        `).join('') : ''}
        ${pendingRows.length ? pendingBlockHtml_(cname, pendingRows) : ''}
        ${orderLocHtml_(rows)}
      </div>`;
    }

    return `<div class="cust-card" onclick="toggleCustomer('${cname.replace(/'/g,"\\'")}')" style="cursor:pointer;">
      <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>
        <span class="set-pill ${hasPending_?'pending':'done'}">${hasPending_ ? pending+' '+t('badge_pending') : t('complete')}</span>
      </div>
      <div class="summary-row">
        <span>${t('total')}: ${total}</span>
        <span>${t('dispatched')}: ${done}</span>
        <span>${t('pending_sets')}: ${pending}</span>
      </div>
      <div class="action-row" onclick="event.stopPropagation();">
        <button class="action-btn wa" onclick="shareWhatsAppCustomer('${cname.replace(/'/g,"\\'")}')">${t('whatsapp')}</button>
        <button class="action-btn pr" onclick="printCustomerOrder('${cname.replace(/'/g,"\\'")}')">${t('print')}</button>
        <button class="action-btn pr" style="background:#fff;color:var(--navy);border:1.5px solid var(--navy);" onclick="editCustomerName('${cname.replace(/'/g,"\\'")}')">✏️ ${t('edit_btn')}</button>
        ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteCustomerOrderFull('${cname.replace(/'/g,"\\'")}')">${t('delete_btn')}</button>` : ''}
      </div>
      ${detail}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card filter-input" style="margin-bottom:14px;">
      <label>${t('search_customer')}</label>
      <input id="custFilter" placeholder="${t('type_name')}" value="${escapeHtml(customerFilter)}" oninput="onCustomerFilter(this.value)">
      <label style="margin-top:10px;">${t('search_by_brand')}</label>
      <input id="custBrandFilter" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(customerBrandFilter)}" oninput="onCustomerBrandFilter(this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="custDateFilter" type="date" value="${escapeHtml(customerDateFilter)}" oninput="onCustomerDateFilter(this.value)">
    </div>
    <div id="custResults">${cards || `<div class="empty">${t('no_customer_found')}</div>`}</div>
  `;
}

// Builds the "Pending Order" part of an opened customer card, including the Cancel
// button next to the heading and the tick-boxes / Select All when Cancel is switched on.
function pendingBlockHtml_(cname, pendingRows){
  const cq = cname.replace(/'/g, "\\'");
  const inCancel = (pendingCancelFor === cname);
  const selCount = pendingRows.filter(b=>pendingCancelSel.has(b.id)).length;
  const allSel = pendingRows.length > 0 && selCount === pendingRows.length;

  let html = `<div class="section-label pend-head"><span>${t('pending_order')}</span>` +
    `<button class="pend-cancel-btn" onclick="event.stopPropagation(); startPendingCancel('${cq}')">${inCancel ? t('pend_cancel_close') : t('pend_cancel')}</button>` +
    `</div>`;

  if(inCancel){
    html += `<label class="pend-sel-row pend-selall" onclick="event.stopPropagation()">
      <input type="checkbox" ${allSel?'checked':''} onchange="togglePendingCancelAll('${cq}')">
      <span><b>${t('pend_select_all')}</b> (${pendingRows.length})</span></label>`;
  }

  html += pendingRows.map(b=>{
    const label = `${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${qtyShort_(b)}`;
    if(inCancel){
      return `<label class="pend-sel-row" onclick="event.stopPropagation()">
        <input type="checkbox" ${pendingCancelSel.has(b.id)?'checked':''} onchange="togglePendingCancelSel('${b.id}')">
        <span>${label}</span></label>`;
    }
    return `<div class="li"><span>${label}</span><span style="color:var(--rust);">${t('badge_pending')}</span></div>`;
  }).join('');

  if(inCancel){
    html += `<div class="pend-cancel-bar"><button class="action-btn del" ${selCount?'':'disabled'} onclick="event.stopPropagation(); confirmPendingCancel('${cq}')">${t('pend_cancel_selected')} (${selCount})</button></div>`;
  }
  return html;
}

function startPendingCancel(cname){

  if(pendingCancelFor !== cname && !canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }

  markBusy(t('processing_word'));
  const now = new Date().toISOString();
  const by = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  const idSet = new Set(ids);
  let total = 0;
  bookings.forEach(b=>{

  pendingCancelFor = null;

const gid_ = id => document.getElementById(id);
let catalog = [];          // [{id,name,sizes,rate,brand,hidden,parts,imgV,createdAt}]  (photos are stored separately)
let catalogInbox = [];     // orders placed by customers from the catalog link

let lastSyncAt_ = null;
/* ---------- Catalog list is stored in PAGES: when one Google-Sheet cell is nearly full, the next designs go to the next row automatically ---------- */
const CAT_PAGE_MAX = 40000;                 // a Google Sheet cell holds 50,000 characters — stay safely below
let catPagesSaved_ = [];                    // the page texts as last saved/loaded, so only changed pages are re-sent
function catPageKey_(i){ return i === 0 ? 'catalog' : 'catalog_' + i; }
function catPaginate_(list){
  const stored = list.slice().reverse();    // oldest first -> new designs only touch the LAST page
  const pages = []; let cur = [], len = 2;
  for(const it of stored){
    const j = JSON.stringify(it);
    if(cur.length && len + j.length + 1 > CAT_PAGE_MAX){ pages.push(cur); cur = []; len = 2; }
    cur.push(it); len += j.length + 1;
  }
  pages.push(cur);
  return pages.map(p=>JSON.stringify(p));
}
function catFromPages_(texts, paged){
  const all = [].concat(...texts.map(t=>{ try{ return JSON.parse(t) || []; }catch(e){ return []; } }));
  return paged ? all.reverse() : all;
}
function catLoadLocal_(){
  try{
    const raw0 = localStorage.getItem('ssa_catalog');
    if(raw0 === null) return [];
    let meta = null; try{ meta = JSON.parse(localStorage.getItem('ssa_catalogMeta') || 'null'); }catch(e){}
    if(!meta || meta.v !== 2){ catPagesSaved_ = [raw0]; return catFromPages_([raw0], false); }
    const pages = [raw0];
    for(let i = 1; i < meta.pages; i++) pages.push(localStorage.getItem('ssa_' + catPageKey_(i)) || '[]');
    catPagesSaved_ = pages;
    return catFromPages_(pages, true);
  }catch(e){ return []; }
}
// Reads the whole catalog from the cloud (all pages). Returns { list, pages, sig } or null if it could not be read completely.
async function catLoadAll_(){
  const r = await Promise.all([ storageGet('catalogMeta'), storageGet('catalog') ]);
  const rawMeta = r[0], raw0 = r[1];
  if(raw0 === null || raw0 === undefined) return { list:[], pages:[], sig:'' };
  let meta = null; try{ meta = rawMeta ? JSON.parse(rawMeta) : null; }catch(e){}
  if(!meta || meta.v !== 2) return { list:catFromPages_([raw0], false), pages:[raw0], sig:raw0 };   // old single-cell format
  const pages = [raw0], idx = [];
  for(let i = 1; i < meta.pages; i++) idx.push(i);
  for(let k = 0; k < idx.length; k += 4){
    const got = await Promise.all(idx.slice(k, k + 4).map(i=>storageGet(catPageKey_(i))));
    for(const g of got){ if(g === null || g === undefined) return null; pages.push(g); }
  }
  return { list:catFromPages_(pages, true), pages, sig:rawMeta + '\u0001' + pages.join('\u0001') };
}
function catBusy_(){
  const busy = k=>isKeyBusy_(k);
  if(busy('catalog') || busy('catalogMeta')) return true;
  return [...dirtyKeys, ...pushInFlight_, ...pushQueued_].some(k=>/^catalog_\d+$/.test(k));
}
catalog = catLoadLocal_();

async function saveCatalog(){
  try{
    const pages = catPaginate_(catalog), oldN = catPagesSaved_.length;
    for(let i = 0; i < pages.length; i++){ if(pages[i] !== catPagesSaved_[i]) await storageSet(catPageKey_(i), pages[i]); }
    await storageSet('catalogMeta', JSON.stringify({ v:2, pages:pages.length }));
    for(let i = pages.length; i < oldN; i++) await storageSet(catPageKey_(i), '[]');   // clear pages that are no longer needed
    catPagesSaved_ = pages;
  }catch(e){ console.error('catalog save failed', e); }
}

/* ---------- Photos: stored in small pieces (separate keys) so the sheet never chokes ---------- */
const CAT_CHUNK = 40000;
const catImgMem_ = {};
function idbOpen_(){ return new Promise((res, rej)=>{ const r = indexedDB.open('ssa_cat', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('img'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function idbGet_(k){ try{ const db = await idbOpen_(); return await new Promise(res=>{ const q = db.transaction('img').objectStore('img').get(k); q.onsuccess = ()=>res(q.result || null); q.onerror = ()=>res(null); }); }catch(e){ return null; } }
async function idbSet_(k, v){ try{ const db = await idbOpen_(); db.transaction('img', 'readwrite').objectStore('img').put(v, k); }catch(e){} }
function catKey_(it){ return it.id + ':' + (it.imgV || 0); }

let catActive_ = 0; const catWait_ = [];
function catLimit_(fn){                       // at most 3 photo downloads at the same time
  return new Promise(res=>{
    const run = async ()=>{ catActive_++; try{ res(await fn()); }finally{ catActive_--; const n = catWait_.shift(); if(n) n(); } };
    if(catActive_ < 3) run(); else catWait_.push(run);
  });
}
function catDriveUrl_(id, w){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 640); }
async function catGetImg_(it, big){
  if(it && it.fileId) return catDriveUrl_(it.fileId, big ? 1000 : 640);   // photo lives in Google Drive; only the link is kept in the sheet
  if(!it || !it.parts) return '';
  const ck = catKey_(it);
  if(catImgMem_[ck]) return catImgMem_[ck];
  let v = await idbGet_(ck);
  if(!v){
    if(!navigator.onLine) return '';
    try{
      let s = '';
      for(let i = 0; i < it.parts; i++){
        const r = await fetch(`${SHEET_SCRIPT_URL}?key=${encodeURIComponent('catimg_' + it.id + '_' + i)}`);
        const d = await r.json();
        if(!d || d.value == null) return '';
        s += d.value;
      }
      v = s; idbSet_(ck, v);
    }catch(e){ return ''; }
  }
  catImgMem_[ck] = v;
  return v;
}
function catHydrate_(root){
  const load = el=>{
    const it = catalog.find(c=>c.id === el.dataset.cid);
    catLimit_(()=>catGetImg_(it)).then(src=>{ if(src){ el.src = src; el.classList.add('on'); } });
  };
  const io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); load(e.target); } }), { rootMargin:'300px' })
    : null;
  root.querySelectorAll('img[data-cid]').forEach(el=>{
    const it = catalog.find(c=>c.id === el.dataset.cid);
    const mem = it && catImgMem_[catKey_(it)];
    if(mem){ el.src = mem; el.classList.add('on'); }
    else if(io) io.observe(el); else load(el);
  });
}
function catEncode_(file){                    // shrinks the photo so it is light but still clear
  return new Promise((resolve, reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let side = 800, out = '';
      for(let k = 0; k < 4; k++){
        const sc = Math.min(1, side / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', 0.72 - k * 0.07);
        if(out.length <= 130000) break;
        side = Math.round(side * 0.8);
      }
      resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
// Saves the photo INSIDE the Google Sheet (in small pieces). Nothing goes to Google Drive. Returns the number of pieces.
async function catUploadImg_(id, dataUrl){
  const b64 = dataUrl.split(',')[1] || '';
  const n = Math.max(1, Math.ceil(b64.length / CAT_CHUNK));
  const mk = i=>({ key:'catimg_' + id + '_' + i, value:(i === 0 ? 'data:image/jpeg;base64,' : '') + b64.slice(i * CAT_CHUNK, (i + 1) * CAT_CHUNK) });
  for(let i = 0; i < n; i++){
    let ok = false;
    for(let tries = 0; tries < 3 && !ok; tries++){
      try{ const r = await postToSheet_(mk(i)); ok = !!r && r.ok !== false; }catch(e){ ok = false; }
    }
    if(!ok) throw new Error('SHEET_SAVE_FAILED');
  }
  try{                                                        // make sure the last piece really landed
    const r = await fetch(`${SHEET_SCRIPT_URL}?key=${encodeURIComponent('catimg_' + id + '_' + (n - 1))}`);
    const d = await r.json();
    if(!d || d.value == null || d.value === '') throw new Error('x');
  }catch(e){ throw new Error('SHEET_SAVE_FAILED'); }
  return n;
}

/* ---- Reads the design number / size / rate printed on the photo and fills the empty boxes ---- */
let tessPromise_ = null;
function loadTesseract_(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessPromise_) tessPromise_ = loadScriptOnce_('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js').catch(e=>{ tessPromise_ = null; throw e; });
  return tessPromise_;
}
function catCanvas_(file, maxSide){
  return new Promise((resolve, reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
function catParseTag_(text){
  const out = { name:'', sizes:'', rate:'' };
  // Old phones may not support look-behind in regex; fall back gracefully instead of crashing.
  const mk = (s, f)=>{ try{ return new RegExp(s, f); }catch(e){ return new RegExp(s.replace(/\(\?<![^)]*\)/g, ''), f); } };
  let work = String(text || '')
    .replace(/(\d)\s*[|]\s*(\d)/g, '$1/$2').replace(/[|]/g, ' ')
    .replace(/[—–]/g, '-').replace(/[\u2018\u2019]/g, "'");
  const SZW = '(?:XXS|XS|S|M|L|XL|XXL|XXXL|2XL|3XL|4XL|5XL)';
  const SZ = mk('(?<![\\dA-Z])(\\d{1,2}\\s*[\\/-]\\s*\\d{1,2}|' + SZW + '\\s*[\\/-]\\s*' + SZW + ')(?![\\dA-Z])', 'gi');
  const clean = x=>x.replace(/\s+/g, '').replace(/-/g, '/').toUpperCase();

  // ---- RATE ----
  // 1) the word RATE / Rs / MRP / price with the number after it (same line or next line)
  // 2) a number followed by "/-"   e.g. 543/-
  const rateRes = [
    mk('(?:\\brate|\\brs\\b\\.?|₹|\\bmrp|\\bprice)[\\s:.\\-=]*(?:rs\\.?|₹)?[\\s:.\\-=]*(\\d{2,5})(?!\\d)', 'i'),
    mk('(?<!\\d)(\\d{2,5})\\s*[\\/|l]\\s*-', 'i'),
    mk('@\\s*(\\d{2,5})(?!\\d)', 'i')
  ];
  for(const re of rateRes){
    const m = work.match(re);
    if(m){ out.rate = m[1]; work = work.replace(m[0], ' '); break; }
  }

  // ---- SIZE ----
  // numbers written after / below the word SIZE are the size; otherwise look for a size-looking pair anywhere
  let found = [];
  const m1 = work.match(mk('\\bsizes?\\b[\\s:.\\-=]*([^\\n]{0,40}(?:\\n[^\\n]{0,40})?)', 'i'));
  if(m1){
    found = (m1[1].match(SZ) || []).map(clean);
    if(!found.length){ const one = m1[1].match(/^\s*(\d{1,2})(?!\d)/); if(one) found = [one[1]]; }
  }
  if(!found.length) found = (work.match(SZ) || []).map(clean);
  out.sizes = [...new Set(found)].slice(0, 4).join(' ');
  found.forEach(f=>{ work = work.replace(new RegExp(f.split('/').join('\\s*[\\/-]\\s*'), 'i'), ' '); });
  work = work.replace(/\bsizes?\b\s*[:.\-=]?/ig, ' ');

  // ---- DESIGN NUMBER ----
  // Only the code itself — never the words around it. A "#" or the word Design/Article comes first;
  // otherwise the FIRST number/code written on the photo (reading order) is the design number.
  const fix = s=>{
    s = s.toUpperCase();
    if(/^[0-9OIL]{4,8}$/.test(s) && (s.match(/\d/g) || []).length >= 3) s = s.replace(/O/g, '0').replace(/[IL]/g, '1');
    return s.replace(/^[-\/.]+|[-\/.]+$/g, '');
  };
  const TOK = '([A-Z]{0,3}\\d[A-Z0-9]{1,9}(?:[-\\/][A-Z0-9]{1,6})?)';
  const okTok = s=>{
    const d = (s.match(/\d/g) || []).length, l = (s.match(/[A-Z]/g) || []).length;
    return s.length <= 16 && d <= 10 && (d >= 3 || (d >= 2 && l >= 1)) && !/^(19|20)\d\d$/.test(s);
  };
  const labelled = [
    mk('#\\s*' + TOK, 'i'),
    mk('\\b(?:design|desgn|dsn|d\\.?\\s*no|article|art|model|item|code|style)\\b\\.?\\s*(?:no\\.?|number|#|:|-|=)*\\s*' + TOK, 'i')
  ];
  for(const re of labelled){ const m = work.match(re); if(m && okTok(fix(m[1]))){ out.name = fix(m[1]); break; } }
  if(!out.name){
    const re = mk('(?<![A-Z0-9])' + TOK + '(?![A-Z0-9])', 'gi');
    let m;
    while((m = re.exec(work))){ const s = fix(m[1]); if(okTok(s)){ out.name = s; break; } }   // first one wins
  }
  return out;
}
// One shared OCR engine: reads the photo twice (scattered-text mode, then normal mode) and merges what it found.
let ocrWorker_ = null, ocrChain_ = Promise.resolve();
async function getOcrWorker_(){
  await loadTesseract_();
  if(!ocrWorker_) ocrWorker_ = await Tesseract.createWorker('eng');
  return ocrWorker_;
}
function catReadPhoto_(file){
  const job = ocrChain_.then(async ()=>{
    let w; try{ w = await getOcrWorker_(); }catch(e){ ocrWorker_ = null; throw e; }
    const cv = await catCanvas_(file, 1800);
    const merged = { name:'', sizes:'', rate:'' };
    for(const psm of ['11', '3']){
      await w.setParameters({ tessedit_pageseg_mode: psm });
      const r = await w.recognize(cv);
      const f = catParseTag_(r && r.data && r.data.text);
      ['name', 'sizes', 'rate'].forEach(k=>{ if(!merged[k] && f[k]) merged[k] = f[k]; });
      if(merged.name && merged.sizes && merged.rate) break;
    }
    return merged;
  });
  ocrChain_ = job.catch(()=>{});
  return job;
}
async function catAutoFill_(file){
  const box = gid_('catOcr'); if(!box) return;
  const nm = gid_('catName'), sz = gid_('catSizes'), rt = gid_('catRate');
  if(nm.value.trim() && sz.value.trim() && rt.value.trim()){ box.innerHTML = ''; return; }
  if(!navigator.onLine){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="msg info">🔍 Reading design number / size / rate from the photo…</div>';
  try{
    const f = await catReadPhoto_(file);
    if(catFile !== file || !gid_('catOcr')) return;           // photo was changed/closed meanwhile
    const got = [];
    if(!nm.value.trim() && f.name){ nm.value = f.name; got.push('Design'); }
    if(!sz.value.trim() && f.sizes){ sz.value = f.sizes; got.push('Size'); }
    if(!rt.value.trim() && f.rate){ rt.value = f.rate; got.push('Rate'); }
    gid_('catOcr').innerHTML = got.length
      ? `<div class="msg ok">✓ Auto-filled from photo: ${got.join(', ')} — please check once.</div>`
      : '<div class="msg info">Could not find the design number / size / rate on the photo — please type them.</div>';
  }catch(e){
    console.error('photo read failed', e);
    const b = gid_('catOcr'); if(b) b.innerHTML = '<div class="msg info">Could not read the photo automatically — please type the details.</div>';
  }
}
/* ---- Hide a design from specific customers (matched by name / mobile; stored only as scrambled codes, never as plain numbers) ---- */
function cyrb53_(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function catNormName_(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g, ''); }
function catNormMob_(s){ return String(s || '').replace(/\D/g, '').slice(-10); }
function catHashes_(name, mob, email){
  const n = catNormName_(name), m = catNormMob_(mob), em = String(email || '').trim().toLowerCase();
  return { nh: n ? cyrb53_('ssa-n|' + n) : '', mh: m.length >= 10 ? cyrb53_('ssa-m|' + m) : '', eh: /^[^@\s]+@[^@\s]+$/.test(em) ? cyrb53_('ssa-e|' + em) : '', tail: m.length >= 10 ? m.slice(-4) : '' };
}
function catHiddenFor_(c, who){
  if(!c || !c.hideFor || !c.hideFor.length) return false;
  const h = catHashes_(who && who.name, who && who.phone, who && who.email);
  return c.hideFor.some(e=>(e.eh && h.eh && e.eh === h.eh) || (e.mh && h.mh && e.mh === h.mh) || (e.nh && h.nh && e.nh === h.nh));
}
let catHideFor = [], catBulkHideFor = [];

/* ---------- Customer orders arriving from the catalog link -> become normal Pending orders ---------- */
async function importCatalogOrders_(){
  if(!currentStaff || !catalogInbox.length || isKeyBusy_('bookings')) return false;
  const lineIds = new Set(bookings.map(b=>b.id));
  const known = new Set(catalogImported);
  const isNew = o=>o && o.id && !known.has(o.id) && !lineIds.has('cat_' + o.id + '_0');
  if(!catalogInbox.some(isNew)) return false;
  // Before importing, check the shared "already imported" list once (so a deleted order never comes back).
  try{
    const raw = await storageGet('catalogImported');
    if(raw){ JSON.parse(raw).forEach(x=>known.add(x)); }
  }catch(e){}
  const fresh = catalogInbox.filter(isNew);
  if(!fresh.length) return false;
  fresh.forEach(o=>{
    const added = [];
    (o.lines || []).forEach((l, i)=>{
      const id = 'cat_' + o.id + '_' + i;
      if(lineIds.has(id)) return;
      const row = {
        id, customerName:String(o.customerName || 'Catalog Customer'), city:o.city || '',
        brand:String(l.brand || 'Catalog Order'), designNumber:String(l.design), colour:l.colour || '',
        size:String(l.size), qty:Number(l.qty) || 1, unit:UNIT_EN[l.unit] ? l.unit : 'set',
        pricePerPcs:l.rate ? String(l.rate) : '', status:'pending', orderedAt:o.createdAt, dispatchedAt:null,
        orderedBy:{ name:'Catalog (Customer)', mobile:'' }, fromCatalog:true, catItemId:l.itemId || '', custPhone:o.phone || '', note:o.note || ''
      };
      bookings.push(row); lineIds.add(id); added.push(row);
      if(seenBookingIds_) seenBookingIds_.add(id);
    });
    known.add(o.id);
    if(added.length && notifyOrders && Date.now() - new Date(o.createdAt).getTime() < 6 * 3600 * 1000){
      showOrderNotification_(t('new_order_title'), `${o.customerName} · ${totalsUi_(added)} · Catalog`, 'ssa-co-' + o.id);
    }
  });
  const inboxIds = new Set(catalogInbox.map(o=>o.id));
  catalogImported = [...known].filter(x=>inboxIds.has(x));
  try{ localStorage.setItem('ssa_catalogImported', JSON.stringify(catalogImported)); }catch(e){}
  await saveData();
  await storageSet('catalogImported', JSON.stringify(catalogImported));
  await logActivity('Catalog Order Received', fresh.map(o=>`${o.customerName} (${(o.lines||[]).length} design)`).join(', '));
  return true;
}

/* ---------- Dashboard ---------- */
let dashPeriod = 'today', dashTab = 'both', dashRange = 7, dashMetric = 'qty', dashTrend = 'qty';
const DASH_PERIODS = [['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['fy','This Financial Year'],['all','All Time']];
function dashRanges_(p){
  const D = 86400000, now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let s, e, ps = null, pe = null;
  if(p === 'today'){ s = today; e = new Date(+today + D); ps = new Date(+today - D); pe = today; }
  else if(p === 'yesterday'){ s = new Date(+today - D); e = today; ps = new Date(+today - 2 * D); pe = s; }
  else if(p === 'week'){ const dow = (today.getDay() + 6) % 7; s = new Date(+today - dow * D); e = new Date(+s + 7 * D); ps = new Date(+s - 7 * D); pe = s; }
  else if(p === 'month'){ s = new Date(today.getFullYear(), today.getMonth(), 1); e = new Date(today.getFullYear(), today.getMonth() + 1, 1); ps = new Date(today.getFullYear(), today.getMonth() - 1, 1); pe = s; }
  else if(p === 'fy'){ const fy = today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1; s = new Date(fy, 3, 1); e = new Date(fy + 1, 3, 1); ps = new Date(fy - 1, 3, 1); pe = s; }
  else { s = new Date(0); e = new Date(8.64e15); }
  return { s, e, ps, pe };
}
function dashSets_(s, e){
  const inR = iso=>{ if(!iso) return false; const x = +new Date(iso); return x >= +s && x < +e; };
  const live = bookings.filter(b=>!b.trashed);
  return {
    ord: live.filter(b=>inR(b.orderedAt)),
    dis: live.filter(b=>b.status === 'dispatched' && inR(b.dispatchedAt)),
    del: bookings.filter(b=>b.trashed && inR(b.trashedAt)),
    inR
  };
}
const sumQ_ = a=>a.reduce((x, b)=>x + (Number(b.qty) || 0), 0);
function pctHtml_(cur, prev){
  if(prev == null) return '';
  if(!prev) return cur ? '<span class="up">▲ new</span>' : '';
  const p = Math.round((cur - prev) / prev * 100);
  return p === 0 ? '' : `<span class="${p > 0 ? 'up' : 'dn'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
}
function dashTop_(rows, keyFn){
  const m = {};
  rows.forEach(b=>{ const k = keyFn(b); if(!k) return; m[k] = (m[k] || 0) + (dashTrend === 'lines' ? 1 : (Number(b.qty) || 0)); });
  const arr = Object.entries(m).sort((a, b)=>b[1] - a[1]).slice(0, 5);
  if(!arr.length) return '<div class="subtle" style="padding:14px 0">No data for this period</div>';
  const mx = arr[0][1] || 1;
  return arr.map(([k, v])=>`<div class="trow"><div><span>${escapeHtml(k)}</span><b>${v}</b></div><div class="tbar"><i style="width:${Math.max(4, v / mx * 100)}%"></i></div></div>`).join('');
}
function dashChart_(){
  const D = 86400000, n = dashRange, now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = [];
  for(let i = n - 1; i >= 0; i--) days.push(new Date(+today - i * D));
  const live = bookings.filter(b=>!b.trashed);
  const val = a=>dashMetric === 'lines' ? a.length : sumQ_(a);
  const data = days.map(d=>{
    const s = +d, e = s + D;
    const inR = iso=>{ if(!iso) return false; const x = +new Date(iso); return x >= s && x < e; };
    return { d, o:val(live.filter(b=>inR(b.orderedAt))), x:val(live.filter(b=>b.status === 'dispatched' && inR(b.dispatchedAt))) };
  });
  const mx = Math.max(1, ...data.map(r=>dashTab === 'ord' ? r.o : dashTab === 'dis' ? r.x : Math.max(r.o, r.x)));
  const step = n > 14 ? 5 : 1;
  return `<div class="chart">${data.map((r, i)=>`
    <div class="bcol"><div class="bpair">
      ${dashTab !== 'dis' ? `<div class="bar" style="height:${r.o / mx * 100}%" title="Orders: ${r.o}"></div>` : ''}
      ${dashTab !== 'ord' ? `<div class="bar d" style="height:${r.x / mx * 100}%" title="Dispatched: ${r.x}"></div>` : ''}
    </div><div class="blab">${(n - 1 - i) % step === 0 ? r.d.getDate() + '/' + (r.d.getMonth() + 1) : ''}</div></div>`).join('')}</div>
    <div class="legend">${dashTab !== 'dis' ? '<span><i></i>Orders</span>' : ''}${dashTab !== 'ord' ? '<span><i class="d"></i>Dispatched</span>' : ''}</div>`;
}
function renderDashboard(main){

  const trendRows = cur.ord;

        <select class="pill-select" onchange="dashPeriod=this.value;render()">${DASH_PERIODS.map(p=>`<option value="${p[0]}" ${p[0] === dashPeriod ? 'selected' : ''}>${p[1]}</option>`).join('')}</select></div>
      <div class="dash-grid">
        <div class="dcard span2"><div class="dtitle"><i>📋</i>Sales Department</div><div class="dstats">
          ${st('Orders', totalsShort_(cur.ord), pctHtml_(sumQ_(cur.ord), prev ? sumQ_(prev.ord) : null))}
          ${st('Dispatched', totalsShort_(cur.dis), pctHtml_(sumQ_(cur.dis), prev ? sumQ_(prev.dis) : null))}
          ${st('Pending (now)', totalsShort_(pending))}
          ${st('Deleted', totalsShort_(cur.del))}</div></div>
        <div class="dcard"><div class="dtitle"><i>👤</i>Customers</div><div class="dstats">

    <div class="dash-sec">Trending — ${DASH_PERIODS.find(p=>p[0] === dashPeriod)[1]}</div>
    <div class="trend-grid">
      <div class="tcard"><div class="thead">Customers<select class="pill-select sm" onchange="dashTrend=this.value;render()"><option value="qty" ${dashTrend === 'qty' ? 'selected' : ''}>Qty wise</option><option value="lines" ${dashTrend === 'lines' ? 'selected' : ''}>Order wise</option></select></div>${dashTop_(trendRows, b=>b.customerName)}</div>

    </div>
    <div class="chart-card">
      <div class="chart-tabs">
        <button class="${dashTab === 'ord' ? 'on' : ''}" onclick="dashTab='ord';render()">Orders</button>
        <button class="${dashTab === 'dis' ? 'on' : ''}" onclick="dashTab='dis';render()">Dispatched</button>
        <button class="${dashTab === 'both' ? 'on' : ''}" onclick="dashTab='both';render()">Both</button>
        <span class="sp"></span>
        <select class="pill-select sm" onchange="dashMetric=this.value;render()"><option value="qty" ${dashMetric === 'qty' ? 'selected' : ''}>Quantity</option><option value="lines" ${dashMetric === 'lines' ? 'selected' : ''}>Order lines</option></select>
        <select class="pill-select sm" onchange="dashRange=+this.value;render()"><option value="7" ${dashRange === 7 ? 'selected' : ''}>Last 7 Days</option><option value="30" ${dashRange === 30 ? 'selected' : ''}>Last 30 Days</option></select>
      </div>
      ${dashChart_()}
    </div>`;
}

async function pubSendOrder_(order){
  const sleep = ms=>new Promise(r=>setTimeout(r, ms));
  for(let attempt = 0; attempt < 3; attempt++){
    try{
      const raw = await pubFetchKey_('catalogInbox');
      let arr = []; try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr = []; }
      arr = arr.filter(o=>o && Date.now() - new Date(o.createdAt).getTime() < 30 * 86400000);
      if(!arr.some(o=>o.id === order.id)) arr.push(order);
      await postToSheet_({ key:'catalogInbox', value:JSON.stringify(arr) });
      await sleep(1300);
      const chk = await pubFetchKey_('catalogInbox');                 // make sure it really landed
      if(chk && JSON.parse(chk).some(o=>o.id === order.id)) return true;
    }catch(e){ console.error('order send attempt failed', e); await sleep(800); }
  }
  return false;
}

const pubThumb_ = {};
function pubShrink_(src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{
      const sc = Math.min(1, 160 / im.height), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res({ d:c.toDataURL('image/jpeg', 0.7), w:c.width, h:c.height });
    };
    im.onerror = ()=>res(null);
    im.src = src;
  });
}
async function pubLoadThumbs_(order){
  const items = [...new Set(order.lines.map(l=>l.itemId))].map(id=>catalog.find(c=>c.id === id)).filter(Boolean);
  const need = items.filter(it=>it.fileId && !pubThumb_[it.id]);
  if(need.length && navigator.onLine){
    try{
      const res = await postToSheet_({ action:'getCatalogImages', fileIds:need.map(i=>i.fileId) });
      const d = await res.json();
      if(d && d.ok && d.images){ for(const it of need){ if(d.images[it.fileId]) pubThumb_[it.id] = await pubShrink_(d.images[it.fileId]); } }
    }catch(e){ console.error('thumbnails for PDF failed', e); }
  }
  for(const it of items.filter(i=>!i.fileId && i.parts && !pubThumb_[i.id])){
    try{ const src = await catGetImg_(it); if(src) pubThumb_[it.id] = await pubShrink_(src); }catch(e){}
  }

// Registers the offline service worker so the app itself (HTML/CSS/JS) can
// load with no internet at all — the data layer above already handles
// working offline and syncing back once a connection returns.
if('serviceWorker' in navigator && !PUBLIC_MODE){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });

  // was updated and its CACHE_NAME changed), reload once automatically so
  // the page actually shows the new version straight away — instead of
  // everyone needing to refresh three or four times by hand before the new
  // copy finally wins.
  let swRefreshed_ = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed_) return;
    swRefreshed_ = true;
    window.location.reload();
  });
}
</script>
