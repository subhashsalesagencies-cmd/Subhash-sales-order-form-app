function onPdSearch(which, val){
  if(which==='customer') pdSearchCustomer = val;
  else if(which==='brand') pdSearchBrand = val;
  else if(which==='from') pdFromDate = val;
  else pdToDate = val;
  render();
  setTimeout(()=>{
    const id = which==='customer' ? 'pdSearchCustomer' : which==='brand' ? 'pdSearchBrand' : which==='from' ? 'pdFromDate' : 'pdToDate';
    const el = document.getElementById(id);
    if(!el) return;
    el.focus();
    if(which==='customer' || which==='brand') el.setSelectionRange(el.value.length, el.value.length);
  }, 0);
}

async function deletePendingOrder(cname){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`${t('delete_confirm_1')} ${cname}?`)) return;
  markBusy(t('deleting_word'));
  let rows = bookings.filter(b=>b.status==='pending' && !b.trashed && b.customerName===cname);
  if(pdSearchBrand.trim()){
    const bq = pdSearchBrand.trim().toLowerCase();
    rows = rows.filter(b=>(b.brand||'').toLowerCase().includes(bq));
  }
  if(pdFromDate || pdToDate){
    rows = rows.filter(b=>inPdRange_(b.orderedAt));
  }
  let total = 0;
  rows.forEach(b=>{
    b.trashed = true;
    b.trashedAt = new Date().toISOString();
    b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
    total += b.qty;
  });
  await saveData();
  await logActivity('Order Deleted', `${cname} — ${total} sets (from Pending tab)`);
  render();
}

async function deleteAllByBrand(){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  const bq = pdSearchBrand.trim();
  if(!bq) return;
  const bql = bq.toLowerCase();
  const matches = bookings.filter(b=>b.status==='pending' && !b.trashed && (b.brand||'').toLowerCase().includes(bql));
  if(!matches.length){ alert(t('no_pending_for_brand')); return; }
  markBusy(t('deleting_word'));
  const custCount = new Set(matches.map(b=>b.customerName)).size;
  const totalSets = matches.reduce((s,b)=>s+b.qty,0);

  if(!confirm(`${t('bulk_confirm_1')} "${bq}" — ${custCount} ${t('bulk_confirm_customers')}, ${totalSets} ${t('sets')}. ${t('bulk_confirm_continue')}`)) return;
  if(!confirm(t('bulk_confirm_2'))) return;
  if(!confirm(`${t('bulk_confirm_3')} ${totalSets} ${t('sets')} — "${bq}"?`)) return;

  matches.forEach(b=>{
    b.trashed = true;
    b.trashedAt = new Date().toISOString();
    b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  });
  await saveData();
  await logActivity('Bulk Order Deleted (Brand)', `${bq} — ${custCount} customers, ${totalSets} sets`);
  render();
}

/* ---------------- CUSTOMER-WISE TAB ---------------- */

// Row passes the Brand / Date filters typed in the Customers tab (if any), so the
// card, its totals, Print, WhatsApp and Delete all use exactly the same rows.
function custRowOk_(b){
  const bq = customerBrandFilter.trim().toLowerCase();
  if(bq && !(b.brand||'').toLowerCase().includes(bq)) return false;
  if(customerDateFilter){
    const od = dispatchDateKey(b.orderedAt)===customerDateFilter;
    const dd = b.dispatchedAt && dispatchDateKey(b.dispatchedAt)===customerDateFilter;
    if(!od && !dd) return false;
  }
  return true;
}
function buildCustomerOrderPdf(cname){
  // Grouped by date first (oldest at top, going down to the most recent),
  // so every line from the same date sits together as one block, instead
  // of dates being mixed together by design number.
  const rows = bookings.filter(b=>b.customerName===cname && !b.trashed && custRowOk_(b))
    .sort((a,b)=> dispatchDateKey(a.orderedAt).localeCompare(dispatchDateKey(b.orderedAt)) || (a.designNumber).localeCompare(b.designNumber));
  let pendTot = 0, doneTot = 0;
  // Includes the order date per line — this list spans every order a
  // customer has ever placed, so staff need to see which line came from
  // which date. Pending and Dispatched sets sit in separate columns.
  const tableRows = rows.map(b=>{
    const done = b.status==='dispatched';
    if(done) doneTot += b.qty; else pendTot += b.qty;
    return [dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.designNumber, b.colour||'-', b.size, b.brand||'-', done ? '' : String(b.qty), done ? String(b.qty) : ''];
  });
  const total = pendTot + doneTot;
  const pp = pdfWithPrice_(['Date','Design Number','Colour','Size','Brand','Pending Set','Dispatched Set'], tableRows, rows, 'Brand');
  const setIdx = pp.columns.length - 2;
  const colStyles = {}; colStyles[setIdx] = { halign:'center' }; colStyles[setIdx+1] = { halign:'center' };
  return {
    blob: buildPdfBlob(`${cname}`, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, pp.columns, pp.tableRows, `Pending: ${pendTot} Set   |   Dispatched: ${doneTot} Set   |   Total: ${total} Set`, { columnStyles: colStyles, heading: 'Order Status' }),
    total
  };
}

async function shareWhatsAppCustomer(cname){

  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}.pdf`, `Order — ${cname}`, `Order — ${cname}, Total ${total} Sets`);
}

function printCustomerOrder(cname){

}


/* ---------------- EDIT CUSTOMER NAME / CITY ----------------
   Fixes a wrongly typed customer name (or city). Every order of that customer — pending,
   dispatched and deleted — moves to the corrected name. If the corrected name is the same
   as another existing customer, the two are merged into one. */
function editCustomerName(oldName){
  const old = document.getElementById('renameCustOverlay');
  if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'renameCustOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `
    <div style="background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px 22px;box-shadow:0 -6px 24px rgba(0,0,0,.25);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="font-weight:700;font-size:16px;color:#1B2430;">✏️ Edit Customer Name</div>
        <button id="renCustClose" style="background:none;border:none;font-size:22px;color:#5b6472;">✕</button>
      </div>
      <div style="font-size:12.5px;color:#5b6472;margin-bottom:8px;">Correct the name / city. All orders of this customer will be updated.</div>
      <input id="renCustInput" value="${escapeHtml(oldName)}" autocomplete="off" style="margin-bottom:10px;">
      <div id="renCustMsg"></div>
      <div style="display:flex;gap:8px;">
        <button id="renCustCancel" style="flex:1;background:#EAF1FB;color:#1656A6;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">${t('cancel')}</button>
        <button id="renCustSave" style="flex:1;background:#1656A6;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">${t('save_changes')}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.getElementById('renCustClose').onclick = close;
  document.getElementById('renCustCancel').onclick = close;
  const inp = document.getElementById('renCustInput');
  inp.focus(); inp.select();
  const doSave = async ()=>{
    const btn = document.getElementById('renCustSave');
    const msg = document.getElementById('renCustMsg');
    const newRaw = inp.value.trim().replace(/\s+/g,' ');
    if(!newRaw){ msg.innerHTML = `<div class="msg err">${t('enter_customer_err')}</div>`; return; }
    if(newRaw === oldName){ close(); return; }
    // Same name as a DIFFERENT existing customer -> merge into that customer's spelling
    const other = bookings.find(b=>b.customerName !== oldName && normKey_(b.customerName) === normKey_(newRaw));
    const finalName = other ? String(other.customerName) : newRaw;
    if(other && !confirm(`"${finalName}" already exists.\nMerge all orders of "${oldName}" into it?\nAre you sure?`)) return;
    btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '⏳ ' + t('saving_word');
    await new Promise(r=>setTimeout(r, 30));
    let n = 0;
    bookings.forEach(b=>{ if(b.customerName === oldName){ b.customerName = finalName; n++; } });
    if(expandedCustomer === oldName) expandedCustomer = finalName;
    editingPendingGroup = null;
    await saveData();
    await logActivity('Customer Renamed', `${oldName} → ${finalName} (${n} lines)`);
    close();
    render();
    showInAppToast_(t('saved_ok'));
  };
  document.getElementById('renCustSave').onclick = doSave;
  inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); doSave(); } });
}

function renderCustomers(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  let customers = [...new Set(activeBookings.map(b=>b.customerName))]
    .filter(c=>c.toLowerCase().includes(customerFilter.trim().toLowerCase()));

  // Only customers who have at least one order matching the Brand AND Date filters together.
  if(customerBrandFilter.trim() || customerDateFilter){
    customers = customers.filter(c=>activeBookings.some(b=>b.customerName===c && custRowOk_(b)));
  }

  if(!activeBookings.length){
    main.innerHTML = `<div class="card"><div class="empty">${t('no_order_yet')}</div></div>`;
    return;
  }

  const cards = customers.map(cname=>{
    const rows = activeBookings.filter(b=>b.customerName===cname && custRowOk_(b));
    const total = rows.reduce((s,b)=>s+b.qty,0);
    const done = rows.filter(b=>b.status==='dispatched').reduce((s,b)=>s+b.qty,0);
    const pending = total - done;
    const isOpen = expandedCustomer === cname;

    let detail = '';
    if(isOpen){
      const dispatchedRows = rows.filter(b=>b.status==='dispatched');
      const pendingRows = rows.filter(b=>b.status==='pending');
      detail = `<div class="cust-detail">
        ${dispatchedRows.length ? `<div class="section-label">${t('ready_goods')}</div>` + dispatchedRows.map(b=>`
          <div class="li"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${b.qty}</span>
          <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></div>
        `).join('') : ''}
        ${pendingRows.length ? `<div class="section-label">${t('pending_order')}</div>` + pendingRows.map(b=>`
          <div class="li"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${b.qty}</span><span style="color:var(--rust);">${t('badge_pending')}</span></div>
        `).join('') : ''}
      </div>`;
    }

    return `<div class="cust-card" onclick="toggleCustomer('${cname.replace(/'/g,"\\'")}')" style="cursor:pointer;">
      <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>
        <span class="set-pill ${pending>0?'pending':'done'}">${pending>0 ? pending+' '+t('badge_pending') : t('complete')}</span>
      </div>
      <div class="summary-row">
        <span>${t('total')}: ${total}</span>
        <span>${t('dispatched')}: ${done}</span>
        <span>${t('pending_sets')}: ${pending}</span>
      </div>
      <div class="action-row" onclick="event.stopPropagation();">
        <button class="action-btn wa" onclick="shareWhatsAppCustomer('${cname.replace(/'/g,"\\'")}')">${t('whatsapp')}</button>
        <button class="action-btn pr" onclick="printCustomerOrder('${cname.replace(/'/g,"\\'")}')">${t('print')}</button>
        <button class="action-btn pr" style="background:#fff;color:var(--navy);border:1.5px solid var(--navy);" onclick="editCustomerName('${cname.replace(/'/g,"\\'")}')">✏️ ${t('edit_btn')}</button>
        ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteCustomerOrderFull('${cname.replace(/'/g,"\\'")}')">${t('delete_btn')}</button>` : ''}
      </div>
      ${detail}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card filter-input" style="margin-bottom:14px;">
      <label>${t('search_customer')}</label>
      <input id="custFilter" placeholder="${t('type_name')}" value="${escapeHtml(customerFilter)}" oninput="onCustomerFilter(this.value)">
      <label style="margin-top:10px;">${t('search_by_brand')}</label>
      <input id="custBrandFilter" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(customerBrandFilter)}" oninput="onCustomerBrandFilter(this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="custDateFilter" type="date" value="${escapeHtml(customerDateFilter)}" oninput="onCustomerDateFilter(this.value)">
    </div>
    ${cards || `<div class="empty">${t('no_customer_found')}</div>`}
  `;
}

function onCustomerFilter(val){
  customerFilter = val;
  render();
  setTimeout(()=>{
    const el = document.getElementById('custFilter');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}

function onCustomerBrandFilter(val){
  customerBrandFilter = val;
  render();
  setTimeout(()=>{
    const el = document.getElementById('custBrandFilter');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}

function onCustomerDateFilter(val){
  customerDateFilter = val;
  render();
  setTimeout(()=>{ const el = document.getElementById('custDateFilter'); if(el) el.focus(); }, 0);
}

function toggleCustomer(cname){
  expandedCustomer = expandedCustomer === cname ? null : cname;
  render();
}

async function undoDispatch(bookingId){
  event.stopPropagation();
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  markBusy(t('processing_word'));
  b.status = 'pending';
  b.dispatchedAt = null;
  await saveData();
  await logActivity('Dispatch Undone', `${b.customerName} — Design ${b.designNumber}, ${b.size} × ${b.qty}`);
  render();
}

/* ---------------- DELETED ORDERS TAB ---------------- */

function renderDeletedOrders(main){
  const trashedAll = bookings.filter(b=>b.trashed);
  const trashedCustomers = [...new Set(trashedAll.map(b=>b.customerName))];

  if(!trashedCustomers.length){
    main.innerHTML = `<div class="card"><div class="empty">${t('no_deleted_orders')}</div></div>`;
    return;
  }

  const cards = trashedCustomers.map(cname=>{
    const rows = trashedAll.filter(b=>b.customerName===cname)
      .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
    const total = rows.reduce((s,b)=>s+b.qty,0);
    const lines = rows.map(b=>
      `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''}</span><span>${b.qty} ${t('set')} (${b.status==='dispatched'?t('dispatched'):t('badge_pending')})</span></div>`
    ).join('');
    return `<div class="trash-card">
      <div class="trash-head">
        <span><b>${escapeHtml(cname)}</b> <span class="subtle">(${total} ${t('sets_deleted')})</span></span>
        <div class="trash-actions">
          <button class="restore-btn" onclick="restoreOrder('${cname.replace(/'/g,"\\'")}')">${t('restore')}</button>
          ${canCurrentUserDelete() ? `<button class="perm-del-btn" onclick="permanentDeleteOrder('${cname.replace(/'/g,"\\'")}')">${t('delete_permanently')}</button>` : ''}
        </div>
      </div>
      ${lines}
    </div>`;
  }).join('');

  main.innerHTML = `<div class="card"><h2>${t('deleted_orders')} (${trashedCustomers.length})</h2></div>${cards}`;
}

/* ---------------- ACTIVITY LOG TAB ---------------- */

function activityMatchesStaff_(a){
  const q = activitySearchStaff.trim().toLowerCase();
  if(!q) return true;
  return (a.staffName||'').toLowerCase().includes(q) || (a.staffMobile||'').toLowerCase().includes(q);
}

function renderActivity(main){
  let filtered = activityLog;
  if(activityDateFilter){
    filtered = filtered.filter(a=>dispatchDateKey(a.timestamp)===activityDateFilter);
  }
  filtered = filtered.filter(activityMatchesStaff_);

  const selectedCount = filtered.filter(a=>activitySelected.has(a.id)).length;
  const allSelected = filtered.length > 0 && selectedCount === filtered.length;

  const filterBar = `
    <div class="card">
      <h2>${t('staff_activity')} (${filtered.length})</h2>
      <input id="activityStaffSearch" placeholder="${t('staff_search_ph')}" value="${escapeHtml(activitySearchStaff)}" oninput="onActivityStaffSearch(this.value)" style="margin-bottom:10px;">
      <label>${t('by_date')}</label>
      <input id="activityDateFilter" type="date" value="${escapeHtml(activityDateFilter)}" oninput="onActivityDateFilter(this.value)">
      <button class="secondary" style="margin-top:10px;" onclick="shareActivityWhatsApp()">${t('share_whatsapp_pdf')}</button>
      ${filtered.length ? `
      <div style="display:flex;align-items:center;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">
        <label style="display:flex;align-items:center;gap:6px;margin:0;font-weight:600;">
          <input type="checkbox" ${allSelected?'checked':''} onclick="toggleSelectAllActivity(this.checked)" style="width:auto;">
          ${t('select_all')}
        </label>
        ${selectedCount ? `<button class="action-btn del" style="margin-left:auto;" onclick="deleteSelectedActivity()">${t('delete_btn')} (${selectedCount})</button>` : ''}
      </div>` : ''}
    </div>
  `;

  if(!filtered.length){
    main.innerHTML = filterBar + `<div class="empty">${t('no_activity')}${activityDateFilter ? ' '+t('on_this_date') : ' '+t('yet_word')}</div>`;
    return;
  }

  const items = filtered.map(a=>`
    <div class="log-card">
      <div class="log-top">
        <label style="display:flex;align-items:flex-start;gap:8px;margin:0;flex:1;">
          <input type="checkbox" ${activitySelected.has(a.id)?'checked':''} onclick="toggleActivitySelect('${a.id}', this.checked)" style="width:auto;margin-top:3px;">
          <span class="log-staff">${escapeHtml(a.staffName)} <span class="subtle">(${escapeHtml(a.staffMobile)})</span></span>
        </label>
        <span class="log-time">${fmtTime(a.timestamp)}</span>
      </div>
      <div class="log-action">${escapeHtml(a.action)}</div>
      <div class="log-detail">${escapeHtml(a.detail)}</div>
    </div>
  `).join('');
  main.innerHTML = filterBar + items;
}

function toggleActivitySelect(id, checked){
  if(checked) activitySelected.add(id); else activitySelected.delete(id);
  render();
}

function toggleSelectAllActivity(checked){
  let filtered = activityLog;
  if(activityDateFilter){
    filtered = filtered.filter(a=>dispatchDateKey(a.timestamp)===activityDateFilter);
  }
  filtered = filtered.filter(activityMatchesStaff_);
  if(checked) filtered.forEach(a=>activitySelected.add(a.id));
  else filtered.forEach(a=>activitySelected.delete(a.id));
  render();
}

async function deleteSelectedActivity(){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  const count = activitySelected.size;
  if(!count) return;
  if(!confirm(`${t('delete_confirm_1')} ${count} ${t('activity_entries')}?`)) return;
  markBusy(t('deleting_word'));
  activityLog = activityLog.filter(a=>!activitySelected.has(a.id));
  activitySelected.clear();
  await saveActivity();
  render();
}

let activityStaffDebounce_ = null;
function onActivityStaffSearch(val){
  activitySearchStaff = val;
  clearTimeout(activityStaffDebounce_);
  activityStaffDebounce_ = setTimeout(()=>{
    render();
    const el = document.getElementById('activityStaffSearch');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 250);
}

function onActivityDateFilter(val){
  activityDateFilter = val;
  render();
  setTimeout(()=>{ const el = document.getElementById('activityDateFilter'); if(el) el.focus(); }, 0);
}

async function shareActivityWhatsApp(){
  let filtered = activityLog;

  if(activityDateFilter) filtered = filtered.filter(a=>dispatchDateKey(a.timestamp)===activityDateFilter);
  filtered = filtered.filter(activityMatchesStaff_);
  if(!filtered.length){ alert(t('no_activity_share')); return; }
  const rows = filtered.map(a=>[a.staffName, fmtTime(a.timestamp), a.action, a.detail]);
  const title = `${t('staff_activity')}${activityDateFilter ? ' — '+dispatchDateLabel(activityDateFilter) : ''}`;
  const blob = buildPdfBlob(title, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, ['Staff','Time','Action','Detail'], rows, null);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `activity-log${activityDateFilter?'-'+activityDateFilter:''}.pdf`, title, title);
}

applyStaticLanguage();
updateNotifyBtn_();
loadData();

// Registers the offline service worker so the app itself (HTML/CSS/JS) can
// load with no internet at all — the data layer above already handles
// working offline and syncing back once a connection returns.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
  // The moment a newly-deployed service worker takes over (because sw.js
  // was updated and its CACHE_NAME changed), reload once automatically so
  // the page actually shows the new version straight away — instead of
  // everyone needing to refresh three or four times by hand before the new
  // copy finally wins.
  let swRefreshed_ = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed_) return;
    swRefreshed_ = true;
    window.location.reload();
  });
}
