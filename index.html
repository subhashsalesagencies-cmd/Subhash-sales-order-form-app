<style>
  :root{
    --navy:#1656A6;
    --linen:#F3F6FA;
    --mustard:#2F86D6;
    --ink:#1B2430;
    --rust:#B4552F;
    --sage:#2E7D4F;
    --line:#D5DFEC;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--linen);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  body{ padding-bottom:76px; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .topbar h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    margin:0;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sync-badge{
    font-size:11.5px;
    font-weight:600;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
    background:rgba(255,255,255,0.15);
    color:#fff;
  }
  .sync-badge:empty{ display:none; }
  .closing-badge{
    background:#FFD166;
    color:#3A2A0F;
    font-weight:700;
    font-size:12.5px;
    padding:6px 11px;
    border-radius:20px;
    white-space:nowrap;
  }
  .staff-badge{
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .staff-badge button{
    background:none; border:none; color:#FFD166;
    font-size:11.5px; font-weight:700; padding:0; text-decoration:underline;
  }
  main{ padding:14px; max-width:640px; margin:0 auto; }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    margin:0 0 12px 0;
  }
  label{
    display:block;
    font-size:13px;
    color:#5b6472;
    margin-bottom:5px;
    font-weight:600;
  }
  input, select{
    width:100%;
    padding:12px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:'IBM Plex Sans',sans-serif;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
    border-color:var(--navy);
  }
  /* Colour-coded fields on the Order form, so Customer / Brand / Design /
     Size are each instantly recognisable at a glance while taking an order. */
  .field-navy{ border-left:4px solid var(--navy) !important; background:#F5F9FF !important; }
  .field-sage{ border-left:4px solid var(--sage) !important; background:#F3FAF6 !important; }
  .field-rust{ border-left:4px solid var(--rust) !important; background:#FDF6F3 !important; }
  .field-mustard{ border-left:4px solid var(--mustard) !important; background:#F2F8FF !important; }
  .label-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:6px; vertical-align:middle;
  }
  .row{ display:flex; gap:8px; margin-bottom:10px; align-items:flex-end; }
  .row > *{ flex:1; }
  .row .btn-inline{ flex:none; width:52px; }
  button{ font-family:'IBM Plex Sans',sans-serif; cursor:pointer; }
  button.primary{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    margin-top:6px;
  }
  button.primary:active{ background:#0F3E7A; }
  button.primary:disabled{ background:#B7BCC6; }
  button.secondary{
    width:100%;
    background:#EAF1FB;
    color:var(--navy);
    border:1px solid var(--line);
    padding:12px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
  }
  button.small{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:20px;
    font-weight:700;
    line-height:1;
    padding:12px 0;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#EAF1FB;
    border:1px solid var(--line);
    padding:7px 10px;
    border-radius:20px;
    font-size:13.5px;
    margin:0 6px 6px 0;
  }
  .chip button.x{
    background:none; border:none; color:var(--rust);
    font-size:16px; padding:0; line-height:1; font-weight:700;
  }
  .design-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .design-block .dhead{
    display:flex; justify-content:space-between; align-items:center;
    font-weight:700; margin-bottom:6px;
  }
  .empty{
    text-align:center; padding:34px 12px; color:#7e8896; font-size:14.5px;
  }
  .msg{ padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:12px; }
  .msg.err{ background:#F7E4DA; color:var(--rust); border:1px solid #E5B79E; }
  .msg.ok{ background:#E3EFE8; color:#245C3B; border:1px solid #BFDCC9; }
  .msg.info{ background:#EAF1FB; color:var(--navy); border:1px solid var(--line); }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--navy);
    display:flex;
    overflow-x:auto;
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.2);
  }
  .navbtn{
    flex:1 0 auto;
    min-width:52px;
    background:none; border:none; color:#C7D8F0;
    font-size:10.3px; font-weight:600;
    padding:8px 2px;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .navbtn.active{ color:#fff; background:rgba(255,255,255,.14); }
  .navbtn .ic{ font-size:16px; }

  .set-pill{
    display:inline-block; font-size:12.5px; font-weight:700;
    padding:4px 10px; border-radius:14px;
  }
  .set-pill.pending{ background:#F7E4DA; color:var(--rust); }
  .set-pill.done{ background:#E3EFE8; color:var(--sage); }

  .cust-card{
    border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;
  }
  .cust-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .cust-head .name{ font-weight:700; font-size:16px; }
  .size-btn{
    padding:9px 12px;
    border-radius:8px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-size:14px;
    font-weight:700;
    margin:0 8px 8px 0;
  }
  .size-btn:active{ background:var(--navy); color:#fff; }
  .size-btn.done{
    border:1.5px solid var(--line);
    color:#a3aec0;
    background:#EEF2F8;
    opacity:.55;
  }
  .summary-row{
    display:flex; gap:14px; font-size:13px; color:#5b6472; margin-top:2px;
  }
  .filter-input{ margin-bottom:12px; }
  .cust-detail{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:13.5px;
  }
  .cust-detail .li{
    display:flex; justify-content:space-between; padding:5px 0;
  }
  .undo-link{
    background:none; border:none; color:var(--rust); font-size:12px;
    text-decoration:underline; padding:0;
  }
  .section-label{
    font-size:12px; font-weight:700; color:#5b6472; margin:10px 0 4px;
  }
  .item-line{
    display:flex; justify-content:space-between;
    padding:6px 0; font-size:14px; border-bottom:1px solid var(--line);
  }
  .item-line:last-child{ border-bottom:none; }
  .order-total-line{
    display:flex; justify-content:space-between; font-weight:700;
    padding-top:10px; margin-top:6px; border-top:2px solid var(--ink);
    font-size:15px;
  }
  .action-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .action-btn{
    flex:1; min-width:80px;
    border:none; border-radius:8px; padding:10px 8px;
    font-size:12.5px; font-weight:700; text-align:center;
  }
  .action-btn.wa{ background:#3F7B4F; color:#fff; }
  .action-btn.pr{ background:var(--navy); color:#fff; }
  .action-btn.del{ background:#fff; color:var(--rust); border:1.5px solid var(--rust); }
  .trash-card{
    border:1px dashed var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; background:#EEF2F8;
  }
  .trash-head{ display:flex; justify-content:space-between; align-items:center; }
  .restore-btn{
    background:var(--sage); color:#fff; border:none; border-radius:8px;
    padding:8px 12px; font-size:13px; font-weight:700;
  }
  .subtle{ color:#7e8896; font-size:12.5px; }

  .log-card{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .log-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .log-staff{ font-weight:700; font-size:14px; }
  .log-time{ font-size:11.5px; color:#7e8896; }
  .log-action{ font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:2px; }
  .log-detail{ font-size:13.5px; color:#3a4453; }

  .login-wrap{
    min-height:calc(100vh - 70px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:28px 22px; max-width:380px; width:100%;
  }
  .login-card h2{
    font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:0 0 6px 0;
    color:var(--navy);
  }
  .login-card p{ font-size:13.5px; color:#5b6472; margin:0 0 18px 0; }
  .login-divider{ text-align:center; color:#9aa4b2; font-size:12px; margin:14px 0; }
  #googleSignInBtn{ display:flex; justify-content:center; margin:10px 0; }

  .cust-card.all-done{ opacity:.55; background:#EEF2F8; }
  .cust-card.all-done .name{ color:#a3aec0; }

  .colour-label{
    font-size:12.5px; font-weight:700; color:var(--navy); text-transform:uppercase;
    letter-spacing:.3px; margin:10px 0 5px 0;
  }
  .colour-label:first-child{ margin-top:2px; }
  .size-suggest-dropdown{
    position:absolute; top:100%; left:0; right:0; z-index:30;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    margin-top:4px; max-height:230px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
  }
  .size-suggest-item{
    padding:11px 14px; font-size:14.5px; font-weight:600; color:var(--ink);
    border-bottom:1px solid var(--linen);
  }
  .size-suggest-item:last-child{ border-bottom:none; }
  .size-suggest-item:active{ background:var(--navy); color:#fff; }

  .date-section-label{
    font-family:'Fraunces',serif; font-weight:700; font-size:15px;
    color:var(--navy); margin:18px 0 8px 2px; padding-bottom:4px;
    border-bottom:2px solid var(--line);
  }
  .date-section-label:first-child{ margin-top:0; }

  .lang-toggle{
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:700;
  }
  .lang-toggle:active{ background:rgba(255,255,255,.3); }

  .trash-actions{ display:flex; gap:8px; }
  .perm-del-btn{
    background:#fff; color:var(--rust); border:1.5px solid var(--rust);
    border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Subhash Sales Agencies</h1>
  <div class="topbar-right">
    <button class="lang-toggle" id="langToggleBtn" onclick="toggleLang()">हिं</button>
    <span id="topbarRight"></span>
  </div>
</div>

<main id="main"></main>

<div class="bottom-nav" id="bottomNav">
  <button class="navbtn active" data-tab="book"><span class="ic">📝</span>Order</button>
  <button class="navbtn" data-tab="dispatch"><span class="ic">🔎</span>Article</button>
  <button class="navbtn" data-tab="dispatchedOrders"><span class="ic">📦</span>Dispatched</button>
  <button class="navbtn" data-tab="pendingOrders"><span class="ic">⏳</span>Pending</button>
  <button class="navbtn" data-tab="customers"><span class="ic">👤</span>Customers</button>
  <button class="navbtn" data-tab="deletedOrders"><span class="ic">🗑️</span>Deleted</button>
  <button class="navbtn" data-tab="activity"><span class="ic">📋</span>Activity</button>
  <button class="navbtn" data-tab="approvals" id="approvalsNavBtn" style="display:none;"><span class="ic">✅</span>Approvals</button>
</div>

<datalist id="customerList"></datalist>
<datalist id="designList"></datalist>
<datalist id="brandList"></datalist>

<script>
let bookings = [];      // {id, customerName, brand, designNumber, size, qty, status, orderedAt, dispatchedAt, orderedBy, dispatchedBy, trashed, trashedAt, trashedBy}
let activityLog = [];   // {id, staffName, staffMobile, action, detail, timestamp}
let loaded = false;
let currentTab = 'book';
let currentStaff = null; // {name, mobile} - session only, not persisted across reloads

// in-memory draft for current booking session
let draftCustomer = '';
let draftBrand = '';
let draftCart = [];          // [{designNumber, colour, sizes:[{size, qty}]}]
let tempDesignNumber = '';
let tempColour = '';
let tempSizes = [];          // [{size, qty}]

// Preset sizes shown in a tap-to-filter dropdown in Add Design. Staff can also
// type any other size manually — this list is just for quick selection.
const SIZE_PRESETS = ['20/24','26/30','32/36','18/22','24/28','30/34','9/24','2/5','6/8','9/14','15/16','22/26','28/32','34/38'];

let dispatchQuery = '';
let dispatchBrandQuery = '';
let dispatchBrandView = 'summary';  // 'summary' = size-wise totals, 'detail' = per-customer lines
let dispatchFromDate = ''; // yyyy-mm-dd
let dispatchToDate = '';   // yyyy-mm-dd
let selectedDesign = null;   // exact design chosen from the "select one" list, so it's never re-matched against other designs that merely share the same digits
let customerFilter = '';
let customerBrandFilter = '';
let customerDateFilter = ''; // yyyy-mm-dd
let expandedCustomer = null;

// dispatched-orders tab search state
let doSearchDesign = '';
let doSearchBrand = '';
let doSearchDate = '';       // yyyy-mm-dd

// pending-orders tab search state
let pdSearchCustomer = '';
let pdSearchBrand = '';
let pdSearchDate = ''; // yyyy-mm-dd

// activity tab filter state
let activityDateFilter = ''; // yyyy-mm-dd
let activitySelected = new Set(); // ids of checked activity log entries, for bulk delete

const SHEET_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwR28myzk020v3-yd25OrjHCKb4ujzoxXyURe7GAcrt5cpSUZ7-_BAQ39t_NiZcJMc3yw/exec';
const cloudAvailable = !!(SHEET_SCRIPT_URL && SHEET_SCRIPT_URL.startsWith('http'));

// Replace this with your own Google OAuth Client ID (see setup notes sent in chat).
// Until you do, the login screen falls back to a simple name-only entry.
const GOOGLE_CLIENT_ID = '436781702541-vojpb19fnlts7m96tirjj028b9gm2brd.apps.googleusercontent.com';
const googleReady = !!(GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID'));

// Only this Google account gets automatic access + the Approvals tab. Everyone
// else who signs in with Google must be approved from that tab first.
const OWNER_EMAIL = 'subhashsalesagencies@gmail.com';
let staffApprovals = []; // [{name, email, status:'pending'|'approved'|'rejected', requestedAt, approvedAt, canDelete}]
let loginWaitingEmail = null; // set while showing the "waiting for approval" screen

// The owner always has full access. A staff member who logged in via the
// name-only fallback (no Google account, no email) predates the approval
// system and is treated as unrestricted too. Everyone else needs the owner
// to have explicitly switched on delete rights for their account.
function canCurrentUserDelete(){
  if(!currentStaff) return false;
  if(!currentStaff.mobile) return true;
  if(currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()) return true;
  const entry = staffApprovals.find(s=>s.email === currentStaff.mobile);
  return !!(entry && entry.canDelete);
}

// Tabs a staff member does NOT see by default — the owner must explicitly
// switch each one on from the Approvals screen. Order (book) and Article
// (dispatch) are always visible to any approved staff, since they need
// those two to take orders day-to-day.
const RESTRICTABLE_TABS = [
  { key:'dispatchedOrders', label:'Dispatched' },
  { key:'pendingOrders',    label:'Pending' },
  { key:'customers',        label:'Customers' },
  { key:'deletedOrders',    label:'Deleted' },
  { key:'activity',         label:'Activity' }
];

function canAccessTab(tabKey){
  if(!currentStaff) return false;
  if(tabKey === 'book' || tabKey === 'dispatch') return true; // always allowed
  if(!currentStaff.mobile) return true; // legacy name-only login predates this system
  if(currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()) return true;
  if(tabKey === 'approvals') return false; // owner-only, handled separately
  const entry = staffApprovals.find(s=>s.email === currentStaff.mobile);
  return !!(entry && Array.isArray(entry.allowedTabs) && entry.allowedTabs.includes(tabKey));
}

async function toggleTabPermission(email, tabKey){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  if(!Array.isArray(s.allowedTabs)) s.allowedTabs = [];
  const has = s.allowedTabs.includes(tabKey);
  s.allowedTabs = has ? s.allowedTabs.filter(t=>t!==tabKey) : [...s.allowedTabs, tabKey];
  await saveApprovals();
  await logActivity(has ? 'Tab Access Removed' : 'Tab Access Granted', `${s.name} (${email}) — ${tabKey}`);
  render();
}

function uid(){ return 'b' + Math.random().toString(36).slice(2,10); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

/* ---------------- LANGUAGE / TRANSLATIONS ---------------- */

let currentLang = 'en';
try{ currentLang = localStorage.getItem('ssa_lang') || 'en'; }catch(e){}

const I18N = {
  en: {
    app_title:'Subhash Sales Agencies',
    nav_order:'Order', nav_article:'Article', nav_dispatched:'Dispatched', nav_pending:'Pending',
    nav_customers:'Customers', nav_deleted:'Deleted', nav_activity:'Activity', nav_approvals:'Approvals',
    pending_sets:'Pending', sets:'Sets', set:'Set', switch_btn:'Switch',

    login_title:'Staff Login',
    login_sub_google:'Enter your name, then sign in with your Google account. A new sign-in needs one-time approval from the owner before you can use the app.',
    login_sub_manual:'Enter your name to continue. This is used to identify who did what in the app.',
    login_cloud_warning:"Google Sheets backend URL is not set up yet. Data will only be saved on this phone and won't be visible to other staff.",
    your_name:'Your Name', name_ph:'e.g. Ramesh', then_word:'then', continue_btn:'Continue',
    enter_name_err:'Please enter your name',
    waiting_title:'Waiting for Approval', rejected_title:'Access Not Granted',
    waiting_msg1:'A request has been sent to', waiting_msg2:'Once Sandeep approves it from the Approvals tab, tap "Check Again" below to get in.',
    rejected_msg:'Your access request was not approved. Please speak to Sandeep directly if you think this is a mistake.',
    check_again:'Check Again', use_diff_account:'Use a Different Account',

    pending_requests:'Pending Requests', approved_staff:'Approved Staff', rejected_heading:'Rejected',
    no_pending_requests:'No pending requests', no_approved_staff:'No approved staff yet',
    requested:'requested', approve:'Approve', reject:'Reject', approve_anyway:'Approve Anyway',
    revoke_access:'Revoke Access', badge_pending:'Pending', badge_approved:'Approved', badge_rejected:'Rejected',
    reject_confirm:'Reject access for', revoke_confirm:'Revoke app access for', revoke_confirm2:'They will need to be re-approved to log in again.',
    perm_delete_confirm:"Permanently delete this trashed order? This cannot be undone.",
    delete_allowed:'Can Delete Orders', delete_blocked:'Delete Blocked', allow_delete:'Allow Delete', block_delete:'Block Delete',

function t(key){
  return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
}

function toggleLang(){
  currentLang = currentLang === 'hi' ? 'en' : 'hi';
  try{ localStorage.setItem('ssa_lang', currentLang); }catch(e){}
  applyStaticLanguage();
  render();
}

// Text that lives outside main (nav bar, page title) is only re-applied here,
// since it isn't rebuilt on every render() the way tab content is.
function applyStaticLanguage(){
  document.title = t('app_title') + ' — Order & Dispatch';
  const h1 = document.querySelector('.topbar h1');
  if(h1) h1.textContent = t('app_title');
  const langBtn = document.getElementById('langToggleBtn');
  if(langBtn) langBtn.textContent = t('lang_toggle');
  const navMap = { book:'nav_order', dispatch:'nav_article', dispatchedOrders:'nav_dispatched',
    pendingOrders:'nav_pending', customers:'nav_customers', deletedOrders:'nav_deleted',
    activity:'nav_activity', approvals:'nav_approvals' };
  document.querySelectorAll('.navbtn').forEach(btn=>{
    const key = navMap[btn.dataset.tab];
    if(!key) return;
    const ic = btn.querySelector('.ic');
    btn.innerHTML = '';
    if(ic) btn.appendChild(ic);
    btn.appendChild(document.createTextNode(t(key)));
  });
}

function buildPdfBlob(title, subtitle, columns, rows, footerText){
  if(!window.jspdf || !window.jspdf.jsPDF) return null;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // Letterhead: logo + company name/address/contact, on every PDF.
    try{ doc.addImage(COMPANY_LOGO_B64, 'JPEG', 14, 8, 16, 13.7); }catch(e){ console.error('Logo embed failed', e); }
    doc.setFontSize(13);
    doc.setTextColor(20,20,20);
    doc.text(`Name : ${COMPANY_NAME}`, 34, 13);
    doc.setFontSize(9);
    doc.setTextColor(90,100,115);
    doc.text(`Address : ${COMPANY_ADDRESS}`, 34, 18.5);
    doc.text(`Contact : ${COMPANY_CONTACT}`, 34, 23.5);
    doc.setDrawColor(213,223,236);
    doc.line(14, 28, 196, 28);

    doc.setFontSize(14);
    doc.setTextColor(20,20,20);
    doc.text(title, 14, 36);
    doc.setFontSize(10);
    doc.setTextColor(90,100,115);
    doc.text(subtitle, 14, 43);
    doc.setTextColor(20,20,20);
    doc.autoTable({
      startY: 48,
      head: [columns],
      body: rows,
      styles: { fontSize: 9, cellPadding: 3 },
      headStyles: { fillColor: [22,86,166], textColor: [255,255,255] },
      theme: 'grid'
    });
    if(footerText){
      const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || 48;
      doc.setFontSize(11);
      doc.setTextColor(20,20,20);
      doc.text(footerText, 14, finalY + 10);
    }
    return doc.output('blob');
  }catch(e){ console.error('PDF build failed', e); return null; }
}

function openPdfBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(!w){
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

async function sharePdfBlob(blob, filename, shareTitle, shareText){
  try{
    const file = new File([blob], filename, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      // Important: don't pass "text" alongside "files" here. On Android,
      // sharing a file + text together to WhatsApp's direct-share contact
      // shortcut makes WhatsApp misread it as an empty text message and
      // refuse to send ("Can't send empty message"), even though a file is
      // attached. Sharing the file alone (with just a title) avoids that.
      await navigator.share({ files: [file], title: shareTitle });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // user cancelled the share sheet
    console.error('Native share failed, falling back to download', e);
  }
  // Fallback for browsers without file-sharing support (mostly desktop):
  // download the PDF, then open WhatsApp so it can be attached manually.
  // The file is already named after the customer (e.g. "Order-Amit.pdf"),
  // and we call that name out in the message so it's easy to spot in the
  // Downloads folder when attaching it in WhatsApp Web/Desktop.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  window.open(`https://wa.me/?text=${encodeURIComponent(shareText + `\n\n📎 PDF downloaded as "${filename}" — please attach it from your Downloads folder here.`)}`, '_blank');
}

// Primary storage: Google Sheets (via Apps Script Web App) — syncs across all staff devices.
// Backup storage: this browser's localStorage — used if the Sheets call fails
// (e.g. no internet at that moment), so nothing gets lost.
async function storageGet(key){
  if(cloudAvailable && navigator.onLine){
    try{
      const res = await fetch(`${SHEET_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if(data && data.value !== null && data.value !== undefined) return data.value;
      return null;
    }catch(e){ console.error('Sheet fetch failed, using local backup', e); }
  }
  try{ return localStorage.getItem('ssa_'+key); }
  catch(e){ return null; }
}
async function storageSet(key, value){
  // Always save locally first — instant, and this is what keeps the app
  // fully usable offline (orders, dispatches, everything).
  try{ localStorage.setItem('ssa_'+key, value); }
  catch(e){ console.error('local storage failed', e); }

  if(cloudAvailable && navigator.onLine){
    try{
      await fetch(SHEET_SCRIPT_URL, {
        method:'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ key, value })
      });
      markKeySynced_(key);
      return;
    }catch(e){ console.error('Sheet save failed, will retry when back online', e); }
  }
  // No internet (or the request failed) — remember this key needs syncing,
  // and try again automatically once we're back online.
  markKeyDirty_(key);
}

/* ---------------- OFFLINE QUEUE: remembers which keys still need to reach
   Google Sheets, and pushes them the moment internet is back. This is what
   lets the app be used with no signal at all — orders save instantly to
   this device, then quietly catch up to the cloud later. ---------------- */
let dirtyKeys = [];
try{ dirtyKeys = JSON.parse(localStorage.getItem('ssa_dirty_keys') || '[]'); }catch(e){ dirtyKeys = []; }

function markKeyDirty_(key){
  if(!dirtyKeys.includes(key)) dirtyKeys.push(key);
  try{ localStorage.setItem('ssa_dirty_keys', JSON.stringify(dirtyKeys)); }catch(e){}
  updateSyncBadge_();
}
function markKeySynced_(key){
  if(dirtyKeys.includes(key)){
    dirtyKeys = dirtyKeys.filter(k=>k!==key);
    try{ localStorage.setItem('ssa_dirty_keys', JSON.stringify(dirtyKeys)); }catch(e){}
  }
  updateSyncBadge_();
}

let isFlushing_ = false;
async function flushDirtyKeys_(){
  if(isFlushing_ || !cloudAvailable || !navigator.onLine || !dirtyKeys.length) return;
  isFlushing_ = true;
  try{
    for(const key of [...dirtyKeys]){
      try{
        const value = localStorage.getItem('ssa_'+key);
        if(value === null){ markKeySynced_(key); continue; }
        await fetch(SHEET_SCRIPT_URL, {
          method:'POST',
          headers: {'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ key, value })
        });
        markKeySynced_(key);
      }catch(e){ console.error('Retry sync failed for', key, e); }
    }
  } finally { isFlushing_ = false; }
}

function updateSyncBadge_(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(!navigator.onLine){
    el.textContent = '🔴 Offline — saving on this device';
    el.className = 'sync-badge offline';
  } else if(dirtyKeys.length){
    el.textContent = '🟡 Syncing…';
    el.className = 'sync-badge syncing';
  } else {
    el.textContent = '🟢 Synced';
    el.className = 'sync-badge synced';
  }
}

// Google Sheets auto-converts cell text that LOOKS like a number (e.g. an
// article/design number such as "101") into an actual JS number when the
// data is read back. Every part of this app assumes these fields are text
// and calls string methods on them (.toLowerCase(), .localeCompare(), etc).
// If even one booking comes back as a number, those calls throw, the render
// stops partway through, and the screen freezes on stale content — which
// looks like "tabs stopped working" even though the tap itself worked fine.
// Forcing these fields back to strings the moment data is loaded fixes this
// for good, regardless of what type Sheets decides to hand back.
function normalizeBookingFields_(arr){
  if(!arr) return;
  arr.forEach(function(b){
    ['designNumber','customerName','brand','colour','size'].forEach(function(field){
      if(b[field] !== undefined && b[field] !== null) b[field] = String(b[field]);
    });
  });
}

async function loadData(){
  try{
    const v = await storageGet('bookings');
    bookings = v ? JSON.parse(v) : [];
    normalizeBookingFields_(bookings);
  }catch(e){ bookings = []; }
  try{
    const v2 = await storageGet('activityLog');
    activityLog = v2 ? JSON.parse(v2) : [];
  }catch(e){ activityLog = []; }
  try{
    const v3 = await storageGet('staffApprovals');
    staffApprovals = v3 ? JSON.parse(v3) : [];
  }catch(e){ staffApprovals = []; }
  try{
    const saved = localStorage.getItem('ssa_currentStaff');
    if(saved) currentStaff = JSON.parse(saved);
  }catch(e){}
  await purgeOldRecords();
  loaded = true;
  render();
  updateSyncBadge_();
  startAutoRefresh_();
}

/* ---------------- AUTO-REFRESH: quietly re-checks Google Sheets every 20s
   so everyone sees each other's updates without hitting refresh, and syncs
   any offline changes the moment internet is back. Skips refreshing while
   someone is actively filling the Order form, so it never interrupts typing. */
let autoRefreshTimer_ = null;
function startAutoRefresh_(){
  if(autoRefreshTimer_) return;
  autoRefreshTimer_ = setInterval(async ()=>{
    if(!navigator.onLine || document.hidden) return;
    await flushDirtyKeys_();
    if(currentTab === 'book') return;
    await silentRefresh_();
  }, 20000);

  window.addEventListener('online', async ()=>{
    updateSyncBadge_();
    await flushDirtyKeys_();
    if(currentTab !== 'book') await silentRefresh_();
  });
  window.addEventListener('offline', updateSyncBadge_);

  document.addEventListener('visibilitychange', async ()=>{
    if(!document.hidden && navigator.onLine){
      await flushDirtyKeys_();
      if(currentTab !== 'book') await silentRefresh_();
    }
  });
}

async function silentRefresh_(){
  if(!currentStaff) return;
  try{
    const v = await storageGet('bookings');
    const newBookings = v ? JSON.parse(v) : [];
    normalizeBookingFields_(newBookings);
    bookings = newBookings;
    const v2 = await storageGet('activityLog');
    activityLog = v2 ? JSON.parse(v2) : [];
    const v3 = await storageGet('staffApprovals');
    staffApprovals = v3 ? JSON.parse(v3) : [];
    render();
  }catch(e){ console.error('Auto-refresh failed', e); }
}

// Any order (pending or dispatched) placed more than 12 months ago is removed
// automatically — from Pending, Dispatched and Customers alike, since all
// three are just different views of the same `bookings` array. Old Activity
// Log entries beyond 12 months are cleared the same way. Runs once whenever
// the app loads, on whichever device opens it first.
async function purgeOldRecords(){
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 12);

  const removedCustomers = new Set();
  const beforeBookings = bookings.length;
  bookings = bookings.filter(b=>{
    const keep = new Date(b.orderedAt) >= cutoff;
    if(!keep) removedCustomers.add(b.customerName);
    return keep;
  });
  const removedBookingsCount = beforeBookings - bookings.length;

  const beforeActivity = activityLog.length;
  activityLog = activityLog.filter(a=> new Date(a.timestamp) >= cutoff);
  const removedActivityCount = beforeActivity - activityLog.length;

  if(removedBookingsCount > 0 || removedActivityCount > 0){
    activityLog.unshift({
      id: uid(),
      staffName: 'System',
      staffMobile: '',
      action: 'Auto Cleanup (12+ months old)',
      detail: `Removed ${removedBookingsCount} order line(s)${removedCustomers.size ? ' for ' + [...removedCustomers].join(', ') : ''}, and ${removedActivityCount} old activity log entr${removedActivityCount===1?'y':'ies'}.`,
      timestamp: new Date().toISOString()
    });
    await saveData();
    await saveActivity();
  }
}
async function saveData(){
  try{ await storageSet('bookings', JSON.stringify(bookings)); }
  catch(e){ console.error('save failed', e); }
}
async function saveActivity(){
  try{ await storageSet('activityLog', JSON.stringify(activityLog)); }
  catch(e){ console.error('activity save failed', e); }
}
async function saveApprovals(){
  try{ await storageSet('staffApprovals', JSON.stringify(staffApprovals)); }
  catch(e){ console.error('approvals save failed', e); }
}
async function notifyOwnerOfRequest(name, email){
  if(!cloudAvailable) return;
  try{
    await fetch(SHEET_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'notifyStaffRequest', name, email })
    });
  }catch(e){ console.error('owner notification failed', e); }
}
async function logActivity(action, detail){
  if(!currentStaff) return;
  activityLog.unshift({
    id: uid(),
    staffName: currentStaff.name,
    staffMobile: currentStaff.mobile,
    action,
    detail,
    timestamp: new Date().toISOString()
  });
  await saveActivity();
}

  const pending = bookings.filter(b=>b.status==='pending' && !b.trashed).reduce((s,b)=>s+b.qty,0);
  el.innerHTML = `
    <span id="syncBadge" class="sync-badge"></span>
    <span class="closing-badge">${t('pending_sets')}: ${pending} ${t('sets')}</span>
    <span class="staff-badge">👤 ${escapeHtml(currentStaff.name)} <button onclick="logoutStaff()">${t('switch_btn')}</button></span>
  `;
  updateSyncBadge_();
}

function updateDatalists(){
  const custs = [...new Set(bookings.map(b=>b.customerName))];
  document.getElementById('customerList').innerHTML = custs.map(c=>`<option value="${escapeHtml(c)}">`).join('');
  const designs = [...new Set(bookings.map(b=>b.designNumber))];
  document.getElementById('designList').innerHTML = designs.map(d=>`<option value="${escapeHtml(d)}">`).join('');
  const brands = [...new Set(bookings.map(b=>b.brand).filter(Boolean))];
  document.getElementById('brandList').innerHTML = brands.map(b=>`<option value="${escapeHtml(b)}">`).join('');
}

function render(){
  const main = document.getElementById('main');
  const bottomNav = document.getElementById('bottomNav');
  if(!loaded){ main.innerHTML = '<div class="empty">'+t('loading_word')+'</div>'; return; }

  if(!currentStaff){
    bottomNav.style.display = 'none';
    document.getElementById('topbarRight').innerHTML = '';
    renderLogin(main);
    return;
  }
  bottomNav.style.display = 'flex';

  const isOwner = currentStaff.mobile && currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase();
  const approvalsBtn = document.getElementById('approvalsNavBtn');
  if(approvalsBtn) approvalsBtn.style.display = isOwner ? 'flex' : 'none';
  if(currentTab === 'approvals' && !isOwner) currentTab = 'book';

  // Restrict tabs per-staff: owner sees everything; a staff member only
  // sees Order + Article by default, plus whatever tabs the owner has
  // explicitly switched on for them from the Approvals screen.
  document.querySelectorAll('.navbtn[data-tab]').forEach(btn=>{
    const tab = btn.dataset.tab;
    if(tab === 'approvals') return; // handled above
    btn.style.display = canAccessTab(tab) ? 'flex' : 'none';
  });
  if(!canAccessTab(currentTab)) currentTab = 'book';

  renderTopbarRight();
  updateDatalists();
  console.log('[render] currentTab =', currentTab);
  if(currentTab==='book') renderBook(main);
  else if(currentTab==='dispatch') renderDispatch(main);
  else if(currentTab==='dispatchedOrders') renderDispatchedOrders(main);
  else if(currentTab==='pendingOrders') renderPendingOrders(main);
  else if(currentTab==='deletedOrders') renderDeletedOrders(main);
  else if(currentTab==='activity') renderActivity(main);
  else if(currentTab==='approvals') renderApprovals(main);
  else renderCustomers(main);
}

async function recheckApprovalStatus(){
  try{
    const v = await storageGet('staffApprovals');
    if(v) staffApprovals = JSON.parse(v);
  }catch(e){}
  const entry = staffApprovals.find(s=>s.email===loginWaitingEmail);
  if(entry && entry.status==='approved'){
    currentStaff = { name: entry.name, mobile: entry.email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
  }
  render();
}

function cancelLoginWait(){
  loginWaitingEmail = null;
  render();
}

function initGoogleButton(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  try{
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
    const el = document.getElementById('googleSignInBtn');
    if(el) google.accounts.id.renderButton(el, { theme:'outline', size:'large', width:270 });
  }catch(e){ console.error('Google sign-in init failed', e); }
}

function parseJwt(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

async function handleGoogleCredential(response){
  const payload = parseJwt(response.credential);
  if(!payload || !payload.email) return;
  const email = payload.email;
  const nameEl = document.getElementById('loginName');
  const typedName = nameEl ? nameEl.value.trim() : '';
  const name = typedName || payload.name || email;

  // The owner's own Google account always gets straight in, and unlocks the
  // Approvals tab for approving/rejecting everyone else.
  if(email.toLowerCase() === OWNER_EMAIL.toLowerCase()){
    currentStaff = { name, mobile: email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
    render();
    return;
  }

  const existing = staffApprovals.find(s=>s.email===email);
  if(existing && existing.status === 'approved'){
    currentStaff = { name: existing.name, mobile: email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
    render();
    return;
  }

  if(!existing){
    staffApprovals.push({ name, email, status:'pending', requestedAt: new Date().toISOString() });
    await saveApprovals();
    notifyOwnerOfRequest(name, email); // fire-and-forget; owner gets an email
  }
  loginWaitingEmail = email;
  render();
}

function loginStaffManual(){
  const name = document.getElementById('loginName').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!name){ msg.innerHTML = `<div class="msg err">${t('enter_name_err')}</div>`; return; }
  currentStaff = { name, mobile: '' };
  try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
  render();
}

function logoutStaff(){
  currentStaff = null;
  loginWaitingEmail = null;
  try{ localStorage.removeItem('ssa_currentStaff'); }catch(e){}
  if(googleReady && window.google && google.accounts && google.accounts.id){
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  currentTab = 'book';
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  const first = document.querySelector('.navbtn[data-tab="book"]');
  if(first) first.classList.add('active');
  render();
}

function renderApprovals(main){
  const pending = staffApprovals.filter(s=>s.status==='pending').sort((a,b)=>new Date(b.requestedAt)-new Date(a.requestedAt));
  const approved = staffApprovals.filter(s=>s.status==='approved');
  const rejected = staffApprovals.filter(s=>s.status==='rejected');

  const pendingHtml = pending.length ? pending.map(s=>`
    <div class="cust-card">

      <div class="action-row">
        <button class="action-btn wa" onclick="approveStaff('${s.email.replace(/'/g,"\\'")}')">${t('approve')}</button>

      </div>
    </div>
  `).join('') : `<div class="empty">${t('no_pending_requests')}</div>`;

  const approvedHtml = approved.length ? approved.map(s=>{
    const allowedTabs = Array.isArray(s.allowedTabs) ? s.allowedTabs : [];
    const tabToggles = RESTRICTABLE_TABS.map(rt=>{
      const on = allowedTabs.includes(rt.key);
      return `<button class="chip" style="cursor:pointer;border:1px solid ${on ? 'var(--navy)' : '#ccc'};background:${on ? 'var(--navy)' : '#fff'};color:${on ? '#fff' : '#555'};" onclick="toggleTabPermission('${s.email.replace(/'/g,"\\'")}','${rt.key}')">${on ? '✓ ' : ''}${rt.label}</button>`;
    }).join(' ');
    return `
    <div class="cust-card">
      <div class="cust-head"><span class="name">${escapeHtml(s.name)}</span><span class="set-pill done">${t('badge_approved')}</span></div>
      <div style="font-size:13px;color:#5b6472;">${escapeHtml(s.email)}</div>
      <div style="margin-top:6px;">
        <span class="set-pill ${s.canDelete ? 'done' : 'pending'}">${s.canDelete ? t('delete_allowed') : t('delete_blocked')}</span>
      </div>
      <div style="font-size:12px;color:#5b6472;margin-top:10px;margin-bottom:4px;">Tabs this staff can see (Order + Article always visible):</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${tabToggles}</div>
      <div class="action-row" style="margin-top:10px;">
        <button class="action-btn ${s.canDelete ? 'del' : 'wa'}" onclick="toggleDeletePermission('${s.email.replace(/'/g,"\\'")}')">${s.canDelete ? t('block_delete') : t('allow_delete')}</button>
        <button class="action-btn del" onclick="revokeStaff('${s.email.replace(/'/g,"\\'")}')">${t('revoke_access')}</button>
      </div>
    </div>
  `;
  }).join('') : `<div class="empty">${t('no_approved_staff')}</div>`;

  const rejectedHtml = rejected.length ? rejected.map(s=>`
    <div class="cust-card">
      <div class="cust-head"><span class="name">${escapeHtml(s.name)}</span><span class="set-pill pending">${t('badge_rejected')}</span></div>
      <div style="font-size:13px;color:#5b6472;">${escapeHtml(s.email)}</div>
      <div class="action-row">
        <button class="action-btn wa" onclick="approveStaff('${s.email.replace(/'/g,"\\'")}')">${t('approve_anyway')}</button>
      </div>
    </div>
  `).join('') : '';

  main.innerHTML = `
    <div class="card"><h2>${t('pending_requests')} (${pending.length})</h2></div>
    ${pendingHtml}
    <div class="card" style="margin-top:18px;"><h2>${t('approved_staff')} (${approved.length})</h2></div>
    ${approvedHtml}

async function approveStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  s.status = 'approved';
  s.approvedAt = new Date().toISOString();
  if(s.canDelete === undefined) s.canDelete = false; // owner must explicitly grant delete rights
  if(!Array.isArray(s.allowedTabs)) s.allowedTabs = []; // owner must explicitly switch tabs on
  await saveApprovals();
  await logActivity('Staff Approved', `${s.name} (${email})`);
  render();
}

async function toggleDeletePermission(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  s.canDelete = !s.canDelete;
  await saveApprovals();
  await logActivity(s.canDelete ? 'Delete Access Granted' : 'Delete Access Blocked', `${s.name} (${email})`);
  render();
}

async function rejectStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  if(!confirm(`${t('reject_confirm')} ${s.name} (${email})?`)) return;
  s.status = 'rejected';
  await saveApprovals();
  await logActivity('Staff Rejected', `${s.name} (${email})`);
  render();
}

async function revokeStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  if(!confirm(`${t('revoke_confirm')} ${s.name} (${email})? ${t('revoke_confirm2')}`)) return;
  s.status = 'rejected';
  await saveApprovals();
  await logActivity('Staff Access Revoked', `${s.name} (${email})`);
  render();
}

// Lets staff move between the Order form's fields using the keyboard's
// Up/Down arrow keys instead of having to click each field by hand —
// Down moves to the next field, Up moves back to the previous one.
const ORDER_FORM_FIELD_SEQUENCE = ['custName','custBrand','designNo','designColour','sizeVal','qtyVal'];
function handleOrderFormArrowNav(e, fieldId){
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const idx = ORDER_FORM_FIELD_SEQUENCE.indexOf(fieldId);
  if(idx === -1) return;
  const nextId = ORDER_FORM_FIELD_SEQUENCE[e.key === 'ArrowDown' ? idx + 1 : idx - 1];
  if(!nextId) return;
  const el = document.getElementById(nextId);
  if(el){ el.focus(); if(el.select) el.select(); }
}

function renderBook(main){
  const cartBlocks = draftCart.map((d, idx)=>{
    const chips = d.sizes.map((s,si)=>`<span class="chip">${escapeHtml(s.size)} · ${s.qty} <button class="x" onclick="removeCartSize(${idx},${si})">×</button></span>`).join('');
    return `<div class="design-block">
      <div class="dhead"><span>${t('design_word')} No. ${escapeHtml(d.designNumber)}${d.colour ? ' · '+escapeHtml(d.colour) : ''}</span>
      <button class="chip x" style="border:none;background:none;color:var(--rust);font-weight:700;" onclick="removeCartDesign(${idx})">${t('remove')} ✕</button></div>
      <div>${chips}</div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card">
      <h2><span class="label-dot" style="background:var(--navy);"></span>${t('customer_name')}</h2>
      <input id="custName" class="field-navy" list="customerList" placeholder="${t('enter_customer_name')}" value="${escapeHtml(draftCustomer)}" oninput="draftCustomer=this.value" onkeydown="handleOrderFormArrowNav(event,'custName')">
      <label style="margin-top:10px;"><span class="label-dot" style="background:var(--sage);"></span>${t('brand_name')} *</label>
      <input id="custBrand" class="field-sage" list="brandList" placeholder="${t('enter_brand_name')}" value="${escapeHtml(draftBrand)}" oninput="draftBrand=this.value" onkeydown="handleOrderFormArrowNav(event,'custBrand')">
    </div>

    <div class="card">
      <h2>${t('add_design')}</h2>
      <div id="bookMsg"></div>
      <label><span class="label-dot" style="background:var(--rust);"></span>${t('design_number')}</label>
      <input id="designNo" class="field-rust" list="designList" placeholder="${t('design_ph')}" value="${escapeHtml(tempDesignNumber)}" oninput="tempDesignNumber=this.value" onkeydown="handleOrderFormArrowNav(event,'designNo')">

      <label style="margin-top:10px;">${t('colour_optional')}</label>
      <input id="designColour" placeholder="${t('colour_ph')}" value="${escapeHtml(tempColour)}" oninput="tempColour=this.value" onkeydown="handleOrderFormArrowNav(event,'designColour')">

        <div class="size-suggest-wrap" id="sizeSuggestWrap">
          <input id="sizeVal" class="field-mustard" placeholder="${t('size_ph')}" autocomplete="off" oninput="filterSizeSuggestions()" onfocus="showSizeSuggestions()" onkeydown="if(event.key==='Enter'){event.preventDefault();addTempSize();}else{handleOrderFormArrowNav(event,'sizeVal')}">
          <div id="sizeSuggestions" class="size-suggest-dropdown" style="display:none;"></div>

          <label>${t('set')}</label>
          <input id="qtyVal" type="number" min="1" value="1" onkeydown="if(event.key==='Enter'){event.preventDefault();addTempSize();}else{handleOrderFormArrowNav(event,'qtyVal')}">

function renderSizeSuggestions(filterVal){
  const box = document.getElementById('sizeSuggestions');
  if(!box) return;
  const q = (filterVal||'').trim().toLowerCase();
  const list = q ? SIZE_PRESETS.filter(s=>s.toLowerCase().includes(q)) : SIZE_PRESETS;
  if(!list.length){ box.style.display = 'none'; return; }
  box.innerHTML = list.map(s=>`<div class="size-suggest-item" onmousedown="event.preventDefault();chooseSizeSuggestion('${s.replace(/'/g,"\\'")}')">${escapeHtml(s)}</div>`).join('');
  box.style.display = 'block';
}
function showSizeSuggestions(){
  const el = document.getElementById('sizeVal');
  renderSizeSuggestions(el ? el.value : '');
}
function filterSizeSuggestions(){
  const el = document.getElementById('sizeVal');
  renderSizeSuggestions(el ? el.value : '');
}
function chooseSizeSuggestion(s){
  const el = document.getElementById('sizeVal');
  if(el) el.value = s;
  const box = document.getElementById('sizeSuggestions');
  if(box) box.style.display = 'none';
  const qtyEl = document.getElementById('qtyVal');
  if(qtyEl){ qtyEl.focus(); qtyEl.select(); }

document.addEventListener('click', function(e){
  const wrap = document.getElementById('sizeSuggestWrap');
  const box = document.getElementById('sizeSuggestions');
  if(wrap && box && !wrap.contains(e.target)) box.style.display = 'none';
});

function addTempSize(){
  const sizeInput = document.getElementById('sizeVal');
  const qtyInput = document.getElementById('qtyVal');
  const designInput = document.getElementById('designNo');
  const colourInput = document.getElementById('designColour');
  const designNo = designInput.value.trim();
  const colour = colourInput.value.trim();
  const size = sizeInput.value.trim();
  const qty = parseInt(qtyInput.value) || 0;
  const msg = document.getElementById('bookMsg');
  if(!designNo){ msg.innerHTML = `<div class="msg err">${t('enter_design_err')}</div>`; return; }
  if(!size || qty <= 0){
    msg.innerHTML = `<div class="msg err">${t('size_qty_err')}</div>`;
    return;
  }
  // Goes straight into the order — no separate "Add this design" step. If
  // this same design+colour is already in the cart, the new size just joins
  // it; otherwise a new design block is started.
  let entry = draftCart.find(d=>d.designNumber===designNo && (d.colour||'')===colour);
  if(!entry){
    entry = { designNumber: designNo, colour: colour, sizes: [] };
    draftCart.push(entry);
  }
  entry.sizes.push({ size, qty });

  sizeInput.value = '';
  qtyInput.value = '1';
  msg.innerHTML = '';
  render();
  setTimeout(()=>{ const el=document.getElementById('sizeVal'); if(el) el.focus(); }, 0);
}

function removeCartSize(designIdx, sizeIdx){
  const d = draftCart[designIdx];
  if(!d) return;
  d.sizes.splice(sizeIdx,1);
  if(!d.sizes.length) draftCart.splice(designIdx,1);
  render();
}

function removeCartDesign(idx){ draftCart.splice(idx,1); render(); }

let isSavingOrder = false; // prevents the same order being saved twice if the button is tapped again before the first save finishes

async function saveOrder(){
  if(isSavingOrder) return; // a save is already running — ignore the extra tap

  const custName = (document.getElementById('custName').value || '').trim();
  const custBrand = (document.getElementById('custBrand').value || '').trim();
  const msg = document.getElementById('bookMsg');
  if(!custName){ msg.innerHTML = `<div class="msg err">${t('enter_customer_err')}</div>`; return; }
  if(!custBrand){ msg.innerHTML = `<div class="msg err">${t('enter_brand_err')}</div>`; return; }
  if(!draftCart.length){ return; }

  isSavingOrder = true;
  const saveBtn = document.getElementById('saveOrderBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = t('saving_word'); }

  try{
    const now = new Date().toISOString();
    let totalSets = 0;
    draftCart.forEach(d=>{
      d.sizes.forEach(s=>{
        totalSets += s.qty;
        bookings.push({
          id: uid(),
          customerName: custName,
          brand: custBrand,
          designNumber: d.designNumber,
          colour: d.colour || '',
          size: s.size,
          qty: s.qty,
          status: 'pending',
          orderedAt: now,
          dispatchedAt: null,
          orderedBy: currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null
        });
      });
    });
    await saveData();

    const count = draftCart.length;
    await logActivity('Order Booked', `${custName}${custBrand ? ' ('+custBrand+')' : ''} — ${count} design(s), ${totalSets} sets`);

    // Grab exactly the rows just created (matched by this save's timestamp)
    // before clearing the form, so we can hand them straight to WhatsApp.
    const justSavedRows = bookings.filter(b=>b.customerName===custName && b.orderedAt===now);

    draftCart = [];
    draftCustomer = '';
    draftBrand = '';
    tempDesignNumber = '';
    tempColour = '';
    tempSizes = [];
    render();
    const m2 = document.getElementById('bookMsg');
    if(m2) m2.innerHTML = `<div class="msg ok">${count} ${t('designs_saved')}</div>`;

    // Order saved — immediately build the PDF and hand it to WhatsApp, so
    // the salesman doesn't have to go find it in the Pending tab afterwards.
    await shareNewOrderPdf(custName, justSavedRows, totalSets);
  } finally {
    isSavingOrder = false;
  }
}

async function shareNewOrderPdf(cname, rows, total){
  if(!rows.length) return;
  const tableRows = rows.map(b=>[b.designNumber, b.colour||'-', b.size, b.brand||'-', String(b.qty)]);
  const blob = buildPdfBlob(`${t('pending_order')} — ${cname}`, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, ['Design Number','Colour','Size','Brand','Set'], tableRows, `${t('total')}: ${total} ${t('sets')}`);
  if(!blob) return;
  await sharePdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-new.pdf`, `Order — ${cname}`, `New Order — ${cname}, ${t('total')} ${total} ${t('sets')}`);
}

/* ---------------- ARTICLE (DISPATCH) SEARCH TAB ---------------- */

function inDispatchDateRange(iso){
  if(!dispatchFromDate && !dispatchToDate) return true;
  if(!iso) return false;
  const key = dispatchDateKey(iso);
  if(dispatchFromDate && key < dispatchFromDate) return false;
  if(dispatchToDate && key > dispatchToDate) return false;
  return true;
}

function renderDispatch(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  const allDesigns = [...new Set(activeBookings.map(b=>b.designNumber))];

  let resultsHtml = '';
  let exactDesign = null;
  const hasArticleQuery = !!dispatchQuery.trim();
  const hasBrandQuery = !!dispatchBrandQuery.trim();

  if(selectedDesign){
    // A design was explicitly picked from the selection list (or matched itself
    // exactly) — always resolve to exactly this design, even if its digits
    // happen to also appear inside a longer design number like "118 NAVY PURPLE".
    exactDesign = selectedDesign;
  } else if(hasArticleQuery){
    const q = dispatchQuery.trim().toLowerCase();
    const matchingDesigns = allDesigns.filter(d=>d.toLowerCase().includes(q));
    if(!matchingDesigns.length){
      resultsHtml = `<div class="empty">${t('no_article_found')}</div>`;
    } else if(matchingDesigns.length > 1){
      resultsHtml = `<div class="card">
        <div class="section-label" style="margin-top:0;">${t('matching_articles')}</div>
        ${matchingDesigns.map(d=>`<button class="secondary" style="margin-top:8px;text-align:left;" onclick="pickDesign('${d.replace(/'/g,"\\'")}')">${escapeHtml(d)}</button>`).join('')}
      </div>`;
    } else {
      exactDesign = matchingDesigns[0];
    }
  }

  if(exactDesign){
    let matches = activeBookings.filter(b=>b.designNumber===exactDesign && inDispatchDateRange(b.orderedAt));
    if(hasBrandQuery){
      const bq = dispatchBrandQuery.trim().toLowerCase();
      matches = matches.filter(b=>(b.brand||'').toLowerCase().includes(bq));
    }
    const pendingQty = matches.filter(b=>b.status==='pending').reduce((s,b)=>s+b.qty,0);
    const doneQty = matches.filter(b=>b.status==='dispatched').reduce((s,b)=>s+b.qty,0);

    const customers = [...new Set(matches.map(b=>b.customerName))];
    const custCards = customers.length ? customers.map(cname=>{
      const rows = matches.filter(b=>b.customerName===cname);
      const allDone = rows.every(b=>b.status==='dispatched');

      // Small order-date label next to the customer's name — if they ordered
      // this article on more than one date, show each date once.
      const orderDates = [...new Set(rows.map(b=>dispatchDateKey(b.orderedAt)))]
        .sort((a,b)=>b.localeCompare(a))
        .map(dk=>dispatchDateLabel(dk));

      // group this customer's rows by colour + brand together, since the same
      // customer (or different customers) can order the same article under
      // different brands and/or colours — staff need to see exactly which
      // sizes belong to which brand+colour combo, not just a flat list
      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');

      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>{
          const done = b.status==='dispatched';
          return `<button class="size-btn ${done?'done':''}" ${done?'disabled':''} onclick="dispatchOne('${b.id}')">${escapeHtml(b.size)} · ${b.qty}${done?' ✓':''}</button>`;
        }).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `<div class="cust-card${allDone ? ' all-done' : ''}">
        <div class="cust-head"><span class="name">${escapeHtml(cname)} <span style="font-size:11.5px;font-weight:500;color:#8a93a0;margin-left:6px;">${orderDates.map(escapeHtml).join(', ')}</span></span>${allDone ? `<span class="set-pill done">${t('fully_dispatched')}</span>` : ''}</div>
        ${groupsHtml}
      </div>`;
    }).join('') : `<div class="empty">${t('no_article_found')}</div>`;

    // Parties whose order for this article was moved to Deleted — shown
    // greyed out (like a fully-dispatched card) with their actual size/qty
    // details still visible, just non-clickable. Shown even if the same
    // customer also has a separate active order for this article on a
    // different date — the deleted one still appears as its own blurred card.
    const trashedMatches = bookings.filter(b=>b.trashed && b.designNumber===exactDesign &&
      (!hasBrandQuery || (b.brand||'').toLowerCase().includes(dispatchBrandQuery.trim().toLowerCase())));
    const trashedCustomerNames = [...new Set(trashedMatches.map(b=>b.customerName))];
    const trashedCardsHtml = trashedCustomerNames.map(cname=>{
      const rows = trashedMatches.filter(b=>b.customerName===cname);
      const orderDates = [...new Set(rows.map(b=>dispatchDateKey(b.orderedAt)))]
        .sort((a,b)=>b.localeCompare(a))
        .map(dk=>dispatchDateLabel(dk));

      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');
      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>`<span class="size-btn done">${escapeHtml(b.size)} · ${b.qty}</span>`).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `
      <div class="cust-card" style="opacity:0.45;filter:grayscale(65%);pointer-events:none;user-select:none;">
        <div class="cust-head"><span class="name">${escapeHtml(cname)} <span style="font-size:11.5px;font-weight:500;color:#8a93a0;margin-left:6px;">${orderDates.map(escapeHtml).join(', ')}</span></span><span class="set-pill" style="background:#e2e2e2;color:#777;">${t('nav_deleted')}</span></div>
        ${groupsHtml}
      </div>`;
    }).join('');

    const allColours = [...new Set(matches.map(b=>b.colour).filter(Boolean))];
    const allBrands = [...new Set(matches.map(b=>b.brand).filter(Boolean))];
    resultsHtml = `
      <div class="card">
        <div class="section-label" style="margin-top:0;">${t('article')}: ${escapeHtml(exactDesign)}
          ${selectedDesign ? `<button class="chip x" style="border:none;background:none;color:var(--navy);font-weight:700;float:right;" onclick="clearDesignSelection()">✕ ${t('change')}</button>` : ''}
        </div>
        ${allColours.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:4px;">${t('colours_ordered')}: ${allColours.map(escapeHtml).join(', ')}</div>` : ''}
        ${allBrands.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:8px;">${t('brands_ordered')}: ${allBrands.map(escapeHtml).join(', ')}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="set-pill pending">${t('closing_set')}: ${pendingQty} ${t('badge_pending')}</span>
          <span class="set-pill done">${t('dispatched')}: ${doneQty}</span>
        </div>
      </div>
      ${custCards}
      ${trashedCardsHtml}
    `;
  } else if(!hasArticleQuery && hasBrandQuery){
    // Article number left blank, only a brand typed — show every article
    // ordered under that brand, grouped by article then colour, each line
    // naming the customer and size, plus a Print (PDF) option for the list.
    const bq = dispatchBrandQuery.trim().toLowerCase();
    const brandMatches = activeBookings.filter(b=>(b.brand||'').toLowerCase().includes(bq) && inDispatchDateRange(b.orderedAt));

    if(!brandMatches.length){
      resultsHtml = `<div class="empty">${t('no_brand_orders')}</div>`;
    } else {
      const designGroups = {};
      brandMatches.forEach(b=>{
        if(!designGroups[b.designNumber]) designGroups[b.designNumber] = [];
        designGroups[b.designNumber].push(b);
      });
      const designKeys = Object.keys(designGroups).sort((a,b)=>a.localeCompare(b));
      const totalSets = brandMatches.reduce((s,b)=>s+b.qty,0);

      const articleCards = designKeys.map(dn=>{
        const rows = designGroups[dn];
        const dnTotal = rows.reduce((s,b)=>s+b.qty,0);
        const colourGroups = {};
        rows.forEach(b=>{
          const key = b.colour || '';
          if(!colourGroups[key]) colourGroups[key] = [];
          colourGroups[key].push(b);
        });
        const colourKeys = Object.keys(colourGroups);
        const showColourLabels = colourKeys.length > 1 || (colourKeys.length===1 && colourKeys[0] !== '');

        const colourSections = colourKeys.map(colour=>{
          if(dispatchBrandView === 'detail'){
            // Per-customer detail, as it was before — each customer's own line.
            const lines = colourGroups[colour].map(b=>{
              const done = b.status==='dispatched';
              return `<div class="item-line"><span>${escapeHtml(b.customerName)} · ${escapeHtml(b.size)}</span><span>${b.qty} ${t('set')} ${done?'✓':''}</span></div>`;
            }).join('');
            const label = showColourLabels ? `<div class="colour-label">${escapeHtml(colour || t('no_colour'))}</div>` : '';
            return `${label}${lines}`;
          }
          // Size-wise total: sum every customer's qty for this article+colour+size
          // together, instead of listing each customer's line separately, so
          // staff can see at a glance how many sets of each size are on order.
          const sizeTotals = {};
          const sizeStatus = {};
          colourGroups[colour].forEach(b=>{
            const sz = b.size || '-';
            sizeTotals[sz] = (sizeTotals[sz] || 0) + b.qty;
            if(!sizeStatus[sz]) sizeStatus[sz] = { pending:0, dispatched:0 };
            sizeStatus[sz][b.status==='dispatched' ? 'dispatched' : 'pending'] += b.qty;
          });
          const sizeKeys = Object.keys(sizeTotals).sort((a,b)=>a.localeCompare(b));
          const lines = sizeKeys.map(sz=>{
            const st = sizeStatus[sz];
            let statusNote = '';
            if(st.dispatched && st.pending) statusNote = ` (${st.dispatched} ${t('dispatched')}, ${st.pending} ${t('badge_pending')})`;
            else if(st.dispatched) statusNote = ` (${t('dispatched')} ✓)`;
            return `<div class="item-line"><span>${escapeHtml(sz)}</span><span>${sizeTotals[sz]} ${t('set')}${statusNote}</span></div>`;
          }).join('');
          const label = showColourLabels ? `<div class="colour-label">${escapeHtml(colour || t('no_colour'))}</div>` : '';
          return `${label}${lines}`;
        }).join('');

        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${t('article')}: ${escapeHtml(dn)}</span><span class="set-pill pending">${dnTotal} ${t('sets')}</span></div>
          ${colourSections}
        </div>`;
      }).join('');

      resultsHtml = `
        <div class="card">
          <div class="section-label" style="margin-top:0;">${t('brand_overview')}: ${escapeHtml(dispatchBrandQuery.trim())}</div>
          <div style="font-size:13px;color:#5b6472;margin-bottom:10px;">${designKeys.length} ${t('articles_word')} · ${totalSets} ${t('sets')}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
            <button class="secondary" style="${dispatchBrandView==='summary'?'background:var(--navy);color:#fff;':''}" onclick="setDispatchBrandView('summary')">Size-wise Total</button>
            <button class="secondary" style="${dispatchBrandView==='detail'?'background:var(--navy);color:#fff;':''}" onclick="setDispatchBrandView('detail')">Customer-wise Detail</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="secondary" onclick="printBrandOverview()">${t('print')} PDF</button>
            <button class="secondary" onclick="downloadBrandExcel()">Download Excel</button>
          </div>
        </div>
        ${articleCards}
      `;
    }
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_by_article')}</h2>
      <input id="dispatchSearch" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(dispatchQuery)}" oninput="onDispatchSearch(this.value)" autofocus>
      <label style="margin-top:10px;">${t('by_brand_name')} (${t('optional_word')})</label>
      <input id="dispatchBrandSearch" list="brandList" placeholder="${t('brand_ph_optional')}" value="${escapeHtml(dispatchBrandQuery)}" oninput="onDispatchBrandSearch(this.value)">
      <label style="margin-top:10px;">${t('from_date')} (${t('optional_word')})</label>
      <input id="dispatchFromDate" type="date" value="${escapeHtml(dispatchFromDate)}" oninput="onDispatchDateRange('from', this.value)">
      <label style="margin-top:10px;">${t('to_date')} (${t('optional_word')})</label>
      <input id="dispatchToDate" type="date" value="${escapeHtml(dispatchToDate)}" oninput="onDispatchDateRange('to', this.value)">
    </div>
    ${resultsHtml}
  `;
}

function setDispatchBrandView(view){
  dispatchBrandView = view;
  render();
}

function onDispatchDateRange(which, val){
  if(which==='from') dispatchFromDate = val; else dispatchToDate = val;
  render();
}

function printBrandOverview(){
  const bq = dispatchBrandQuery.trim();
  if(!bq) return;
  const bql = bq.toLowerCase();
  const matches = bookings.filter(b=>!b.trashed && (b.brand||'').toLowerCase().includes(bql) && inDispatchDateRange(b.orderedAt))
    .sort((a,b)=> a.designNumber.localeCompare(b.designNumber) || (a.colour||'').localeCompare(b.colour||'') || a.customerName.localeCompare(b.customerName));
  if(!matches.length){ alert(t('no_brand_orders')); return; }
  const totalSets = matches.reduce((s,b)=>s+b.qty,0);
  const rows = matches.map(b=>[b.designNumber, b.colour||'-', b.customerName, b.size, String(b.qty), b.status==='dispatched'?t('dispatched'):t('badge_pending')]);
  let dateNote = '';
  if(dispatchFromDate || dispatchToDate){
    dateNote = ` (${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '…'} – ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '…'})`;
  }
  const blob = buildPdfBlob(`${t('brand_overview')}: ${bq}${dateNote}`, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, ['Article','Colour','Customer','Size','Set','Status'], rows, `${t('total')}: ${totalSets} ${t('sets')}`);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  openPdfBlob(blob, `Brand-${bq.replace(/[^a-z0-9]/gi,'_')}.pdf`);
}

function downloadBrandExcel(){
  const bq = dispatchBrandQuery.trim();
  if(!bq) return;
  if(!window.XLSX){ alert(t('pdf_gen_fail')); return; }
  const bql = bq.toLowerCase();
  const matches = bookings.filter(b=>!b.trashed && (b.brand||'').toLowerCase().includes(bql) && inDispatchDateRange(b.orderedAt));
  if(!matches.length){ alert(t('no_brand_orders')); return; }

  // Aggregate by Article + Colour + Size, same totals shown on screen, plus
  // a break-out of how many of those sets are pending vs already dispatched.
  const agg = {};
  matches.forEach(b=>{
    const key = b.designNumber + '||' + (b.colour||'-') + '||' + (b.size||'-');
    if(!agg[key]) agg[key] = { designNumber:b.designNumber, colour:b.colour||'-', size:b.size||'-', total:0, pending:0, dispatched:0 };
    agg[key].total += b.qty;
    agg[key][b.status==='dispatched' ? 'dispatched' : 'pending'] += b.qty;
  });
  const rows = Object.values(agg).sort((a,b)=>
    a.designNumber.localeCompare(b.designNumber) || a.colour.localeCompare(b.colour) || a.size.localeCompare(b.size)
  );

  const sheetData = [['Article','Colour','Size','Total Sets','Pending','Dispatched']];
  rows.forEach(r=> sheetData.push([r.designNumber, r.colour, r.size, r.total, r.pending, r.dispatched]));
  const totalSets = matches.reduce((s,b)=>s+b.qty,0);
  sheetData.push([]);
  sheetData.push(['', '', '', 'Total', '', totalSets]);

  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = [{wch:12},{wch:14},{wch:12},{wch:12},{wch:10},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Brand Overview');
  XLSX.writeFile(wb, `Brand-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
}

async function dispatchOne(bookingId){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b || b.status==='dispatched') return;
  b.status = 'dispatched';
  b.dispatchedAt = new Date().toISOString();
  b.dispatchedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  await saveData();
  await logActivity('Item Dispatched', `${b.customerName} — Design ${b.designNumber}, ${b.size} × ${b.qty}`);
  render();
}

// Dispatches every pending item in one customer's whole Pending-tab group
// (i.e. one date group) in a single tap, straight from the Pending tab.
// It's the exact same status flip as dispatchOne, just applied to every
// row in that group — so it shows up correctly (blurred/✓) the moment
// someone searches for it in the Article tab or opens the Dispatched tab.
async function dispatchGroupDated(cname, dk){
  const now = new Date().toISOString();
  const dispatchedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  const rows = bookings.filter(b=>b.customerName===cname && b.status==='pending' && !b.trashed && dispatchDateKey(b.orderedAt)===dk);
  if(!rows.length) return;
  let total = 0;
  rows.forEach(b=>{
    b.status = 'dispatched';
    b.dispatchedAt = now;
    b.dispatchedBy = dispatchedBy;
    total += b.qty;
  });
  await saveData();
  await logActivity('Order Dispatched', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

/* ---------------- DISPATCHED ORDERS TAB ---------------- */

function dispatchDateKey(iso){
  const d = new Date(iso);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dispatchDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function renderDispatchedOrders(main){
  let dispatchedAll = bookings.filter(b=>b.status==='dispatched' && !b.trashed);

  if(doSearchDesign.trim()){
    const q = doSearchDesign.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>b.designNumber.toLowerCase().includes(q));
  }
  if(doSearchBrand.trim()){
    const q = doSearchBrand.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>(b.brand||'').toLowerCase().includes(q));
  }
  if(doSearchDate){
    dispatchedAll = dispatchedAll.filter(b=>dispatchDateKey(b.dispatchedAt)===doSearchDate);
  }

  let resultsHtml = '';
  if(!dispatchedAll.length){
    resultsHtml = `<div class="empty">${t('no_dispatched_orders')}${(doSearchDesign||doSearchBrand||doSearchDate) ? ' '+t('no_dispatched_match') : ' '+t('no_dispatched_yet')}</div>`;
  } else {
    const dateGroups = {};
    dispatchedAll.forEach(b=>{
      const dk = dispatchDateKey(b.dispatchedAt);
      if(!dateGroups[dk]) dateGroups[dk] = {};
      if(!dateGroups[dk][b.customerName]) dateGroups[dk][b.customerName] = [];
      dateGroups[dk][b.customerName].push(b);
    });
    const dateKeys = Object.keys(dateGroups).sort((a,b)=>b.localeCompare(a));
    resultsHtml = dateKeys.map(dk=>{
      const custMap = dateGroups[dk];
      const custCards = Object.keys(custMap).map(cname=>{
        const rows = custMap[cname].sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
        const total = rows.reduce((s,b)=>s+b.qty,0);
        const brands = [...new Set(rows.map(b=>b.brand).filter(Boolean))].join(', ');
        const lines = rows.map(b=>
          `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}</span><span>${b.qty} ${t('set')} <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></span></div>`
        ).join('');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(cname)}${brands ? ` <span class="subtle">(${escapeHtml(brands)})</span>` : ''}</span><span class="set-pill done">${total} ${t('sets')}</span></div>
          ${lines}
          <div class="order-total-line"><span>${t('total')}</span><span>${total} ${t('sets')}</span></div>
          <div class="action-row">
            <button class="action-btn wa" onclick="shareWhatsAppDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('whatsapp')}</button>
            <button class="action-btn pr" onclick="printOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('print')}</button>
            ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('delete_btn')}</button>` : ''}
          </div>
        </div>`;
      }).join('');
      return `<div class="date-section-label">${dispatchDateLabel(dk)}</div>${custCards}`;
    }).join('');
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_dispatched')}</h2>
      <label>${t('by_article_number')}</label>
      <input id="doSearchDesign" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(doSearchDesign)}" oninput="onDoSearch('design', this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')}</label>
      <input id="doSearchBrand" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(doSearchBrand)}" oninput="onDoSearch('brand', this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="doSearchDate" type="date" value="${escapeHtml(doSearchDate)}" oninput="onDoSearch('date', this.value)">
    </div>
    ${resultsHtml}
  `;
}

function onDoSearch(which, val){
  if(which==='design') doSearchDesign = val;
  else if(which==='brand') doSearchBrand = val;
  else doSearchDate = val;
  render();
  setTimeout(()=>{
    const id = which==='design' ? 'doSearchDesign' : which==='brand' ? 'doSearchBrand' : 'doSearchDate';
    const el = document.getElementById(id);
