/* ---------------- AI order-form reading ----------------
   Lets a photo/PDF/Excel of a paper order form be read straight into the
   Order form, instead of typing every line by hand. The actual AI call
   happens in Apps Script (see google-sheets-backend-code) — this file
   never holds any API key, it only sends the file and gets structured
   JSON back. ------------------------------------------------------- */

function fileToBase64_(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function excelFileToRawText_(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  let text = '';
  wb.SheetNames.forEach(name=>{
    const sheet = wb.Sheets[name];
    text += XLSX.utils.sheet_to_csv(sheet) + '\n';
  });
  return text;
}

// Shrinks big phone photos before upload (long side max 2000px). Smaller
// uploads are faster and use fewer AI tokens, and 2000px is still plenty
// to read handwriting.
function downscaleImageToBase64_(file, maxSide){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}

async function handleAiOrderFileUpload(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const MAX_FILES = 5;
  const msg = document.getElementById('bookMsg');
  if(files.length > MAX_FILES){
    if(msg) msg.innerHTML = `<div class="msg err">${t('ai_max_files')}</div>`;
    const inp0 = document.getElementById('aiOrderFileInput');
    if(inp0) inp0.value = '';
    return;
  }
  if(msg) msg.innerHTML = `<div class="msg">${t('ai_reading')}</div>`;

  try{
    let payload;
    const isExcel = f => ['xlsx','xls'].includes(f.name.split('.').pop().toLowerCase());
    const excelFiles = files.filter(isExcel);
    const otherFiles = files.filter(f=>!isExcel(f));

    if(excelFiles.length && otherFiles.length){
      // Excel sheets are read as text, photos/PDFs as images — they go to the
      // AI differently, so they can't be mixed in one upload.
      if(msg) msg.innerHTML = `<div class="msg err">${t('ai_no_mix')}</div>`;
      const inp1 = document.getElementById('aiOrderFileInput');
      if(inp1) inp1.value = '';
      return;
    }

    if(excelFiles.length){
      // Excel: every selected sheet is turned into text and sent together.
      let rawText = '';
      for(const f of excelFiles){ rawText += await excelFileToRawText_(f) + '\n'; }
      payload = { action:'aiExtractOrder', rawText };
    } else {
      // Photos/PDFs: all selected pages go to the AI in ONE request, which
      // uses one unit of free quota instead of one per photo.
      const encoded = [];
      for(const f of otherFiles){
        const e = f.name.split('.').pop().toLowerCase();
        if(e === 'pdf'){
          encoded.push({ dataBase64: await fileToBase64_(f), mimeType:'application/pdf' });
        } else {
          encoded.push({ dataBase64: await downscaleImageToBase64_(f, 2000), mimeType:'image/jpeg' });
        }
      }
      payload = { action:'aiExtractOrder', files: encoded };
    }

    const res = await fetch(SHEET_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if(!result.success){
      if(msg) msg.innerHTML = `<div class="msg err">${t('ai_read_failed')}${result.error ? ': '+escapeHtml(result.error) : ''}</div>`;
      const inp2 = document.getElementById('aiOrderFileInput');
      if(inp2) inp2.value = '';
      return;
    }
    applyAiExtractedOrder_(result.data);
    // applyAiExtractedOrder_ triggers a re-render, which replaces the whole
    // #bookMsg element — grab it fresh so the success message actually shows.
    const msg2 = document.getElementById('bookMsg');
    if(msg2) msg2.innerHTML = `<div class="msg ok">${t('ai_read_done')}</div>`;
  }catch(e){
    console.error('AI order read failed', e);
    const detail = e && e.message ? e.message : String(e);
    const msgNow = document.getElementById('bookMsg');
    if(msgNow) msgNow.innerHTML = `<div class="msg err">${t('ai_read_failed')}: ${escapeHtml(detail)}</div>`;
  }
  const inp = document.getElementById('aiOrderFileInput');
  if(inp) inp.value = '';
}

function applyAiExtractedOrder_(data){
  if(!data) return;
  if(data.customerName){ draftCustomer = data.customerName; }
  if(data.brand){ draftBrand = data.brand; }

  (data.items || []).forEach(item=>{
    const designNo = (item.designNumber || '').toString().trim();
    const colour = (item.colour || '').toString().trim();
    const size = (item.size || '').toString().trim();
    const qty = parseInt(item.qty) || 1;
    if(!designNo || !size) return;
    let entry = draftCart.find(d=>d.designNumber===designNo && (d.colour||'')===colour);
    if(!entry){
      entry = { designNumber: designNo, colour: colour, sizes: [] };
      draftCart.push(entry);
    }
    // A combined range read off the order form (e.g. "20/36") gets split
    // into its component sizes here too, exactly like typing it manually.
    expandSizeRange_(size, data.brand).forEach(sz => entry.sizes.push({ size: sz, qty }));
  });
  render();
}

// The fixed, irregular age-bracket table this trade uses for kids' years
// (2 to 16) — not a uniform step, so it's kept as an explicit list rather
// than computed. This is the DEFAULT table, used for every brand except
// Spring Kids/Kidz (see isSpringBrand_ below).
const AGE_BRACKETS_ = [[2,5],[6,8],[9,14],[15,16]];

// Walks AGE_BRACKETS_, keeping every bracket that starts at or after
// `start`, up to (and clipped to) `end`. e.g. walkAgeBrackets_(9,16) →
// ["9/14","15/16"]; walkAgeBrackets_(2,14) → ["2/5","6/8","9/14"].
function walkAgeBrackets_(start, end){
  const out = [];
  for(const [bs,be] of AGE_BRACKETS_){
    if(bs < start) continue;
    if(bs > end) break;
    out.push(`${bs}/${Math.min(be, end)}`);
    if(be >= end) break;
  }
  return out;
}

// Spring Kids / Spring Kidz / Spring always split an age range into exactly
// TWO brackets — a fixed 4-unit first bracket, then everything else in one
// second bracket — instead of the finer AGE_BRACKETS_ table above.
// e.g. 2/16 -> ["2/6","8/16"]; 2/12 -> ["2/6","8/12"].
function isSpringBrand_(brand){
  return /spring/i.test(brand || '');
}
function walkSpringBrackets_(start, end){
  return [`${start}/${start+4}`, `${start+6}/${end}`];
}

// Splits a measurement-style range (inches, start >= 16) into 4-unit size
// spans stepped by 6 (20/24, 26/30, 32/36 ...). When the total range is an
// exact multiple of 6, the very first bucket is widened by 2 extra units
// so everything still lines up cleanly on the step-6 grid all the way to
// `end` (e.g. 18/36 → 18/24, 26/30, 32/36 instead of ending on an odd
// leftover bucket).
function walkMeasurement_(start, end){
  const out = [];
  let g = start;
  if((end - start) % 6 === 0){
    out.push(`${start}/${start+6}`);
    g = start + 8;
  }
  while(g <= end){
    out.push(`${g}/${Math.min(g+4, end)}`);
    g += 6;
  }
  return out;
}

// A single typed range that actually spans several standard sizes (e.g.
// "20/36", "20-36", "20x36") gets split into the individual sizes that
// make it up, so typing the full range once still saves each size as its
// own separate line, same as adding them one at a time. A normal single
// size like "20/24" (span 4 or less) is always left exactly as typed —
// only a genuinely combined range gets split.
function expandSizeRange_(token, brand){
  const springBrand = isSpringBrand_(brand);

  // "9m/16", "9m/8" — an infant-months start ("9m") through a years end,
  // spans an infant bucket (months/24) plus the standard years brackets
  // starting fresh from 2 years old, clipped to the given end.
  const mm = token.match(/^(\d+)\s*m\s*[\/\-xX]\s*(\d+)$/i);
  if(mm){
    const months = mm[1], end = parseInt(mm[2],10);
    const ageBrackets = springBrand ? walkSpringBrackets_(2, end) : walkAgeBrackets_(2, end);
    return [`${months}/24`, ...ageBrackets];
  }

  const m = token.match(/^(\d+)\s*[\/\-xX]\s*(\d+)$/);
  if(!m) return [token];
  const start = parseInt(m[1],10), end = parseInt(m[2],10);
  if(!(end > start) || (end - start) <= 4) return [token];

  if(start < 16){
    // Small numbers are years (age). Spring Kids/Kidz always gets exactly
    // two brackets; every other brand (or no brand at all) uses the finer
    // AGE_BRACKETS_ table. A range like "9/24" crosses out of the 2–16
    // table entirely and isn't a recognised combination in either system,
    // so it's left alone rather than guessed at.
    if(end <= 16){
      if(springBrand){
        // Spring splits ONLY a full combined range that starts at 2 (2/16 -> 2/6 + 8/16).
        // A ready-made size like 8/16 or 8/14 is already a single size: keep it exactly as typed.
        if(start !== 2 || end <= start + 6) return [token];
        return walkSpringBrackets_(start, end);
      }
      // Other brands: only split when the range really begins on a bracket start (2, 6, 9, 15).
      if(!AGE_BRACKETS_.some(b=>b[0] === start)) return [token];
      return walkAgeBrackets_(start, end);
    }
    return [token];
  }

  // start >= 16: a measurement (inches) range — same for every brand.
  return walkMeasurement_(start, end);
}

// Typing a space right after the Design Number jumps straight to Size —
// done via BOTH the keydown handler (clean, instant on a physical
// keyboard) and this input-based check (mobile on-screen keyboards often
// don't fire a usable keydown for spacebar, but 'input' always fires).
function jumpToSizeOnSpace_(el){
  if(el.value.endsWith(' ')){
    tempDesignNumber = el.value.trim();
    el.value = tempDesignNumber;
    const sizeEl = document.getElementById('sizeVal');
    if(sizeEl){ sizeEl.focus(); sizeEl.select(); }
  } else {
    tempDesignNumber = el.value;
  }
}


/* ---------------- MULTI COLOUR ----------------
   Colour box works like the Size box: several colours can be typed together,
   separated by space , - / + ; (any of them). Each colour becomes its own set.
   A two-word colour can be kept as ONE colour by joining it with an underscore
   (Navy_Purple -> "Navy Purple"). */
function parseColourList_(raw){
  const seen = {}, out = [];
  String(raw == null ? '' : raw).split(/[\s,\-\/+;&|]+/).forEach(tok=>{
    const c = tok.replace(/_/g, ' ').trim();
    if(!c) return;
    const k = normKey_(c);
    if(seen[k]) return;
    seen[k] = 1; out.push(c);
  });
  return out.length ? out : [''];     // no colour typed = one set without colour
}

/* ---------------- DUPLICATE DESIGN CHECK ----------------
   Alert ONLY when everything is exactly the same: same customer + same brand +
   same design number + same colour + same SIZE. A different size, a different
   colour or a different brand is allowed. (Both colours blank counts as same.) */
function findSavedDuplicate_(cust, brand, design, colour, size){
  const c = normKey_(cust), br = normKey_(brand), d = normKey_(design), col = normKey_(colour), sz = normKey_(size);
  if(!c || !br || !d) return null;
  return bookings.find(b=>!b.trashed &&
    normKey_(b.customerName)===c && normKey_(b.brand)===br &&
    normKey_(b.designNumber)===d && normKey_(b.colour)===col && normKey_(b.size)===sz) || null;
}
function findCartDuplicate_(design, colour, size){
  const d = normKey_(design), col = normKey_(colour), sz = normKey_(size);
  return draftCart.find(x=>normKey_(x.designNumber)===d && normKey_(x.colour)===col &&
    x.sizes.some(s=>normKey_(s.size)===sz)) || null;
}
// dups = [{ colour, size, saved }]  (saved = the earlier order, or null if it is in the current list)
function showDuplicateList_(design, dups, partial){
  const lines = dups.map(x=>{
    const base = `${design}${x.colour ? ' · ' + x.colour : ''} · ${x.size}`;
    return x.saved
      ? `${base}  —  ${t('dup_prev_order')}: ${dispatchDateLabel(dispatchDateKey(x.saved.orderedAt))} (${x.saved.status==='dispatched' ? t('dispatched') : t('badge_pending')})`
      : `${base}  —  ${t('dup_in_cart')}`;
  });
  let text = `⚠️ ${t('dup_design_alert')}\n\n${lines.join('\n')}`;
  if(partial) text += `\n\n${t('dup_skipped_note')}`;
  const msg = document.getElementById('bookMsg');
  if(msg) msg.innerHTML = `<div class="msg err" style="font-weight:700;">${escapeHtml(text).replace(/\n/g,'<br>')}</div>`;
  alert(text);
}
function showDuplicateAlert_(design, colour, savedBooking, size){
  showDuplicateList_(design, [{ colour: colour, size: size || (savedBooking && savedBooking.size) || '', saved: savedBooking }], false);
}

function addTempSize(){
  const sizeInput = document.getElementById('sizeVal');
  const qtyInput = document.getElementById('qtyVal');
  const designInput = document.getElementById('designNo');
  const colourInput = document.getElementById('designColour');
  const priceInput = document.getElementById('designPrice');
  const designNo = designInput.value.trim();
  // While Colour/Price are hidden they are ignored, so nothing typed earlier
  // gets silently attached to an order the person can no longer see it on.
  const colourRaw = colourInput ? colourInput.value.trim() : '';
  const colours = parseColourList_(colourRaw);   // "red blue, green" -> 3 colours, each its own set
  const price = priceInput ? priceInput.value.trim() : '';
  const rawSize = sizeInput.value.trim();
  const qty = parseInt(qtyInput.value) || 0;
  const unitEl = document.getElementById('unitVal');
  const unit = unitEl ? unitEl.value : orderUnit;
  orderUnit = unit;
  const msg = document.getElementById('bookMsg');
  if(!designNo){ msg.innerHTML = `<div class="msg err">${t('enter_design_err')}</div>`; return; }
  // Several sizes can be typed in one go, separated by spaces and/or commas
  // (e.g. "18/22 24/28 30/34") — each becomes its own line, all at the same
  // Set count, so a multi-size design can be added in a single tap.
  // A single typed size is allowed to be a combined range that gets split
  // automatically (e.g. "2/16" or "20/36"). The moment more than one size is
  // already typed (space/comma separated), each one is taken as a literal,
  // final size exactly as written — nothing gets auto-split further, so two
  // real sizes entered together (e.g. "2/5 8/16") are saved exactly as those
  // two sizes, not re-expanded.
  const rawTokens = rawSize.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
  const brandNow = (document.getElementById('custBrand') && document.getElementById('custBrand').value) || '';
  const sizes = rawTokens.length === 1 ? expandSizeRange_(rawTokens[0], brandNow) : rawTokens;
  if(!sizes.length || qty <= 0){
    msg.innerHTML = `<div class="msg err">${t('size_qty_err')}</div>`;
    return;
  }
  // Every colour x size combination is its own set. Alert only for a combination that
  // is EXACTLY the same (customer + brand + design + colour + size) as one already in
  // this order list or ordered earlier; the other combinations still get added.
  const custNow = effectiveCustomerName_();
  const dups = [], toAdd = [];
  colours.forEach(col=>{
    sizes.forEach(size=>{
      if(toAdd.some(x=>normKey_(x.col)===normKey_(col) && normKey_(x.size)===normKey_(size))) return;
      if(findCartDuplicate_(designNo, col, size)){ dups.push({ colour: col, size, saved: null }); return; }
      const savedDup = findSavedDuplicate_(custNow, brandNow, designNo, col, size);
      if(savedDup){ dups.push({ colour: col, size, saved: savedDup }); return; }
      toAdd.push({ col, size });
    });
  });
  if(dups.length){
    showDuplicateList_(designNo, dups, toAdd.length > 0);
    if(!toAdd.length) return;
  }
  toAdd.forEach(({ col, size })=>{
    let entry = draftCart.find(d=>d.designNumber===designNo && (d.colour||'')===col);
    if(!entry){
      entry = { designNumber: designNo, colour: col, sizes: [] };
      draftCart.push(entry);
    }
    entry.sizes.push({ size, qty, price, unit });
  });

  // After "+": the Size stays as typed (change it by hand when needed) and the
  // Colour box is emptied, ready for the next colour.
  tempSizeText = sizeInput.value;
  tempColour = '';
  if(colourInput) colourInput.value = '';
  qtyTouched = false;
  qtyInput.value = String(defaultQtyFor_(orderUnit));
  msg.innerHTML = '';
  render();
  // Cursor goes back to Design Number (not Size) — the common next step is
  // starting the NEXT design, since one tap now covers every size at once.
  setTimeout(()=>{
    const el=document.getElementById('designNo');
    if(el){ el.focus(); el.select(); }
  }, 0);
}

function removeCartSize(designIdx, sizeIdx){
  const d = draftCart[designIdx];
  if(!d) return;
  if(!confirm('Remove this size from the order?\nAre you sure?')) return;
  d.sizes.splice(sizeIdx,1);

}

let isSavingOrder = false; // prevents the same order being saved twice if the button is tapped again before the first save finishes

async function saveOrder(){
  if(isSavingOrder) return; // a save is already running — ignore the extra tap

  const custName = effectiveCustomerName_();
  const custCity = ((document.getElementById('custCity') || {}).value || '').trim();
  const custBrand = (document.getElementById('custBrand').value || '').trim();
  const msg = document.getElementById('bookMsg');
  if(!custName){ msg.innerHTML = `<div class="msg err">${t('enter_customer_err')}</div>`; return; }
  if(!custBrand){ msg.innerHTML = `<div class="msg err">${t('enter_brand_err')}</div>`; return; }
  if(!draftCart.length){ return; }

  // Final safety check (also covers designs filled in by the AI upload):
  // no design + colour may repeat for this customer + brand.
  for(const d of draftCart){
    for(const s of d.sizes){
      const dup = findSavedDuplicate_(custName, custBrand, d.designNumber, d.colour, s.size);
      if(dup){ showDuplicateAlert_(d.designNumber, d.colour, dup, s.size); return; }
    }
  }

  isSavingOrder = true;
  const saveBtn = document.getElementById('saveOrderBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = t('saving_word'); }

  try{
    const loc = await orderLocation_();
    const now = new Date().toISOString();
    let totalSets = 0;
    draftCart.forEach(d=>{
      d.sizes.forEach(s=>{
        totalSets += s.qty;
        bookings.push({
          id: uid(),
          customerName: custName,
          city: custCity,
          brand: custBrand,
          designNumber: d.designNumber,
          colour: d.colour || '',
          size: s.size,
          qty: s.qty,
          unit: unitOf_(s),
          pricePerPcs: s.price || '',
          status: 'pending',
          orderedAt: now,
          dispatchedAt: null,
          orderedBy: currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null,
          ...(loc && loc.lat ? { lat: loc.lat, lng: loc.lng, locAcc: loc.acc, locAt: new Date(loc.at).toISOString() } : { locErr: (loc && loc.err) || 'unavailable' })
        });
      });
    });
    // Start saving (the local copy is written instantly; the cloud upload
    // carries on in the background) and open the WhatsApp share sheet RIGHT
    // NOW, while the phone still counts this as a fresh tap. If we waited
    // for the cloud save first, a slow network let that tap "expire" and the
    // phone refused to open the share sheet directly — that was the reason
    // it only sometimes went straight to WhatsApp.
    const savePromise = saveData();
    const justSavedRows = bookings.filter(b=>b.customerName===custName && b.orderedAt===now);
    const totalsTxt = totalsPdf_(justSavedRows);
    const sharePromise = shareNewOrderPdf(custName, justSavedRows, totalSets);
    await savePromise;

    const count = draftCart.length;
    await logActivity('Order Booked', `${custName}${custBrand ? ' ('+custBrand+')' : ''} — ${count} design(s), ${totalsTxt}`);
    sendOrderPush_(custName, custBrand, totalsTxt, now);

    draftCart = [];
    draftCustomer = '';
    draftCity = '';
    draftBrand = '';
    tempDesignNumber = '';
    tempColour = '';
    tempSizeText = '';
    tempPrice = '';
    tempSizes = [];
    qtyTouched = false;
    render();
    const m2 = document.getElementById('bookMsg');
    if(m2) m2.innerHTML = `<div class="msg ok">${count} ${t('designs_saved')}</div>` + (loc && loc.lat ? '' : `<div class="msg err">📍 ${loc && loc.err === 'denied' ? 'Location is OFF for this app — please allow Location in the phone/browser settings so the owner can see where orders are booked from.' : 'Could not get your location this time (no GPS signal). Order is saved.'}</div>`);

    await sharePromise;
  } finally {
    isSavingOrder = false;
  }
}

/* ---------------- ORDER LOCATION ----------------
   Every order saves the phone's location at the moment it is booked (lat / lng / accuracy), so the owner can see
   WHERE it was booked from. The location is asked in the background while the Order tab is open (so saving is never
   slowed down); if the staff member refuses permission or the phone has no GPS signal, the order still saves normally
   and the owner just sees "Location not shared". */
let lastLoc_ = null, locBusy_ = null;
function getLocOnce_(timeout, maxAge){
  return new Promise(res=>{
    if(!navigator.geolocation){ res({ err:'unavailable' }); return; }
    try{
      navigator.geolocation.getCurrentPosition(
        p=>res({ lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy || 0), at:Date.now() }),
        e=>res({ err: e && e.code === 1 ? 'denied' : 'unavailable' }),
        { enableHighAccuracy:true, timeout:timeout, maximumAge:maxAge });
    }catch(e){ res({ err:'unavailable' }); }
  });
}
function warmLocation_(){
  if(locBusy_ || (lastLoc_ && lastLoc_.lat && Date.now() - lastLoc_.at < 45000)) return;
  locBusy_ = getLocOnce_(10000, 20000).then(r=>{
    if(r.lat || !(lastLoc_ && lastLoc_.lat)) lastLoc_ = r;
    locBusy_ = null;
  });
}
async function orderLocation_(){
  if(lastLoc_ && lastLoc_.lat && Date.now() - lastLoc_.at < 90000) return lastLoc_;
  const r = await Promise.race([ locBusy_ || getLocOnce_(2500, 30000), new Promise(res=>setTimeout(()=>res({ err:'unavailable' }), 2800)) ]);
  if(r && r.lat){ lastLoc_ = r; return r; }
  if(lastLoc_ && lastLoc_.lat && Date.now() - lastLoc_.at < 15 * 60000) return lastLoc_;   // recent enough, better than nothing
  return (r && r.err) ? r : (lastLoc_ || { err:'unavailable' });
}
function isOwnerNow_(){ return !!(currentStaff && currentStaff.mobile && currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()); }
function pendLocHtml_(rows){
  if(!canCurrentUserSeeLoc_()) return '';
  return orderLocHtml_(rows) || `<div class="section-label">📍 Order location</div><div class="li"><span class="subtle">Not recorded for this order</span></div>`;
}
function pendLocBtn_(rows){
  if(!canCurrentUserSeeLoc_()) return '';
  const r = rows.filter(b=>b.lat !== undefined && b.lat !== '' && isFinite(Number(b.lat)) && isFinite(Number(b.lng)))
    .sort((a,b)=>new Date(b.orderedAt) - new Date(a.orderedAt))[0];
  if(!r) return '';
  return `<a class="action-btn pr" style="text-decoration:none;text-align:center" href="https://www.google.com/maps?q=${Number(r.lat)},${Number(r.lng)}" target="_blank" rel="noopener">📍 Location</a>`;
}
function orderLocHtml_(rows){
  if(!canCurrentUserSeeLoc_()) return '';
  const seen = {}, list = [];
  rows.forEach(b=>{ if(b.orderedAt && !seen[b.orderedAt] && !b.fromCatalog && (b.lat !== undefined && b.lat !== '' || b.locErr)){ seen[b.orderedAt] = 1; list.push(b); } });
  if(!list.length) return '';
  list.sort((a,b)=>new Date(b.orderedAt) - new Date(a.orderedAt));
  const lines = list.slice(0, 6).map(b=>{
    const who = b.orderedBy && b.orderedBy.name ? ' · ' + escapeHtml(b.orderedBy.name) : '';
    const when = escapeHtml(fmtTime(b.orderedAt));
    const lat = Number(b.lat), lng = Number(b.lng);
    if(b.lat !== undefined && b.lat !== '' && isFinite(lat) && isFinite(lng)){
      const gap = b.locAt ? Math.abs(new Date(b.orderedAt) - new Date(b.locAt)) / 60000 : 0;
      const old = gap > 3 ? ` <span class="subtle">(location ${Math.round(gap)} min earlier)</span>` : '';
      const acc = Number(b.locAcc) ? ` <span class="subtle">±${Math.round(Number(b.locAcc))} m</span>` : '';
      return `<div class="li"><span>📍 ${when}${who}${acc}${old}</span><a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-weight:700;white-space:nowrap">Open map</a></div>`;
    }
    return `<div class="li"><span>📍 ${when}${who}</span><span class="subtle">Location not shared</span></div>`;
  }).join('');
  return `<div class="section-label">📍 Order location</div>${lines}`;
}

// Upper-cases and tidies a name for use inside a file name; with
// firstWordOnly, "Grab-it" / "Grab it" both become just "GRAB".
function pdfNamePart_(txt, firstWordOnly){
  let x = (txt || '').trim();

/* ---------------- VOICE ORDER ----------------
   Mic button in the Order tab: staff speak the whole order and it fills the
   form by itself. Words that start a field: customer, city, brand, design,
   size, colour, price, qty (Hindi words also work). "2 set" / "3 pcs" gives
   the quantity. Saying "design ..." again starts the next design. Saying
   "save" saves the order. Uses the phone's own speech recognition (Chrome),
   so it needs internet and microphone permission. */
const VOICE_NUMWORDS_ = {
  zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10,
  eleven:11, twelve:12, fifteen:15, sixteen:16, twenty:20,
  ek:1, 'एक':1, do:2, 'दो':2, teen:3, 'तीन':3, char:4, chaar:4, 'चार':4,
  paanch:5, panch:5, 'पांच':5, 'पाँच':5, chhe:6, cheh:6, 'छह':6, 'छे':6,
  saat:7, 'सात':7, aath:8, 'आठ':8, nau:9, 'नौ':9, das:10, 'दस':10
};
const VOICE_KW_ = {
  customer: ['customer','customers','कस्टमर','कस्टमर्स','party','पार्टी','ग्राहक'],
  city:     ['city','सिटी','शहर'],
  brand:    ['brand','ब्रांड','ब्रैंड'],
  design:   ['design','डिजाइन','डिज़ाइन','डिज़ाईन','article','आर्टिकल'],
  size:     ['size','sizes','साइज','साइज़','साईज'],
  colour:   ['colour','color','colors','colours','कलर','रंग'],
  price:    ['price','rate','प्राइस','रेट','भाव','कीमत'],
  qty:      ['qty','quantity','क्वांटिटी','मात्रा']
};
const VOICE_KW_LOOKUP_ = (()=>{ const m = {}; Object.keys(VOICE_KW_).forEach(k=>VOICE_KW_[k].forEach(w=>{ m[w] = k; })); return m; })();
const VOICE_SAVE_ = { 'save':1, 'सेव':1, 'सेव्':1, 'सैव':1 };
// Filler words that are never part of a name / colour / number.
const VOICE_DROP_ = { 'next':1, 'अगला':1, 'अगली':1, 'agla':1, 'order':1, 'ऑर्डर':1, 'आर्डर':1, 'ऑडर':1, 'karo':1, 'करो':1, 'kar':1, 'कर':1, 'please':1 };
const VOICE_AND_ = { 'and':1, 'aur':1, 'और':1, '&':1 };

let voiceRec_ = null, voiceWanted_ = false, voiceListening_ = false, voiceSaving_ = false;
let voiceLang_ = 'en-IN';
try{ voiceLang_ = localStorage.getItem('ssa_voice_lang') || 'en-IN'; }catch(e){}
let voiceState_ = null, voiceLog_ = [], voiceInterim_ = '', voiceSession_ = 0, voiceSeen_ = {};

function voiceNewState_(){
  return { field:null, customer: draftCustomer || '', city: draftCity || '', brand: draftBrand || '',
           design:'', sizeTokens:[], colours:[], price:'', qty:0, unit:'set' };
}
function voiceTitle_(s){
  return String(s||'').trim().replace(/\s+/g,' ').replace(/(^|\s)([a-z])/g, (m,a,b)=>a+b.toUpperCase());
}
function voiceCompact_(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9\u0900-\u097F]+/g,''); }
function voiceNum_(tk){
  if(/^\d+(\.\d+)?$/.test(tk)) return tk;
  if(Object.prototype.hasOwnProperty.call(VOICE_NUMWORDS_, tk)) return String(VOICE_NUMWORDS_[tk]);
  return null;
}

// Spoken text -> clean lower-case tokens ("20 by 24" -> "20/24", "2 set" -> "@q:2:set").
function voiceNormalize_(txt){
  let s = String(txt || '').toLowerCase();
  s = s.replace(/[०-९]/g, ch=>String('०१२३४५६७८९'.indexOf(ch)));
  s = s.replace(/(\d+)\s*(?:by|बाय|slash|स्लैश|to|टू)\s*(\d+)/g, '$1/$2');
  s = s.replace(/(\d+)\s*\/\s*(\d+)/g, '$1/$2');
  const numAlt = Object.keys(VOICE_NUMWORDS_).sort((a,b)=>b.length-a.length).join('|');
  const qtyRe = new RegExp('(\\d+|'+numAlt+')\\s*(sets?|सेट्स|सेट|pcs|pc|pieces|piece|पीस)(?=$|[\\s,.;])', 'g');
  s = s.replace(qtyRe, (m, n, u)=>{
    const num = /^\d+$/.test(n) ? n : String(VOICE_NUMWORDS_[n]);
    const unit = /^(pc|piece|पीस)/.test(u) ? 'pcs' : 'set';
    return ' @q:'+num+':'+unit+' ';
  });
  s = s.replace(/[,;।"'“”]/g,' ').replace(/\.(?!\d)/g,' ');
  return s.split(/\s+/).filter(Boolean);
}

function voiceCustomerFull_(){
  const st = voiceState_ || voiceNewState_();
  const name = voiceTitle_(st.customer), city = voiceTitle_(st.city);
  if(!name) return '';
  let full = name;
  if(city && !normKey_(name).endsWith(normKey_(city))) full = name + ' ' + city;
  const ex = bookings.find(b=>voiceCompact_(b.customerName) === voiceCompact_(full));
  return ex ? String(ex.customerName) : full;
}
function voiceBrandFull_(){
  const st = voiceState_ || voiceNewState_();
  const b = voiceTitle_(st.brand);
  if(!b) return '';
  const ex = bookings.find(x=>voiceCompact_(x.brand) === voiceCompact_(b));
  return ex ? String(ex.brand) : b;
}

// Plain numbers are paired into size ranges ("20 24 26 30" -> 20/24, 26/30).
function voiceSizes_(tokens, brand){
  const out = [];
  let i = 0;
  while(i < tokens.length){
    const a = tokens[i], b = tokens[i+1];
    if(/^\d+$/.test(a) && b && /^\d+$/.test(b)){
      const na = +a, nb = +b;
      if(SIZE_PRESETS.indexOf(a+'/'+b) !== -1 || (nb > na && nb - na <= 6)){ out.push(a+'/'+b); i += 2; continue; }
    }
    out.push(a); i++;
  }
  // One combined range gets split automatically, exactly like typing it by hand.
  return out.length === 1 ? expandSizeRange_(out[0], brand) : out;
}

function voiceSay_(msg, isErr){
  voiceLog_.push({ msg, err: !!isErr });
  if(voiceLog_.length > 4) voiceLog_.shift();
}

// Moves the design being spoken into the order list (with the same
// duplicate checks as the + button).
function voiceCommitDesign_(){
  const st = voiceState_;
  if(!st || !st.design) { if(st){ st.sizeTokens = []; st.colours = []; st.price = ''; st.qty = 0; } return; }
  const designNo = st.design;
  if(!st.sizeTokens.length){
    voiceSay_(`⚠️ ${designNo}: ${t('voice_no_size')}`, true);
  } else {
    const brandNow = voiceBrandFull_();
    const cust = voiceCustomerFull_();
    const sizes = voiceSizes_(st.sizeTokens, brandNow);
    const colours = st.colours.length ? st.colours : [''];
    const qty = st.qty || defaultQtyFor_(st.unit);
    const price = st.price || '';
    const toAdd = [], dups = [];
    colours.forEach(col=>{
      sizes.forEach(size=>{
        if(toAdd.some(x=>normKey_(x.col)===normKey_(col) && normKey_(x.size)===normKey_(size))) return;
        if(findCartDuplicate_(designNo, col, size) || findSavedDuplicate_(cust, brandNow, designNo, col, size)){
          dups.push(`${designNo}${col ? ' · '+col : ''} · ${size}`); return;
        }
        toAdd.push({ col, size });
      });
    });
    toAdd.forEach(({ col, size })=>{
      let entry = draftCart.find(d=>d.designNumber===designNo && (d.colour||'')===col);
      if(!entry){ entry = { designNumber: designNo, colour: col, sizes: [] }; draftCart.push(entry); }
      entry.sizes.push({ size, qty, price, unit: st.unit });
    });
    if(dups.length) voiceSay_(`⚠️ ${t('voice_dup')}: ${dups.join(', ')}`, true);
  }
  st.design = ''; st.sizeTokens = []; st.colours = []; st.price = ''; st.qty = 0;
}

function voiceApplyToForm_(){
  const st = voiceState_;
  if(!st) return;
  draftCustomer = voiceTitle_(st.customer);
  draftCity = voiceTitle_(st.city);
  draftBrand = voiceBrandFull_() || voiceTitle_(st.brand);
  if(typeof currentTab !== 'undefined' && currentTab === 'book') render();
}

// Reads one finished piece of speech and updates the order.
function voiceFeed_(text){
  const st = voiceState_;
  if(!st) return;
  const toks = voiceNormalize_(text);
  let wantSave = false;
  for(const tk of toks){
    if(VOICE_DROP_[tk]) continue;
    const kw = VOICE_KW_LOOKUP_[tk];
    if(kw){
      if(kw === 'design'){ voiceCommitDesign_(); st.design = ''; }
      if(kw === 'customer' || kw === 'city' || kw === 'brand') st[kw] = '';
      st.field = kw;
      continue;
    }
    if(VOICE_SAVE_[tk]){ wantSave = true; st.field = null; continue; }
    if(tk.indexOf('@q:') === 0){
      const p = tk.split(':');
      st.qty = parseInt(p[1]) || st.qty; st.unit = p[2] === 'pcs' ? 'pcs' : 'set';
      continue;
    }
    switch(st.field){
      case 'customer': case 'city': case 'brand':
        st[st.field] += (st[st.field] ? ' ' : '') + tk; break;
      case 'design':
        if(!st.design){ const n = voiceNum_(tk); st.design = (n !== null ? n : tk).toUpperCase(); }
        break;
      case 'size': {
        const n = voiceNum_(tk);
        const v = n !== null ? n : tk;
        if(/^\d+m?([\/x\-]\d+)?$/i.test(v)) st.sizeTokens.push(v);
        break;
      }
      case 'colour':
        if(VOICE_AND_[tk]) break;
        st.colours.push(tk.replace(/\b[a-z]/, c=>c.toUpperCase())); break;
      case 'price': { const n = voiceNum_(tk); if(n !== null) st.price = n; break; }
      case 'qty':   { const n = voiceNum_(tk); if(n !== null) st.qty = parseInt(n) || 0; break; }
    }
  }
  voiceApplyToForm_();
  voiceRenderOverlay_();
  if(wantSave) voiceSaveNow_();
}

async function voiceSaveNow_(){
  if(voiceSaving_ || !voiceState_) return;
  voiceSaving_ = true;
  try{
    const st = voiceState_;
    if(st.design && !st.sizeTokens.length){
      voiceSay_(`⚠️ ${st.design}: ${t('voice_no_size')}`, true); voiceRenderOverlay_(); return;
    }
    voiceCommitDesign_();
    voiceApplyToForm_();
    const miss = [];
    if(!voiceCustomerFull_()) miss.push(t('customer_name'));
    if(!voiceBrandFull_()) miss.push(t('brand_name'));
    if(!draftCart.length) miss.push(t('designs_in_order'));
    if(miss.length){
      voiceSay_(`⚠️ ${t('voice_missing')}: ${miss.join(', ')}`, true); voiceRenderOverlay_(); return;
    }
    voiceStopRec_();
    voiceSay_(t('saving_word')); voiceRenderOverlay_();
    await saveOrder();
    if(!draftCart.length){
      try{ const u = new SpeechSynthesisUtterance(t('voice_saved_speak')); u.lang = voiceLang_ === 'hi-IN' ? 'hi-IN' : 'en-IN'; speechSynthesis.speak(u); }catch(e){}
      voiceClose_(true);
    } else {
      voiceSay_(`⚠️ ${t('voice_save_failed')}`, true); voiceRenderOverlay_();
    }
  } finally { voiceSaving_ = false; }
}

/* ---- microphone / speech recognition ---- */
function voiceStopRec_(){
  voiceWanted_ = false;
  if(voiceRec_){ try{ voiceRec_.onend = null; voiceRec_.stop(); }catch(e){} voiceRec_ = null; }
  voiceListening_ = false; voiceInterim_ = '';
}

function voiceStartRec_(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ voiceSay_(`⚠️ ${t('voice_unsupported')}`, true); voiceRenderOverlay_(); return; }
  voiceStopRec_();
  const rec = new SR();
  const session = ++voiceSession_;
  rec.lang = voiceLang_;
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.onresult = (ev)=>{
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if(r.isFinal){
        const key = session + ':' + i;
        if(voiceSeen_[key]) continue;          // Android sometimes repeats a finished phrase
        voiceSeen_[key] = 1;
        voiceFeed_(r[0].transcript);
      } else interim += r[0].transcript;
    }
    voiceInterim_ = interim;
    voiceRenderOverlay_();
  };
  rec.onerror = (e)=>{
    const code = e && e.error;
    if(code === 'not-allowed' || code === 'service-not-allowed'){ voiceWanted_ = false; voiceSay_(`⚠️ ${t('voice_mic_denied')}`, true); }
    else if(code === 'network'){ voiceWanted_ = false; voiceSay_(`⚠️ ${t('voice_need_net')}`, true); }
    else if(code === 'audio-capture'){ voiceWanted_ = false; voiceSay_(`⚠️ ${t('voice_no_mic')}`, true); }
    voiceRenderOverlay_();
  };
  rec.onend = ()=>{
    voiceListening_ = false;
    if(voiceWanted_ && voiceRec_ === rec){
      // The browser stops by itself after a pause — quietly start listening again.
      setTimeout(()=>{ if(voiceWanted_ && voiceRec_ === rec){ try{ rec.start(); voiceListening_ = true; }catch(e){} voiceRenderOverlay_(); } }, 250);
    }
    voiceRenderOverlay_();
  };
  voiceRec_ = rec;
  voiceWanted_ = true;
  try{ rec.start(); voiceListening_ = true; }catch(e){ console.error('Voice start failed', e); }
  voiceRenderOverlay_();
}

function voiceToggle_(){
  if(voiceWanted_){
    voiceStopRec_();
    if(voiceState_){ voiceCommitDesign_(); voiceApplyToForm_(); }
    voiceRenderOverlay_();
  } else voiceStartRec_();
}

function voiceSetLang_(code){
  voiceLang_ = code;
  try{ localStorage.setItem('ssa_voice_lang', code); }catch(e){}
  if(voiceWanted_) voiceStartRec_(); else voiceRenderOverlay_();
}

/* ---- the bottom sheet ---- */
function voiceOpen_(){
  if(document.getElementById('voiceOv')) return;
  voiceState_ = voiceNewState_();
  voiceLog_ = []; voiceInterim_ = ''; voiceSeen_ = {};
  const ov = document.createElement('div');

    <div class="voice-sheet">

      <div id="voStatus" class="voice-status"></div>

        <button id="voLangHi" onclick="voiceSetLang_('hi-IN')">हिंदी</button>
      </div>
      <div id="voLive" class="voice-live"></div>
      <div id="voSummary" class="voice-summary"></div>

function voiceClose_(skipRender){
  voiceStopRec_();
  if(voiceState_ && !skipRender){ voiceCommitDesign_(); voiceApplyToForm_(); }
  voiceState_ = null;
  const ov = document.getElementById('voiceOv');
  if(ov) ov.remove();
}

function voiceRenderOverlay_(){
  if(typeof document === 'undefined' || !document.getElementById('voiceOv')) return;
  const st = voiceState_ || voiceNewState_();
  const $ = id => document.getElementById(id);
  $('voStatus').innerHTML = voiceWanted_
    ? `<span class="voice-dot"></span>${t('voice_listening')}`
    : `⏸ ${t('voice_paused')}`;
  $('voLangEn').className = voiceLang_ === 'hi-IN' ? '' : 'on';
  $('voLangHi').className = voiceLang_ === 'hi-IN' ? 'on' : '';
  $('voLive').textContent = voiceInterim_ || '';
  $('voLive').style.display = voiceInterim_ ? 'block' : 'none';
  const mb = $('voMicBtn');
  mb.textContent = voiceWanted_ ? `⏸ ${t('voice_pause')}` : `🎤 ${t('voice_start')}`;
  mb.className = 'voice-mic' + (voiceWanted_ ? ' live' : '');

  const rows = [];
  const cust = voiceTitle_(st.customer), city = voiceTitle_(st.city), brand = voiceTitle_(st.brand);
  rows.push(`<div class="vo-row"><b>${t('customer_name')}:</b> ${cust ? escapeHtml(cust) : '—'}${city ? ' · ' + escapeHtml(city) : ''}</div>`);
  rows.push(`<div class="vo-row"><b>${t('brand_name')}:</b> ${brand ? escapeHtml(brand) : '—'}</div>`);
  draftCart.forEach(d=>{
    rows.push(`<div class="vo-item">${escapeHtml(d.designNumber)}${d.colour ? ' · ' + escapeHtml(d.colour) : ''} — ${d.sizes.map(s=>escapeHtml(s.size) + ' × ' + s.qty + (unitOf_(s)==='pcs' ? ' pcs' : '')).join(', ')}</div>`);
  });
  if(st.design){
    rows.push(`<div class="vo-item vo-pend">${escapeHtml(st.design)}${st.colours.length ? ' · ' + escapeHtml(st.colours.join(' ')) : ''} — ${escapeHtml(st.sizeTokens.join(' ')) || '…'}${st.qty ? ' × ' + st.qty : ''} …</div>`);
  }
  $('voSummary').innerHTML = rows.join('');
  $('voLog').innerHTML = voiceLog_.map(l=>`<div class="msg ${l.err ? 'err' : ''}" style="margin:6px 0 0;">${escapeHtml(l.msg)}</div>`).join('');
}

/* ---------------- ARTICLE (DISPATCH) SEARCH TAB ---------------- */

function inDispatchDateRange(iso){
  if(!dispatchFromDate && !dispatchToDate) return true;
  if(!iso) return false;
  const key = dispatchDateKey(iso);
  if(dispatchFromDate && key < dispatchFromDate) return false;
  if(dispatchToDate && key > dispatchToDate) return false;
  return true;
}


/* ---------------- BRAND OVERVIEW HELPERS ---------------- */
function normKey_(s){ return String(s==null ? '' : s).trim().replace(/\s+/g,' ').toLowerCase(); }
function natCmp_(a,b){ return String(a==null?'':a).localeCompare(String(b==null?'':b), undefined, {numeric:true, sensitivity:'base'}); }

// Active (not deleted) orders of the brand typed in the Article tab, inside the date range.
function getBrandMatches_(){
  const bql = dispatchBrandQuery.trim().toLowerCase();
  const cql = dispatchCustomerQuery.trim().toLowerCase();
  if(!bql && !cql) return [];
  return bookings.filter(b=>!b.trashed
    && (!bql || (b.brand||'').toLowerCase().includes(bql))
    && (!cql || (b.customerName||'').toLowerCase().includes(cql))
    && inDispatchDateRange(b.orderedAt));
}

// Groups orders as Article > Colour > Size. Colour and size are compared
// ignoring upper/lower case and extra spaces, so "Red", "RED " and "red" from
// different customers all land in ONE combined line instead of repeating.
function buildBrandGroups_(matches){
  const dmap = {};
  matches.forEach(b=>{
    const dk = normKey_(b.designNumber);
    const d = dmap[dk] || (dmap[dk] = { design: String(b.designNumber).trim(), colours: {} });
    const ck = normKey_(b.colour);
    const c = d.colours[ck] || (d.colours[ck] = { colour: String(b.colour||'').trim().toUpperCase(), sizes: {} });
    const sk = normKey_(b.size) + '|' + unitOf_(b);
    const s = c.sizes[sk] || (c.sizes[sk] = { size: String(b.size||'-').trim(), unit: unitOf_(b), pending: 0, dispatched: 0, lines: [] });
    s[b.status==='dispatched' ? 'dispatched' : 'pending'] += b.qty;
    s.lines.push(b);
  });
  return Object.values(dmap)
    .sort((a,b)=> natCmp_(a.design,b.design))
    .map(d=>({
      design: d.design,
      colours: Object.values(d.colours)
        .sort((a,b)=> natCmp_(a.colour,b.colour))
        .map(c=>({ colour: c.colour, sizes: Object.values(c.sizes).sort((a,b)=> natCmp_(a.size,b.size) || UNIT_KEYS.indexOf(a.unit)-UNIT_KEYS.indexOf(b.unit)) }))
    }));
}

// Keeps only sets still waiting to be dispatched; drops sizes/colours/articles
// that have nothing pending left.
function pendingOnlyGroups_(groups){
  return groups.map(g=>({
    design: g.design,
    colours: g.colours.map(c=>({ colour: c.colour, sizes: c.sizes.filter(s=>s.pending > 0) })).filter(c=>c.sizes.length)
  })).filter(g=>g.colours.length);
}


// "Only Customer-wise": every customer with ALL of their still-pending lines
// (design + colour + size + sets). Identical lines of one customer are merged.
function buildCustomerPendingGroups_(matches){
  const map = {};
  matches.forEach(b=>{
    if(b.status === 'dispatched' || b.trashed) return;
    const ck = normKey_(b.customerName);
    const c = map[ck] || (map[ck] = { customer: String(b.customerName||'').trim(), total: 0, items: [], lines: {} });
    const lk = normKey_(b.designNumber) + '|' + normKey_(b.colour) + '|' + normKey_(b.size) + '|' + unitOf_(b);
    const l = c.lines[lk] || (c.lines[lk] = { design: String(b.designNumber).trim(), colour: String(b.colour||'').trim().toUpperCase(), size: String(b.size||'-').trim(), unit: unitOf_(b), qty: 0 });
    l.qty += b.qty; c.total += b.qty; c.items.push({ qty: b.qty, unit: unitOf_(b) });
  });
  return Object.values(map)
    .sort((a,b)=> String(a.customer).localeCompare(String(b.customer)))
    .map(c=>({
      customer: c.customer, total: c.total, items: c.items,
      lines: Object.values(c.lines).sort((a,b)=> natCmp_(a.design,b.design) || natCmp_(a.colour,b.colour) || natCmp_(a.size,b.size))
    }));
}

function renderDispatch(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  // Include designs that only exist in deleted orders too, so searching an
  // article whose every order was deleted still shows who had ordered it.
  const allDesigns = [...new Set(bookings.map(b=>b.designNumber))];

  let resultsHtml = '';
  let exactDesign = null;
  const hasArticleQuery = !!dispatchQuery.trim();
  const hasBrandQuery = !!dispatchBrandQuery.trim();
  const hasCustQuery = !!dispatchCustomerQuery.trim();
  const custQl = dispatchCustomerQuery.trim().toLowerCase();

  if(selectedDesign){
    // A design was explicitly picked from the selection list (or matched itself
    // exactly) — always resolve to exactly this design, even if its digits
    // happen to also appear inside a longer design number like "118 NAVY PURPLE".
    exactDesign = selectedDesign;
  } else if(hasArticleQuery){
    const q = dispatchQuery.trim().toLowerCase();
    const matchingDesigns = allDesigns.filter(d=>d.toLowerCase().includes(q));
    if(!matchingDesigns.length){
      resultsHtml = `<div class="empty">${t('no_article_found')}</div>`;
    } else if(matchingDesigns.length > 1){
      resultsHtml = `<div class="card">
        <div class="section-label" style="margin-top:0;">${t('matching_articles')}</div>
        ${matchingDesigns.map(d=>`<button class="secondary" style="margin-top:8px;text-align:left;" onclick="pickDesign('${d.replace(/'/g,"\\'")}')">${escapeHtml(d)}</button>`).join('')}
      </div>`;
    } else {
      exactDesign = matchingDesigns[0];
    }
  }

  if(exactDesign){
    let matches = activeBookings.filter(b=>b.designNumber===exactDesign && inDispatchDateRange(b.orderedAt));
    if(hasBrandQuery){
      const bq = dispatchBrandQuery.trim().toLowerCase();
      matches = matches.filter(b=>(b.brand||'').toLowerCase().includes(bq));
    }
    if(hasCustQuery){
      matches = matches.filter(b=>(b.customerName||'').toLowerCase().includes(custQl));
    }
    const pendingQty = totalsShort_(matches.filter(b=>b.status==='pending'));
    const doneQty = totalsShort_(matches.filter(b=>b.status==='dispatched'));

    const customers = [...new Set(matches.map(b=>b.customerName))];
    const custCards = customers.length ? customers.map(cname=>{
      const rows = matches.filter(b=>b.customerName===cname);
      const allDone = rows.every(b=>b.status==='dispatched');

      // Small order-date label next to the customer's name — if they ordered
      // this article on more than one date, show each date once.
      const orderDates = [...new Set(rows.map(b=>dispatchDateKey(b.orderedAt)))]
        .sort((a,b)=>b.localeCompare(a))
        .map(dk=>dispatchDateLabel(dk));

      // group this customer's rows by colour + brand together, since the same
      // customer (or different customers) can order the same article under
      // different brands and/or colours — staff need to see exactly which
      // sizes belong to which brand+colour combo, not just a flat list
      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');

      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>{
          const done = b.status==='dispatched';
          return `<button class="size-btn ${done?'done':''}" ${done?'disabled':''} onclick="dispatchOne('${b.id}')">${escapeHtml(b.size)} · ${qtyShort_(b)}${done?' ✓':''}</button>`;
        }).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `<div class="cust-card${allDone ? ' all-done' : ''}">
        <div class="cust-head"><span class="name">${escapeHtml(cname)} <span style="font-size:11.5px;font-weight:500;color:#8a93a0;margin-left:6px;">${orderDates.map(escapeHtml).join(', ')}</span></span>${allDone ? `<span class="set-pill done">${t('fully_dispatched')}</span>` : ''}</div>
        ${groupsHtml}
      </div>`;
    }).join('') : '';

    // Parties whose order for this article was moved to Deleted — shown
    // greyed out (like a fully-dispatched card) with their actual size/qty
    // details still visible, just non-clickable. Shown even if the same
    // customer also has a separate active order for this article on a
    // different date — the deleted one still appears as its own blurred card.
    const trashedMatches = bookings.filter(b=>b.trashed && b.designNumber===exactDesign &&
      (!hasBrandQuery || (b.brand||'').toLowerCase().includes(dispatchBrandQuery.trim().toLowerCase())) &&
      (!hasCustQuery || (b.customerName||'').toLowerCase().includes(custQl)));
    const trashedCustomerNames = [...new Set(trashedMatches.map(b=>b.customerName))];
    const trashedCardsHtml = trashedCustomerNames.map(cname=>{
      const rows = trashedMatches.filter(b=>b.customerName===cname);
      const orderDates = [...new Set(rows.map(b=>dispatchDateKey(b.orderedAt)))]
        .sort((a,b)=>b.localeCompare(a))
        .map(dk=>dispatchDateLabel(dk));

      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');
      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>`<span class="size-btn done">${escapeHtml(b.size)} · ${qtyShort_(b)}</span>`).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `
      <div class="cust-card" style="opacity:0.45;filter:grayscale(65%);pointer-events:none;user-select:none;">
        <div class="cust-head"><span class="name">${escapeHtml(cname)} <span style="font-size:11.5px;font-weight:500;color:#8a93a0;margin-left:6px;">${orderDates.map(escapeHtml).join(', ')}</span></span><span class="set-pill" style="background:#e2e2e2;color:#777;">${t('nav_deleted')}</span></div>
        ${groupsHtml}
      </div>`;
    }).join('');

    const noActiveMsg = (!customers.length && !trashedCustomerNames.length) ? `<div class="empty">${t('no_article_found')}</div>` : '';
    const allColours = [...new Set(matches.map(b=>b.colour).filter(Boolean))];
    const allBrands = [...new Set(matches.map(b=>b.brand).filter(Boolean))];
    resultsHtml = `
      <div class="card">
        <div class="section-label" style="margin-top:0;">${t('article')}: ${escapeHtml(exactDesign)}
          ${selectedDesign ? `<button class="chip x" style="border:none;background:none;color:var(--navy);font-weight:700;float:right;" onclick="clearDesignSelection()">✕ ${t('change')}</button>` : ''}
        </div>
        ${allColours.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:4px;">${t('colours_ordered')}: ${allColours.map(escapeHtml).join(', ')}</div>` : ''}
        ${allBrands.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:8px;">${t('brands_ordered')}: ${allBrands.map(escapeHtml).join(', ')}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="set-pill pending">${t('closing_set')}: ${pendingQty} ${t('badge_pending')}</span>
          <span class="set-pill done">${t('dispatched')}: ${doneQty}</span>
        </div>
      </div>
      ${custCards}
      ${noActiveMsg}
      ${trashedCardsHtml}
    `;
  } else if(!hasArticleQuery && (hasBrandQuery || hasCustQuery)){
    // Brand overview. "Size-wise Total" shows ONLY what is still pending
    // (dispatched sets are already subtracted), with same colour / same size
    // from different customers merged into one combined total.
    // "Customer-wise Detail" shows who it belongs to and whether it is
    // dispatched or still pending.
    const brandMatches = getBrandMatches_();
    const allGroups = buildBrandGroups_(brandMatches);
    const isDetail = dispatchBrandView === 'detail';
    const groups = isDetail ? allGroups : pendingOnlyGroups_(allGroups);

    if(!brandMatches.length){
      resultsHtml = `<div class="empty">${t('no_brand_orders')}</div>`;
    } else if(dispatchBrandView === 'customer'){
      const custGroups = buildCustomerPendingGroups_(brandMatches);
      if(!custGroups.length){
        resultsHtml = `<div class="empty">${t('no_pending_brand')}</div>`;
      } else {
        const totAll = totalsUi_(custGroups.flatMap(c=>c.items));
        const custCards = custGroups.map(c=>`<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(c.customer)}</span><span><span class="set-pill pending">${totalsUi_(c.items)}</span></span></div>
          ${c.lines.map(l=>`<div class="item-line"><span>${escapeHtml(l.design)}${l.colour ? ' · ' + escapeHtml(l.colour) : ''} · ${escapeHtml(l.size)}</span><span>${l.qty} ${unitUi_(l.unit)}</span></div>`).join('')}
        </div>`).join('');
        resultsHtml = brandActionsCard_(`${custGroups.length} ${t('nav_customers')} · ${totAll} (${t('badge_pending')})`) + custCards;
      }
    } else if(!groups.length){
      resultsHtml = `<div class="empty">${t('no_pending_brand')}</div>`;
    } else {
      const totPendItems = [], totDoneItems = [];
      const articleCards = groups.map(g=>{
        const gPendItems = [], gDoneItems = [];
        g.colours.forEach(c=>c.sizes.forEach(s=>{
          if(s.pending) gPendItems.push({ qty: s.pending, unit: s.unit });
          if(s.dispatched) gDoneItems.push({ qty: s.dispatched, unit: s.unit });
        }));
        totPendItems.push(...gPendItems); totDoneItems.push(...gDoneItems);
        const showColourLabels = g.colours.length > 1 || (g.colours.length===1 && g.colours[0].colour !== '');

        const colourSections = g.colours.map(c=>{
          let lines = '';
          if(isDetail){
            const flat = [];
            c.sizes.forEach(s=> s.lines.forEach(b=> flat.push(b)));
            flat.sort((a,b)=> natCmp_(a.size,b.size) || (a.status===b.status?0:(a.status==='pending'?-1:1)) || String(a.customerName).localeCompare(String(b.customerName)));
            lines = flat.map(b=>{
              const done = b.status==='dispatched';
              return `<div class="item-line"><span>${escapeHtml(b.customerName)} · ${escapeHtml(b.size)}</span><span>${qtyUi_(b)} · <span class="${done?'st-done':'st-pend'}">${done ? t('dispatched')+' ✓' : t('badge_pending')}</span></span></div>`;
            }).join('');
          } else {
            lines = c.sizes.map(s=>`<div class="item-line"><span>${escapeHtml(s.size)}</span><span>${s.pending} ${unitUi_(s.unit)}</span></div>`).join('');
          }
          const label = showColourLabels ? `<div class="colour-label">${escapeHtml(c.colour || t('no_colour'))}</div>` : '';
          return `${label}${lines}`;
        }).join('');

        const pills = `<span class="set-pill pending">${totalsUi_(gPendItems)}</span>` + (isDetail && gDoneItems.length ? ` <span class="set-pill done">${t('dispatched')}: ${totalsShort_(gDoneItems)}</span>` : '');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${t('article')}: ${escapeHtml(g.design)}</span><span>${pills}</span></div>
          ${colourSections}
        </div>`;
      }).join('');

      const countLine = isDetail
        ? `${groups.length} ${t('articles_word')} · ${t('badge_pending')}: ${totalsShort_(totPendItems)} · ${t('dispatched')}: ${totalsShort_(totDoneItems)}`
        : `${groups.length} ${t('articles_word')} · ${totalsUi_(totPendItems)} (${t('badge_pending')})`;

      resultsHtml = brandActionsCard_(countLine) + articleCards;
    }
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_by_article')}</h2>
      <input id="dispatchSearch" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(dispatchQuery)}" oninput="onDispatchSearch(this.value)" autofocus>
      <label style="margin-top:10px;">${t('by_customer_name')} (${t('optional_word')})</label>
      <input id="dispatchCustomerSearch" list="customerList" placeholder="${t('cust_ph_optional')}" value="${escapeHtml(dispatchCustomerQuery)}" oninput="onDispatchCustomerSearch(this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')} (${t('optional_word')})</label>
      <input id="dispatchBrandSearch" list="brandList" placeholder="${t('brand_ph_optional')}" value="${escapeHtml(dispatchBrandQuery)}" oninput="onDispatchBrandSearch(this.value)">
      <label style="margin-top:10px;">${t('from_date')} (${t('optional_word')})</label>
      <input id="dispatchFromDate" type="date" value="${escapeHtml(dispatchFromDate)}" oninput="onDispatchDateRange('from', this.value)">
      <label style="margin-top:10px;">${t('to_date')} (${t('optional_word')})</label>
      <input id="dispatchToDate" type="date" value="${escapeHtml(dispatchToDate)}" oninput="onDispatchDateRange('to', this.value)">
    </div>
    <div id="dispatchResults">${resultsHtml}</div>
  `;
}

// Rebuilds only the results area below the search boxes, leaving the text
// box the person is typing in completely untouched — that is what stops the
// mobile keyboard from hiding/reappearing on every digit typed.
function refreshDispatchResultsOnly_(){
  const live = document.getElementById('dispatchResults');
  if(!live){ render(); return; }
  const tmp = document.createElement('div');
  renderDispatch(tmp);
  const fresh = tmp.querySelector('#dispatchResults');
  if(fresh) live.innerHTML = fresh.innerHTML; else render();
}

function setDispatchBrandView(view){
  dispatchBrandView = view;

function onDispatchDateRange(which, val){
  if(which==='from') dispatchFromDate = val; else dispatchToDate = val;
  render();
}

function printBrandOverview(){
  const bq = dispatchBrandQuery.trim() || dispatchCustomerQuery.trim();
  if(!bq) return;
  const matches = getBrandMatches_();
  if(!matches.length){ alert(t('no_brand_orders')); return; }

  const brandNames = [...new Set(matches.map(b=>String(b.brand||'').trim()).filter(Boolean))];
  const brandLabel0 = brandNames.length === 1 ? brandNames[0] : (dispatchBrandQuery.trim() || 'All Brands');
  // When a customer name is typed too, the PDF title carries it as well, so the
  // printed / WhatsApp report clearly shows whose order it is.
  const custNamesPrint = [...new Set(matches.map(b=>String(b.customerName||'').trim()))];
  const brandLabel = dispatchCustomerQuery.trim()
    ? ((custNamesPrint.length === 1 ? custNamesPrint[0] : dispatchCustomerQuery.trim()) + ' - ' + brandLabel0)
    : brandLabel0;
  const todayTxt = new Date().toLocaleDateString('en-IN');

  // ONLY CUSTOMER-WISE view -> each customer with all their pending lines.
  if(dispatchBrandView === 'customer'){
    const custGroups = buildCustomerPendingGroups_(matches);
    if(!custGroups.length){ alert(t('no_pending_brand')); return; }
    const hdrC = unitHdr_(custGroups.flatMap(c=>c.lines));
    const bl = brandLabel;
    const rowsC = [], labelsC = [], headsC = []; let totC = 0;
    const headStyleC = { fillColor:[222,234,250], textColor:[22,86,166], fontStyle:'bold', fontSize:12 };
    custGroups.forEach(c=>{
      totC += c.total;
      rowsC.push([{ content: `${c.customer}      (${totalsPdf_(c.items)})`, colSpan: 4, styles: headStyleC }]);
      labelsC.push(c.customer); headsC.push(true);
      c.lines.forEach(l=>{
        rowsC.push([ l.design, l.colour || '-', l.size, { content: qtyCell_(l, hdrC), styles:{ fontStyle:'bold', halign:'center' } } ]);
        labelsC.push(c.customer); headsC.push(false);
      });
    });
    let dateNoteC = '';
    if(dispatchFromDate || dispatchToDate){
      dateNoteC = ` | ${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '...'} - ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '...'}`;
    }
    const blobC = buildPdfBlob(`Order to - ${bl}`, `Date : ${todayTxt}${dateNoteC}`,
      ['Article','Colour','Size',`Pending ${hdrC}`], rowsC, `Total Pending: ${totalsPdf_(custGroups.flatMap(c=>c.items))}`,
      { styles:{ fontSize:11, cellPadding:3.2 }, columnStyles:{ 3:{ halign:'center', cellWidth:35 } },
        heading: 'Customer-Wise Details',
        continuation: { labels: labelsC, isHeading: headsC,
          makeRow: (label)=>[{ content: `${label}      (continued)`, colSpan: 4, styles: headStyleC }] } });
    if(!blobC){ alert(t('pdf_gen_fail')); return; }
    showPdfActions_(blobC, `Customer-wise-Pending-${bl.replace(/[^a-z0-9]/gi,'_')}.pdf`, `Order to - ${bl}`, `*Order to - ${bl}*`);
    return;
  }

  // CUSTOMER-WISE DETAIL view -> the original customer-wise PDF (each customer's
  // lines, with Pending / Dispatched status), same as before.
  if(dispatchBrandView === 'detail'){
    const sorted = matches.slice().sort((a,b)=> a.designNumber.localeCompare(b.designNumber) || (a.colour||'').localeCompare(b.colour||'') || a.customerName.localeCompare(b.customerName));
    const hasPriceD = sorted.some(b=>b.pricePerPcs);
    const hdrD = unitHdr_(sorted);
    const colsD = ['Article','Colour','Customer','Order Date','Size'];
    if(hasPriceD) colsD.push('Price (Rs)');
    colsD.push(`Pending ${hdrD}`,`Dispatched ${hdrD}`);
    const rowsD = sorted.map(b=>{
      const done = b.status==='dispatched';
      const r = [b.designNumber, b.colour||'-', b.customerName, dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.size];
      if(hasPriceD) r.push(b.pricePerPcs ? String(b.pricePerPcs) : '-');
      r.push(done ? '' : qtyCell_(b, hdrD), done ? qtyCell_(b, hdrD) : '');
      return r;
    });
    const ppD = { columns: colsD, tableRows: rowsD };
    const setColStart = colsD.length - 2;
    const colStylesD = {}; colStylesD[setColStart] = { halign:'center' }; colStylesD[setColStart+1] = { halign:'center' };
    let dateNoteD = '';
    if(dispatchFromDate || dispatchToDate){
      dateNoteD = ` | ${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '…'} - ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '…'}`;
    }
    const titleD = `Order to - ${brandLabel}`;
    const blobD = buildPdfBlob(titleD, `Date : ${todayTxt}${dateNoteD}`, ppD.columns, ppD.tableRows, `Pending: ${totalsPdf_(sorted.filter(b=>b.status!=='dispatched'))}   |   Dispatched: ${totalsPdf_(sorted.filter(b=>b.status==='dispatched'))}   |   ${t('total')}: ${totalsPdf_(sorted)}`, { columnStyles: colStylesD, heading: 'Article-Wise Details' });
    if(!blobD){ alert(t('pdf_gen_fail')); return; }
    showPdfActions_(blobD, `Brand-Customerwise-${bq.replace(/[^a-z0-9]/gi,'_')}.pdf`, titleD, `*${titleD}*`);
    return;
  }

  // SIZE-WISE TOTAL view -> set-wise PENDING list (what still has to be ordered/arranged).
  const groups = pendingOnlyGroups_(buildBrandGroups_(matches));
  if(!groups.length){ alert(t('no_pending_brand')); return; }

  // Table: Article | Colour | Size | Pending Set ("N Set").
  // The article number is written once on its first row; the rows below it show "=" (same
  // article) until that article's rows end. A row that starts a new page shows the number again.
  const rows = [], rowArticle = [], rowFirst = [];
  const totalItems = [];
  groups.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>totalItems.push({ qty: s.pending, unit: s.unit }))));
  const hdrS = unitHdr_(totalItems);
  let total = 0, artIdx = 0;
  groups.forEach(g=>{
    const light = (artIdx++ % 2 === 1);                  // alternate articles get a light tint
    let first = true;
    g.colours.forEach(c=>c.sizes.forEach(s=>{
      total += s.pending;
      const fill = light ? { fillColor:[238,243,251] } : {};
      rows.push([
        { content: first ? g.design : '=', styles: Object.assign({ fontStyle: first ? 'bold' : 'normal', halign: first ? 'left' : 'center' }, fill) },
        { content: c.colour || '-', styles: fill },
        { content: s.size, styles: fill },
        { content: `${s.pending} ${unitEn_(s.unit)}`, styles: Object.assign({ fontStyle:'bold', halign:'center' }, fill) }
      ]);
      rowArticle.push(g.design); rowFirst.push(first);
      first = false;
    }));
  });

  let dateNote = '';
  if(dispatchFromDate || dispatchToDate){
    dateNote = ` | ${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '...'} - ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '...'}`;
  }
  // Brand name exactly as saved on the orders (e.g. "Spring kids"), if all matches share one spelling
  const blob = buildPdfBlob(
    `Order to - ${brandLabel}`,
    `Date : ${todayTxt}${dateNote}`,
    ['Article','Colour','Size', hdrS==='Qty' ? 'Pending Qty' : `Pending ${hdrS}`],
    rows,
    `Total Pending: ${totalsPdf_(totalItems)}`,
    { styles:{ fontSize:11, cellPadding:3.2 }, columnStyles:{ 0:{ cellWidth:42 }, 3:{ halign:'center', cellWidth:35 } }, heading: 'Size Set-wise Details',
      repeatLabel: { articles: rowArticle, isFirst: rowFirst, col: 0 } }
  );
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  showPdfActions_(blob, `Order-to-${brandLabel.replace(/[^a-z0-9]/gi,'_')}.pdf`, `Order to - ${brandLabel}`, `*Order to - ${brandLabel}*`);
}

function downloadBrandExcel(){
  const bq = dispatchBrandQuery.trim() || dispatchCustomerQuery.trim();
  if(!bq) return;
  if(!window.XLSX){ alert(t('pdf_gen_fail')); return; }
  const matches = getBrandMatches_();
  if(!matches.length){ alert(t('no_brand_orders')); return; }
  // ONLY CUSTOMER-WISE view -> every customer with all their pending lines.
  if(dispatchBrandView === 'customer'){
    const custGroups = buildCustomerPendingGroups_(matches);
    if(!custGroups.length){ alert(t('no_pending_brand')); return; }
    const hdrXC = unitHdr_(custGroups.flatMap(c=>c.lines));
    const cData = [['Customer','Article','Colour','Size', xlHdr_('Pending', hdrXC)]];
    custGroups.forEach(c=>c.lines.forEach(l=>{ cData.push([c.customer, l.design, l.colour || '-', l.size, xlQty_(l, hdrXC)]); }));
    cData.push([]);
    cData.push(['TOTAL','','','', xlTotal_(custGroups.flatMap(c=>c.items))]);
    const wsC = XLSX.utils.aoa_to_sheet(cData);
    wsC['!cols'] = [{wch:28},{wch:14},{wch:16},{wch:12},{wch:14}];
    const wbC = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbC, wsC, 'Customer-wise Pending');
    XLSX.writeFile(wbC, `Customer-wise-Pending-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
    return;
  }

  // CUSTOMER-WISE DETAIL view -> same lines as the customer-wise PDF, with
  // Pending Sets and Dispatched Sets in two separate columns.
  if(dispatchBrandView === 'detail'){
    const sorted = matches.slice().sort((a,b)=> natCmp_(a.designNumber,b.designNumber) || natCmp_(a.colour||'',b.colour||'') || String(a.customerName).localeCompare(String(b.customerName)) || natCmp_(a.size,b.size));
    const hasPrice = sorted.some(b=>b.pricePerPcs);
    const head = ['Article','Colour','Customer','Order Date','Size'];
    if(hasPrice) head.push('Price (Rs)');
    const hdrXD = unitHdr_(sorted);
    head.push(xlHdr_('Pending', hdrXD), xlHdr_('Dispatched', hdrXD));
    const dData = [head];
    sorted.forEach(b=>{
      const done = b.status==='dispatched';
      const row = [b.designNumber, b.colour||'-', b.customerName, dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.size];
      if(hasPrice) row.push(b.pricePerPcs ? Number(b.pricePerPcs) || String(b.pricePerPcs) : '-');
      row.push(done ? '' : xlQty_(b, hdrXD), done ? xlQty_(b, hdrXD) : '');
      dData.push(row);
    });
    dData.push([]);
    const tot = ['TOTAL','','','',''];
    if(hasPrice) tot.push('');
    tot.push(xlTotal_(sorted.filter(b=>b.status!=='dispatched')), xlTotal_(sorted.filter(b=>b.status==='dispatched')));
    dData.push(tot);
    const wsD = XLSX.utils.aoa_to_sheet(dData);
    const cols = [{wch:14},{wch:16},{wch:26},{wch:14},{wch:12}];
    if(hasPrice) cols.push({wch:11});
    cols.push({wch:14},{wch:16});
    wsD['!cols'] = cols;
    const wbD = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbD, wsD, 'Customer-wise');
    XLSX.writeFile(wbD, `Brand-Customerwise-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
    return;
  }

  const all = buildBrandGroups_(matches);
  const pend = pendingOnlyGroups_(all);
  if(!pend.length){ alert(t('no_pending_brand')); return; }

  // Sheet 1: only what is still PENDING (what has to be ordered), one clean
  // line per Article + Colour + Size, customers already combined.
  const pItemsX = [];
  pend.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>pItemsX.push({ qty: s.pending, unit: s.unit }))));
  const hdrXP = unitHdr_(pItemsX);
  const pData = [['Article','Colour','Size', xlHdr_('Pending', hdrXP)]];
  pend.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>{
    pData.push([g.design, c.colour || '-', s.size, xlQty_({ qty: s.pending, unit: s.unit }, hdrXP)]);
  })));
  pData.push([]);
  pData.push(['TOTAL', '', '', xlTotal_(pItemsX)]);
  const ws = XLSX.utils.aoa_to_sheet(pData);
  ws['!cols'] = [{wch:14},{wch:16},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pending');

  // Sheet 2 (only if something was dispatched): kept separate, so pending and
  // dispatched never get mixed in the same columns.
  const dItemsX = [];
  all.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>{ if(s.dispatched > 0) dItemsX.push({ qty: s.dispatched, unit: s.unit }); })));
  const hdrXDs = unitHdr_(dItemsX);
  const dData = [['Article','Colour','Size', xlHdr_('Dispatched', hdrXDs)]];
  all.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>{
    if(s.dispatched > 0){ dData.push([g.design, c.colour || '-', s.size, xlQty_({ qty: s.dispatched, unit: s.unit }, hdrXDs)]); }
  })));
  if(dData.length > 1){
    dData.push([]);
    dData.push(['TOTAL', '', '', xlTotal_(dItemsX)]);
    const ws2 = XLSX.utils.aoa_to_sheet(dData);
    ws2['!cols'] = [{wch:14},{wch:16},{wch:12},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Dispatched');
  }
  XLSX.writeFile(wb, `Order-to-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
}
