<style>
  :root{
    --navy:#1656A6;
    --linen:#F3F6FA;
    --mustard:#2F86D6;
    --ink:#1B2430;
    --rust:#B4552F;
    --sage:#2E7D4F;
    --line:#D5DFEC;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--linen);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  body{ padding-bottom:76px; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .topbar h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    margin:0;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .closing-badge{
    background:#FFD166;
    color:#3A2A0F;
    font-weight:700;
    font-size:12.5px;
    padding:6px 11px;
    border-radius:20px;
    white-space:nowrap;
  }
  .staff-badge{
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .staff-badge button{
    background:none; border:none; color:#FFD166;
    font-size:11.5px; font-weight:700; padding:0; text-decoration:underline;
  }
  main{ padding:14px; max-width:640px; margin:0 auto; }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    margin:0 0 12px 0;
  }
  label{
    display:block;
    font-size:13px;
    color:#5b6472;
    margin-bottom:5px;
    font-weight:600;
  }
  input, select{
    width:100%;
    padding:12px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:'IBM Plex Sans',sans-serif;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
    border-color:var(--navy);
  }
  .row{ display:flex; gap:8px; margin-bottom:10px; align-items:flex-end; }
  .row > *{ flex:1; }
  .row .btn-inline{ flex:none; width:52px; }
  button{ font-family:'IBM Plex Sans',sans-serif; cursor:pointer; }
  button.primary{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    margin-top:6px;
  }
  button.primary:active{ background:#0F3E7A; }
  button.primary:disabled{ background:#B7BCC6; }
  button.secondary{
    width:100%;
    background:#EAF1FB;
    color:var(--navy);
    border:1px solid var(--line);
    padding:12px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
  }
  button.small{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:20px;
    font-weight:700;
    line-height:1;
    padding:12px 0;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#EAF1FB;
    border:1px solid var(--line);
    padding:7px 10px;
    border-radius:20px;
    font-size:13.5px;
    margin:0 6px 6px 0;
  }
  .chip button.x{
    background:none; border:none; color:var(--rust);
    font-size:16px; padding:0; line-height:1; font-weight:700;
  }
  .design-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .design-block .dhead{
    display:flex; justify-content:space-between; align-items:center;
    font-weight:700; margin-bottom:6px;
  }
  .empty{
    text-align:center; padding:34px 12px; color:#7e8896; font-size:14.5px;
  }
  .msg{ padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:12px; }
  .msg.err{ background:#F7E4DA; color:var(--rust); border:1px solid #E5B79E; }
  .msg.ok{ background:#E3EFE8; color:#245C3B; border:1px solid #BFDCC9; }
  .msg.info{ background:#EAF1FB; color:var(--navy); border:1px solid var(--line); }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--navy);
    display:flex;
    overflow-x:auto;
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.2);
  }
  .navbtn{
    flex:1 0 auto;
    min-width:52px;
    background:none; border:none; color:#C7D8F0;
    font-size:10.3px; font-weight:600;
    padding:8px 2px;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .navbtn.active{ color:#fff; background:rgba(255,255,255,.14); }
  .navbtn .ic{ font-size:16px; }

  .set-pill{
    display:inline-block; font-size:12.5px; font-weight:700;
    padding:4px 10px; border-radius:14px;
  }
  .set-pill.pending{ background:#F7E4DA; color:var(--rust); }
  .set-pill.done{ background:#E3EFE8; color:var(--sage); }

  .cust-card{
    border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;
  }
  .cust-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .cust-head .name{ font-weight:700; font-size:16px; }
  .size-btn{
    padding:9px 12px;
    border-radius:8px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-size:14px;
    font-weight:700;
    margin:0 8px 8px 0;
  }
  .size-btn:active{ background:var(--navy); color:#fff; }
  .size-btn.done{
    border:1.5px solid var(--line);
    color:#a3aec0;
    background:#EEF2F8;
    opacity:.55;
  }
  .summary-row{
    display:flex; gap:14px; font-size:13px; color:#5b6472; margin-top:2px;
  }
  .filter-input{ margin-bottom:12px; }
  .cust-detail{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:13.5px;
  }
  .cust-detail .li{
    display:flex; justify-content:space-between; padding:5px 0;
  }
  .undo-link{
    background:none; border:none; color:var(--rust); font-size:12px;
    text-decoration:underline; padding:0;
  }
  .section-label{
    font-size:12px; font-weight:700; color:#5b6472; margin:10px 0 4px;
  }
  .item-line{
    display:flex; justify-content:space-between;
    padding:6px 0; font-size:14px; border-bottom:1px solid var(--line);
  }
  .item-line:last-child{ border-bottom:none; }
  .order-total-line{
    display:flex; justify-content:space-between; font-weight:700;
    padding-top:10px; margin-top:6px; border-top:2px solid var(--ink);
    font-size:15px;
  }
  .action-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .action-btn{
    flex:1; min-width:80px;
    border:none; border-radius:8px; padding:10px 8px;
    font-size:12.5px; font-weight:700; text-align:center;
  }
  .action-btn.wa{ background:#3F7B4F; color:#fff; }
  .action-btn.pr{ background:var(--navy); color:#fff; }
  .action-btn.del{ background:#fff; color:var(--rust); border:1.5px solid var(--rust); }
  .trash-card{
    border:1px dashed var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; background:#EEF2F8;
  }
  .trash-head{ display:flex; justify-content:space-between; align-items:center; }
  .restore-btn{
    background:var(--sage); color:#fff; border:none; border-radius:8px;
    padding:8px 12px; font-size:13px; font-weight:700;
  }
  .subtle{ color:#7e8896; font-size:12.5px; }

  .log-card{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .log-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .log-staff{ font-weight:700; font-size:14px; }
  .log-time{ font-size:11.5px; color:#7e8896; }
  .log-action{ font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:2px; }
  .log-detail{ font-size:13.5px; color:#3a4453; }

  .login-wrap{
    min-height:calc(100vh - 70px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:28px 22px; max-width:380px; width:100%;
  }
  .login-card h2{
    font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:0 0 6px 0;
    color:var(--navy);
  }
  .login-card p{ font-size:13.5px; color:#5b6472; margin:0 0 18px 0; }
  .login-divider{ text-align:center; color:#9aa4b2; font-size:12px; margin:14px 0; }
  #googleSignInBtn{ display:flex; justify-content:center; margin:10px 0; }

  .cust-card.all-done{ opacity:.55; background:#EEF2F8; }
  .cust-card.all-done .name{ color:#a3aec0; }

  .colour-label{
    font-size:12.5px; font-weight:700; color:var(--navy); text-transform:uppercase;
    letter-spacing:.3px; margin:10px 0 5px 0;
  }
  .colour-label:first-child{ margin-top:2px; }
  .size-suggest-dropdown{
    position:absolute; top:100%; left:0; right:0; z-index:30;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    margin-top:4px; max-height:230px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
  }
  .size-suggest-item{
    padding:11px 14px; font-size:14.5px; font-weight:600; color:var(--ink);
    border-bottom:1px solid var(--linen);
  }
  .size-suggest-item:last-child{ border-bottom:none; }
  .size-suggest-item:active{ background:var(--navy); color:#fff; }

  .date-section-label{
    font-family:'Fraunces',serif; font-weight:700; font-size:15px;
    color:var(--navy); margin:18px 0 8px 2px; padding-bottom:4px;
    border-bottom:2px solid var(--line);
  }
  .date-section-label:first-child{ margin-top:0; }

  .lang-toggle{
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:700;
  }
  .lang-toggle:active{ background:rgba(255,255,255,.3); }

  .trash-actions{ display:flex; gap:8px; }
  .perm-del-btn{
    background:#fff; color:var(--rust); border:1.5px solid var(--rust);
    border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700;
  }
</style>
</head>

  <h1>Subhash Sales Agencies</h1>
  <div class="topbar-right">

    <span id="topbarRight"></span>
  </div>
</div>

<main id="main"></main>

<div class="bottom-nav" id="bottomNav">

<datalist id="customerList"></datalist>
<datalist id="designList"></datalist>
<datalist id="brandList"></datalist>

let activityLog = [];   // {id, staffName, staffMobile, action, detail, timestamp}
let loaded = false;
let currentTab = 'book';
let currentStaff = null; // {name, mobile} - session only, not persisted across reloads

// in-memory draft for current booking session
let draftCustomer = '';
let draftBrand = '';
let draftCart = [];          // [{designNumber, colour, sizes:[{size, qty}]}]
let tempDesignNumber = '';
let tempColour = '';

// Preset sizes shown in a tap-to-filter dropdown in Add Design. Staff can also
// type any other size manually — this list is just for quick selection.
const SIZE_PRESETS = ['20/24','26/30','32/36','18/22','24/28','30/34','9/24','2/5','6/8','9/14','15/16','22/26','28/32','34/38'];

let dispatchQuery = '';
let dispatchBrandQuery = '';
let dispatchFromDate = ''; // yyyy-mm-dd
let dispatchToDate = '';   // yyyy-mm-dd
let selectedDesign = null;   // exact design chosen from the "select one" list, so it's never re-matched against other designs that merely share the same digits
let customerFilter = '';
let customerBrandFilter = '';
let customerDateFilter = ''; // yyyy-mm-dd
let expandedCustomer = null;

// dispatched-orders tab search state
let doSearchDesign = '';
let doSearchBrand = '';

// pending-orders tab search state
let pdSearchCustomer = '';
let pdSearchBrand = '';
let pdSearchDate = ''; // yyyy-mm-dd

// activity tab filter state
let activityDateFilter = ''; // yyyy-mm-dd

const SHEET_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwR28myzk020v3-yd25OrjHCKb4ujzoxXyURe7GAcrt5cpSUZ7-_BAQ39t_NiZcJMc3yw/exec';
const cloudAvailable = !!(SHEET_SCRIPT_URL && SHEET_SCRIPT_URL.startsWith('http'));

// Replace this with your own Google OAuth Client ID (see setup notes sent in chat).
// Until you do, the login screen falls back to a simple name-only entry.
const GOOGLE_CLIENT_ID = '436781702541-vojpb19fnlts7m96tirjj028b9gm2brd.apps.googleusercontent.com';
const googleReady = !!(GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID'));

// Only this Google account gets automatic access + the Approvals tab. Everyone
// else who signs in with Google must be approved from that tab first.
const OWNER_EMAIL = 'subhashsalesagencies@gmail.com';
let staffApprovals = []; // [{name, email, status:'pending'|'approved'|'rejected', requestedAt, approvedAt, canDelete}]
let loginWaitingEmail = null; // set while showing the "waiting for approval" screen

// The owner always has full access. A staff member who logged in via the
// name-only fallback (no Google account, no email) predates the approval
// system and is treated as unrestricted too. Everyone else needs the owner
// to have explicitly switched on delete rights for their account.
function canCurrentUserDelete(){
  if(!currentStaff) return false;
  if(!currentStaff.mobile) return true;
  if(currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()) return true;
  const entry = staffApprovals.find(s=>s.email === currentStaff.mobile);
  return !!(entry && entry.canDelete);
}

function uid(){ return 'b' + Math.random().toString(36).slice(2,10); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

try{ currentLang = localStorage.getItem('ssa_lang') || 'en'; }catch(e){}

  });
}

/* ---------------- PDF GENERATION & SHARING ----------------
   Print buttons and WhatsApp buttons throughout the app both hand off to
   these helpers, so every "Print" opens a real PDF and every "WhatsApp"
   share sends that same PDF as a file (via the phone's native share sheet)
   instead of a plain text message. */

function buildPdfBlob(title, subtitle, columns, rows, footerText){
  if(!window.jspdf || !window.jspdf.jsPDF) return null;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14);
    doc.text(title, 14, 16);
    doc.setFontSize(10);
    doc.setTextColor(90,100,115);
    doc.text(subtitle, 14, 23);
    doc.setTextColor(20,20,20);
    doc.autoTable({
      startY: 28,
      head: [columns],
      body: rows,
      styles: { fontSize: 9, cellPadding: 3 },
      headStyles: { fillColor: [22,86,166], textColor: [255,255,255] },
      theme: 'grid'
    });
    if(footerText){
      const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || 28;
      doc.setFontSize(11);
      doc.setTextColor(20,20,20);
      doc.text(footerText, 14, finalY + 10);
    }
    return doc.output('blob');
  }catch(e){ console.error('PDF build failed', e); return null; }
}

function openPdfBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(!w){
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

async function sharePdfBlob(blob, filename, shareTitle, shareText){
  try{
    const file = new File([blob], filename, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      // Important: don't pass "text" alongside "files" here. On Android,
      // sharing a file + text together to WhatsApp's direct-share contact
      // shortcut makes WhatsApp misread it as an empty text message and
      // refuse to send ("Can't send empty message"), even though a file is
      // attached. Sharing the file alone (with just a title) avoids that.
      await navigator.share({ files: [file], title: shareTitle });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // user cancelled the share sheet
    console.error('Native share failed, falling back to download', e);
  }
  // Fallback for browsers without file-sharing support (mostly desktop):
  // download the PDF, then open WhatsApp so it can be attached manually.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n\n(PDF has been downloaded to your device — please attach it here)')}`, '_blank');
}

// Primary storage: Google Sheets (via Apps Script Web App) — syncs across all staff devices.
// Backup storage: this browser's localStorage — used if the Sheets call fails
// (e.g. no internet at that moment), so nothing gets lost.
async function storageGet(key){
  if(cloudAvailable){
    try{
      const res = await fetch(`${SHEET_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if(data && data.value !== null && data.value !== undefined) return data.value;
      return null;
    }catch(e){ console.error('Sheet fetch failed, using local backup', e); }
  }
  try{ return localStorage.getItem('ssa_'+key); }
  catch(e){ return null; }
}
async function storageSet(key, value){
  if(cloudAvailable){
    try{
      await fetch(SHEET_SCRIPT_URL, {
        method:'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ key, value })
      });
    }catch(e){ console.error('Sheet save failed, saved locally only', e); }
  }
  try{ localStorage.setItem('ssa_'+key, value); }
  catch(e){ console.error('local storage failed', e); }
}

async function loadData(){
  try{
    const v = await storageGet('bookings');
    bookings = v ? JSON.parse(v) : [];
  }catch(e){ bookings = []; }
  try{
    const v2 = await storageGet('activityLog');
    activityLog = v2 ? JSON.parse(v2) : [];
  }catch(e){ activityLog = []; }
  try{
    const v3 = await storageGet('staffApprovals');
    staffApprovals = v3 ? JSON.parse(v3) : [];
  }catch(e){ staffApprovals = []; }
  try{
    const saved = localStorage.getItem('ssa_currentStaff');
    if(saved) currentStaff = JSON.parse(saved);
  }catch(e){}
  await purgeOldRecords();
  loaded = true;
  render();
}

// Any order (pending or dispatched) placed more than 12 months ago is removed
// automatically — from Pending, Dispatched and Customers alike, since all
// three are just different views of the same `bookings` array. Old Activity
// Log entries beyond 12 months are cleared the same way. Runs once whenever
// the app loads, on whichever device opens it first.
async function purgeOldRecords(){
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 12);

  const removedCustomers = new Set();
  const beforeBookings = bookings.length;
  bookings = bookings.filter(b=>{
    const keep = new Date(b.orderedAt) >= cutoff;
    if(!keep) removedCustomers.add(b.customerName);
    return keep;
  });
  const removedBookingsCount = beforeBookings - bookings.length;

  const beforeActivity = activityLog.length;
  activityLog = activityLog.filter(a=> new Date(a.timestamp) >= cutoff);
  const removedActivityCount = beforeActivity - activityLog.length;

  if(removedBookingsCount > 0 || removedActivityCount > 0){
    activityLog.unshift({
      id: uid(),
      staffName: 'System',
      staffMobile: '',
      action: 'Auto Cleanup (12+ months old)',
      detail: `Removed ${removedBookingsCount} order line(s)${removedCustomers.size ? ' for ' + [...removedCustomers].join(', ') : ''}, and ${removedActivityCount} old activity log entr${removedActivityCount===1?'y':'ies'}.`,
      timestamp: new Date().toISOString()
    });
    await saveData();
    await saveActivity();
  }
}
async function saveData(){
  try{ await storageSet('bookings', JSON.stringify(bookings)); }
  catch(e){ console.error('save failed', e); }
}
async function saveActivity(){
  try{ await storageSet('activityLog', JSON.stringify(activityLog)); }
  catch(e){ console.error('activity save failed', e); }
}
async function saveApprovals(){
  try{ await storageSet('staffApprovals', JSON.stringify(staffApprovals)); }
  catch(e){ console.error('approvals save failed', e); }
}
async function notifyOwnerOfRequest(name, email){
  if(!cloudAvailable) return;
  try{
    await fetch(SHEET_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'notifyStaffRequest', name, email })
    });

async function logActivity(action, detail){
  if(!currentStaff) return;
  activityLog.unshift({
    id: uid(),
    staffName: currentStaff.name,
    staffMobile: currentStaff.mobile,
    action,
    detail,
    timestamp: new Date().toISOString()
  });

}

function renderTopbarRight(){
  const el = document.getElementById('topbarRight');
  if(!currentStaff){ el.innerHTML = ''; return; }
  const pending = bookings.filter(b=>b.status==='pending' && !b.trashed).reduce((s,b)=>s+b.qty,0);
  el.innerHTML = `
    <span class="closing-badge">${t('pending_sets')}: ${pending} ${t('sets')}</span>
    <span class="staff-badge">👤 ${escapeHtml(currentStaff.name)} <button onclick="logoutStaff()">${t('switch_btn')}</button></span>
  `;

function updateDatalists(){
  const custs = [...new Set(bookings.map(b=>b.customerName))];
  document.getElementById('customerList').innerHTML = custs.map(c=>`<option value="${escapeHtml(c)}">`).join('');
  const designs = [...new Set(bookings.map(b=>b.designNumber))];
  document.getElementById('designList').innerHTML = designs.map(d=>`<option value="${escapeHtml(d)}">`).join('');
  const brands = [...new Set(bookings.map(b=>b.brand).filter(Boolean))];
  document.getElementById('brandList').innerHTML = brands.map(b=>`<option value="${escapeHtml(b)}">`).join('');
}

function render(){
  const main = document.getElementById('main');
  const bottomNav = document.getElementById('bottomNav');
  if(!loaded){ main.innerHTML = '<div class="empty">'+t('loading_word')+'</div>'; return; }

  if(!currentStaff){
    bottomNav.style.display = 'none';
    document.getElementById('topbarRight').innerHTML = '';
    renderLogin(main);
    return;
  }
  bottomNav.style.display = 'flex';

  const isOwner = currentStaff.mobile && currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase();
  const approvalsBtn = document.getElementById('approvalsNavBtn');
  if(approvalsBtn) approvalsBtn.style.display = isOwner ? 'flex' : 'none';
  if(currentTab === 'approvals' && !isOwner) currentTab = 'book';

  renderTopbarRight();
  updateDatalists();
  if(currentTab==='book') renderBook(main);
  else if(currentTab==='dispatch') renderDispatch(main);
  else if(currentTab==='dispatchedOrders') renderDispatchedOrders(main);
  else if(currentTab==='pendingOrders') renderPendingOrders(main);
  else if(currentTab==='deletedOrders') renderDeletedOrders(main);
  else if(currentTab==='activity') renderActivity(main);
  else if(currentTab==='approvals') renderApprovals(main);
  else renderCustomers(main);
}

function initGoogleButton(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  try{
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
    const el = document.getElementById('googleSignInBtn');
    if(el) google.accounts.id.renderButton(el, { theme:'outline', size:'large', width:270 });
  }catch(e){ console.error('Google sign-in init failed', e); }
}

function parseJwt(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

async function handleGoogleCredential(response){
  const payload = parseJwt(response.credential);
  if(!payload || !payload.email) return;
  const email = payload.email;
  const nameEl = document.getElementById('loginName');
  const typedName = nameEl ? nameEl.value.trim() : '';
  const name = typedName || payload.name || email;

  // The owner's own Google account always gets straight in, and unlocks the
  // Approvals tab for approving/rejecting everyone else.
  if(email.toLowerCase() === OWNER_EMAIL.toLowerCase()){
    currentStaff = { name, mobile: email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
    render();
    return;
  }

  const existing = staffApprovals.find(s=>s.email===email);
  if(existing && existing.status === 'approved'){
    currentStaff = { name: existing.name, mobile: email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
    render();
    return;
  }

  if(!existing){
    staffApprovals.push({ name, email, status:'pending', requestedAt: new Date().toISOString() });
    await saveApprovals();
    notifyOwnerOfRequest(name, email); // fire-and-forget; owner gets an email
  }
  loginWaitingEmail = email;
  render();
}

function loginStaffManual(){
  const name = document.getElementById('loginName').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!name){ msg.innerHTML = `<div class="msg err">${t('enter_name_err')}</div>`; return; }
  currentStaff = { name, mobile: '' };
  try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
  render();
}

function logoutStaff(){
  currentStaff = null;
  loginWaitingEmail = null;
  try{ localStorage.removeItem('ssa_currentStaff'); }catch(e){}
  if(googleReady && window.google && google.accounts && google.accounts.id){
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  currentTab = 'book';
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  const first = document.querySelector('.navbtn[data-tab="book"]');
  if(first) first.classList.add('active');
  render();
}

async function approveStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  s.status = 'approved';
  s.approvedAt = new Date().toISOString();
  if(s.canDelete === undefined) s.canDelete = false; // owner must explicitly grant delete rights
  await saveApprovals();
  await logActivity('Staff Approved', `${s.name} (${email})`);
  render();
}

async function toggleDeletePermission(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  s.canDelete = !s.canDelete;
  await saveApprovals();
  await logActivity(s.canDelete ? 'Delete Access Granted' : 'Delete Access Blocked', `${s.name} (${email})`);
  render();
}

async function rejectStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  if(!confirm(`${t('reject_confirm')} ${s.name} (${email})?`)) return;
  s.status = 'rejected';
  await saveApprovals();
  await logActivity('Staff Rejected', `${s.name} (${email})`);
  render();
}

async function revokeStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  if(!confirm(`${t('revoke_confirm')} ${s.name} (${email})? ${t('revoke_confirm2')}`)) return;
  s.status = 'rejected';
  await saveApprovals();
  await logActivity('Staff Access Revoked', `${s.name} (${email})`);
  render();
}

let isSavingOrder = false; // prevents the same order being saved twice if the button is tapped again before the first save finishes

async function saveOrder(){
  if(isSavingOrder) return; // a save is already running — ignore the extra tap

  const custName = (document.getElementById('custName').value || '').trim();
  const custBrand = (document.getElementById('custBrand').value || '').trim();
  const msg = document.getElementById('bookMsg');
  if(!custName){ msg.innerHTML = `<div class="msg err">${t('enter_customer_err')}</div>`; return; }
  if(!custBrand){ msg.innerHTML = `<div class="msg err">${t('enter_brand_err')}</div>`; return; }
  if(!draftCart.length){ return; }

  isSavingOrder = true;
  const saveBtn = document.getElementById('saveOrderBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = t('saving_word'); }

  try{
    const now = new Date().toISOString();
    let totalSets = 0;
    draftCart.forEach(d=>{
      d.sizes.forEach(s=>{
        totalSets += s.qty;
        bookings.push({
          id: uid(),
          customerName: custName,
          brand: custBrand,
          designNumber: d.designNumber,
          colour: d.colour || '',
          size: s.size,
          qty: s.qty,
          status: 'pending',
          orderedAt: now,
          dispatchedAt: null,
          orderedBy: currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null
        });
      });
    });
    await saveData();

    const count = draftCart.length;
    await logActivity('Order Booked', `${custName}${custBrand ? ' ('+custBrand+')' : ''} — ${count} design(s), ${totalSets} sets`);

    draftCart = [];
    draftCustomer = '';
    draftBrand = '';
    tempDesignNumber = '';
    tempColour = '';
    tempSizes = [];
    render();
    const m2 = document.getElementById('bookMsg');
    if(m2) m2.innerHTML = `<div class="msg ok">${count} ${t('designs_saved')}</div>`;
  } finally {
    isSavingOrder = false;
  }
}

/* ---------------- ARTICLE (DISPATCH) SEARCH TAB ---------------- */

function inDispatchDateRange(iso){
  if(!dispatchFromDate && !dispatchToDate) return true;
  if(!iso) return false;
  const key = dispatchDateKey(iso);
  if(dispatchFromDate && key < dispatchFromDate) return false;
  if(dispatchToDate && key > dispatchToDate) return false;
  return true;
}

function renderDispatch(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  const allDesigns = [...new Set(activeBookings.map(b=>b.designNumber))];

  let resultsHtml = '';
  let exactDesign = null;
  const hasArticleQuery = !!dispatchQuery.trim();
  const hasBrandQuery = !!dispatchBrandQuery.trim();

  if(selectedDesign){
    // A design was explicitly picked from the selection list (or matched itself
    // exactly) — always resolve to exactly this design, even if its digits
    // happen to also appear inside a longer design number like "118 NAVY PURPLE".
    exactDesign = selectedDesign;
  } else if(hasArticleQuery){
    const q = dispatchQuery.trim().toLowerCase();
    const matchingDesigns = allDesigns.filter(d=>d.toLowerCase().includes(q));
    if(!matchingDesigns.length){
      resultsHtml = `<div class="empty">${t('no_article_found')}</div>`;
    } else if(matchingDesigns.length > 1){
      resultsHtml = `<div class="card">
        <div class="section-label" style="margin-top:0;">${t('matching_articles')}</div>
        ${matchingDesigns.map(d=>`<button class="secondary" style="margin-top:8px;text-align:left;" onclick="pickDesign('${d.replace(/'/g,"\\'")}')">${escapeHtml(d)}</button>`).join('')}
      </div>`;
    } else {
      exactDesign = matchingDesigns[0];
    }
  }

  if(exactDesign){
    let matches = activeBookings.filter(b=>b.designNumber===exactDesign && inDispatchDateRange(b.orderedAt));
    if(hasBrandQuery){
      const bq = dispatchBrandQuery.trim().toLowerCase();
      matches = matches.filter(b=>(b.brand||'').toLowerCase().includes(bq));
    }
    const pendingQty = matches.filter(b=>b.status==='pending').reduce((s,b)=>s+b.qty,0);
    const doneQty = matches.filter(b=>b.status==='dispatched').reduce((s,b)=>s+b.qty,0);

    const customers = [...new Set(matches.map(b=>b.customerName))];
    const custCards = customers.length ? customers.map(cname=>{
      const rows = matches.filter(b=>b.customerName===cname);
      const allDone = rows.every(b=>b.status==='dispatched');

      // group this customer's rows by colour + brand together, since the same
      // customer (or different customers) can order the same article under
      // different brands and/or colours — staff need to see exactly which
      // sizes belong to which brand+colour combo, not just a flat list
      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');

      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>{
          const done = b.status==='dispatched';
          return `<button class="size-btn ${done?'done':''}" ${done?'disabled':''} onclick="dispatchOne('${b.id}')">${escapeHtml(b.size)} · ${b.qty}${done?' ✓':''}</button>`;
        }).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `<div class="cust-card${allDone ? ' all-done' : ''}">
        <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>${allDone ? `<span class="set-pill done">${t('fully_dispatched')}</span>` : ''}</div>
        ${groupsHtml}
      </div>`;
    }).join('') : `<div class="empty">${t('no_article_found')}</div>`;

    const allColours = [...new Set(matches.map(b=>b.colour).filter(Boolean))];
    const allBrands = [...new Set(matches.map(b=>b.brand).filter(Boolean))];
    resultsHtml = `
      <div class="card">
        <div class="section-label" style="margin-top:0;">${t('article')}: ${escapeHtml(exactDesign)}
          ${selectedDesign ? `<button class="chip x" style="border:none;background:none;color:var(--navy);font-weight:700;float:right;" onclick="clearDesignSelection()">✕ ${t('change')}</button>` : ''}
        </div>
        ${allColours.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:4px;">${t('colours_ordered')}: ${allColours.map(escapeHtml).join(', ')}</div>` : ''}
        ${allBrands.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:8px;">${t('brands_ordered')}: ${allBrands.map(escapeHtml).join(', ')}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="set-pill pending">${t('closing_set')}: ${pendingQty} ${t('badge_pending')}</span>
          <span class="set-pill done">${t('dispatched')}: ${doneQty}</span>
        </div>
      </div>
      ${custCards}
    `;
  } else if(!hasArticleQuery && hasBrandQuery){
    // Article number left blank, only a brand typed — show every article
    // ordered under that brand, grouped by article then colour, each line
    // naming the customer and size, plus a Print (PDF) option for the list.
    const bq = dispatchBrandQuery.trim().toLowerCase();
    const brandMatches = activeBookings.filter(b=>(b.brand||'').toLowerCase().includes(bq) && inDispatchDateRange(b.orderedAt));

    if(!brandMatches.length){
      resultsHtml = `<div class="empty">${t('no_brand_orders')}</div>`;
    } else {
      const designGroups = {};
      brandMatches.forEach(b=>{
        if(!designGroups[b.designNumber]) designGroups[b.designNumber] = [];
        designGroups[b.designNumber].push(b);
      });
      const designKeys = Object.keys(designGroups).sort((a,b)=>a.localeCompare(b));
      const totalSets = brandMatches.reduce((s,b)=>s+b.qty,0);

      const articleCards = designKeys.map(dn=>{
        const rows = designGroups[dn];
        const dnTotal = rows.reduce((s,b)=>s+b.qty,0);
        const colourGroups = {};
        rows.forEach(b=>{
          const key = b.colour || '';
          if(!colourGroups[key]) colourGroups[key] = [];
          colourGroups[key].push(b);
        });
        const colourKeys = Object.keys(colourGroups);
        const showColourLabels = colourKeys.length > 1 || (colourKeys.length===1 && colourKeys[0] !== '');

        const colourSections = colourKeys.map(colour=>{
          const lines = colourGroups[colour].map(b=>{
            const done = b.status==='dispatched';
            return `<div class="item-line"><span>${escapeHtml(b.customerName)} · ${escapeHtml(b.size)}</span><span>${b.qty} ${t('set')} ${done?'✓':''}</span></div>`;
          }).join('');
          const label = showColourLabels ? `<div class="colour-label">${escapeHtml(colour || t('no_colour'))}</div>` : '';
          return `${label}${lines}`;
        }).join('');

        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${t('article')}: ${escapeHtml(dn)}</span><span class="set-pill pending">${dnTotal} ${t('sets')}</span></div>
          ${colourSections}
        </div>`;
      }).join('');

      resultsHtml = `
        <div class="card">
          <div class="section-label" style="margin-top:0;">${t('brand_overview')}: ${escapeHtml(dispatchBrandQuery.trim())}</div>
          <div style="font-size:13px;color:#5b6472;margin-bottom:10px;">${designKeys.length} ${t('articles_word')} · ${totalSets} ${t('sets')}</div>
          <button class="secondary" onclick="printBrandOverview()">${t('print')} PDF</button>
        </div>
        ${articleCards}
      `;
    }
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_by_article')}</h2>
      <input id="dispatchSearch" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(dispatchQuery)}" oninput="onDispatchSearch(this.value)" autofocus>
      <label style="margin-top:10px;">${t('by_brand_name')} (${t('optional_word')})</label>
      <input id="dispatchBrandSearch" list="brandList" placeholder="${t('brand_ph_optional')}" value="${escapeHtml(dispatchBrandQuery)}" oninput="onDispatchBrandSearch(this.value)">
      <label style="margin-top:10px;">${t('from_date')} (${t('optional_word')})</label>
      <input id="dispatchFromDate" type="date" value="${escapeHtml(dispatchFromDate)}" oninput="onDispatchDateRange('from', this.value)">
      <label style="margin-top:10px;">${t('to_date')} (${t('optional_word')})</label>
      <input id="dispatchToDate" type="date" value="${escapeHtml(dispatchToDate)}" oninput="onDispatchDateRange('to', this.value)">
    </div>
    ${resultsHtml}
  `;
}

function onDispatchDateRange(which, val){
  if(which==='from') dispatchFromDate = val; else dispatchToDate = val;
  render();
}

function printBrandOverview(){
  const bq = dispatchBrandQuery.trim();
  if(!bq) return;
  const bql = bq.toLowerCase();
  const matches = bookings.filter(b=>!b.trashed && (b.brand||'').toLowerCase().includes(bql) && inDispatchDateRange(b.orderedAt))
    .sort((a,b)=> a.designNumber.localeCompare(b.designNumber) || (a.colour||'').localeCompare(b.colour||'') || a.customerName.localeCompare(b.customerName));
  if(!matches.length){ alert(t('no_brand_orders')); return; }
  const totalSets = matches.reduce((s,b)=>s+b.qty,0);
  const rows = matches.map(b=>[b.designNumber, b.colour||'-', b.customerName, b.size, String(b.qty), b.status==='dispatched'?t('dispatched'):t('badge_pending')]);
  let dateNote = '';
  if(dispatchFromDate || dispatchToDate){
    dateNote = ` (${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '…'} – ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '…'})`;
  }
  const blob = buildPdfBlob(`${t('brand_overview')}: ${bq}${dateNote}`, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, ['Article','Colour','Customer','Size','Set','Status'], rows, `${t('total')}: ${totalSets} ${t('sets')}`);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  openPdfBlob(blob, `Brand-${bq.replace(/[^a-z0-9]/gi,'_')}.pdf`);
}

async function dispatchOne(bookingId){

  b.status = 'dispatched';

/* ---------------- DISPATCHED ORDERS TAB ---------------- */

function dispatchDateKey(iso){
  const d = new Date(iso);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dispatchDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function renderDispatchedOrders(main){
  let dispatchedAll = bookings.filter(b=>b.status==='dispatched' && !b.trashed);

  if(doSearchDesign.trim()){
    const q = doSearchDesign.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>b.designNumber.toLowerCase().includes(q));
  }
  if(doSearchBrand.trim()){
    const q = doSearchBrand.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>(b.brand||'').toLowerCase().includes(q));
  }
  if(doSearchDate){
    dispatchedAll = dispatchedAll.filter(b=>dispatchDateKey(b.dispatchedAt)===doSearchDate);
  }

  let resultsHtml = '';
  if(!dispatchedAll.length){
    resultsHtml = `<div class="empty">${t('no_dispatched_orders')}${(doSearchDesign||doSearchBrand||doSearchDate) ? ' '+t('no_dispatched_match') : ' '+t('no_dispatched_yet')}</div>`;
  } else {
    const dateGroups = {};
    dispatchedAll.forEach(b=>{
      const dk = dispatchDateKey(b.dispatchedAt);
      if(!dateGroups[dk]) dateGroups[dk] = {};
      if(!dateGroups[dk][b.customerName]) dateGroups[dk][b.customerName] = [];
      dateGroups[dk][b.customerName].push(b);
    });
    const dateKeys = Object.keys(dateGroups).sort((a,b)=>b.localeCompare(a));
    resultsHtml = dateKeys.map(dk=>{
      const custMap = dateGroups[dk];
      const custCards = Object.keys(custMap).map(cname=>{
        const rows = custMap[cname].sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
        const total = rows.reduce((s,b)=>s+b.qty,0);
        const brands = [...new Set(rows.map(b=>b.brand).filter(Boolean))].join(', ');
        const lines = rows.map(b=>
          `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}</span><span>${b.qty} ${t('set')} <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></span></div>`
        ).join('');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(cname)}${brands ? ` <span class="subtle">(${escapeHtml(brands)})</span>` : ''}</span><span class="set-pill done">${total} ${t('sets')}</span></div>
          ${lines}
          <div class="order-total-line"><span>${t('total')}</span><span>${total} ${t('sets')}</span></div>
          <div class="action-row">
            <button class="action-btn wa" onclick="shareWhatsAppDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('whatsapp')}</button>
            <button class="action-btn pr" onclick="printOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('print')}</button>
            ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('delete_btn')}</button>` : ''}
          </div>
        </div>`;
      }).join('');
      return `<div class="date-section-label">${dispatchDateLabel(dk)}</div>${custCards}`;
    }).join('');
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_dispatched')}</h2>
      <label>${t('by_article_number')}</label>
      <input id="doSearchDesign" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(doSearchDesign)}" oninput="onDoSearch('design', this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')}</label>
      <input id="doSearchBrand" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(doSearchBrand)}" oninput="onDoSearch('brand', this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="doSearchDate" type="date" value="${escapeHtml(doSearchDate)}" oninput="onDoSearch('date', this.value)">
    </div>
    ${resultsHtml}
  `;
}

function onDoSearch(which, val){
  if(which==='design') doSearchDesign = val;
  else if(which==='brand') doSearchBrand = val;
  else doSearchDate = val;
  render();
  setTimeout(()=>{
    const id = which==='design' ? 'doSearchDesign' : which==='brand' ? 'doSearchBrand' : 'doSearchDate';
    const el = document.getElementById(id);
    if(!el) return;
    el.focus();
    if(which!=='date') el.setSelectionRange(el.value.length, el.value.length);
  }, 0);
}

function getDatedRows(cname, dk){
  return bookings.filter(b=>b.customerName===cname && b.status==='dispatched' && !b.trashed && dispatchDateKey(b.dispatchedAt)===dk)
    .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
}

function buildDatedOrderPdf(cname, dk){
  const rows = getDatedRows(cname, dk);
  const total = rows.reduce((s,b)=>s+b.qty,0);
  const tableRows = rows.map(b=>[b.designNumber, b.colour||'-', b.size, b.brand||'-', String(b.qty)]);
  return {
    blob: buildPdfBlob(`Order — ${cname}`, `Subhash Sales Agencies · Dispatch Date: ${dispatchDateLabel(dk)}`, ['Design Number','Colour','Size','Brand','Set'], tableRows, `Total: ${total} Sets`),
    total
  };
}

function printOrderDated(cname, dk){
  const { blob } = buildDatedOrderPdf(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  openPdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`);
}

async function shareWhatsAppDated(cname, dk){
  const { blob, total } = buildDatedOrderPdf(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`, `Order — ${cname}`, `Order — ${cname} (${dispatchDateLabel(dk)}), Total ${total} Sets`);
}

async function deleteOrderDated(cname, dk){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.status==='dispatched' && !b.trashed && dispatchDateKey(b.dispatchedAt)===dk){
      b.trashed = true;
      b.trashedAt = new Date().toISOString();
      b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Deleted', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

async function restoreOrder(cname){
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.trashed){
      b.trashed = false;
      b.trashedAt = null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Restored', `${cname} — ${total} sets`);
  render();
}

async function permanentDeleteOrder(cname){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`${cname} — ${t('perm_delete_confirm')}`)) return;
  let total = 0;
  bookings = bookings.filter(b=>{
    if(b.customerName===cname && b.trashed){ total += b.qty; return false; }
    return true;
  });
  await saveData();
  await logActivity('Order Permanently Deleted', `${cname} — ${total} sets removed for good`);
  render();
}

function renderPendingOrders(main){
  const pendingAll = bookings.filter(b=>b.status==='pending' && !b.trashed);

  const searchBar = `
    <div class="card">
      <h2>${t('search_party')}</h2>

      ${pdSearchBrand.trim() && canCurrentUserDelete() ? `<button class="action-btn del" style="width:100%;margin-top:12px;" onclick="deleteAllByBrand()">${t('delete_all_brand')} "${escapeHtml(pdSearchBrand.trim())}"</button>` : ''}

    main.innerHTML = searchBar + `<div class="empty">${t('no_pending_orders')}</div>`;

  }

  if(pdSearchBrand.trim()){
    const bq = pdSearchBrand.trim().toLowerCase();
    filtered = filtered.filter(b=>(b.brand||'').toLowerCase().includes(bq));
  }
  if(pdSearchDate){
    filtered = filtered.filter(b=>dispatchDateKey(b.orderedAt)===pdSearchDate);
  }

  let customers = [...new Set(filtered.map(b=>b.customerName))];
  if(pdSearchCustomer.trim()){
    const q = pdSearchCustomer.trim().toLowerCase();
    customers = customers.filter(n=>n.toLowerCase().includes(q));
  }

  const cards = customers.map(cname=>{
    const rows = filtered.filter(b=>b.customerName===cname)
      .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
    const total = rows.reduce((s,b)=>s+b.qty,0);
    const lines = rows.map(b=>
      `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''}</span><span>${b.qty} ${t('set')}</span></div>`
    ).join('');

      <div class="cust-head"><span class="name">${escapeHtml(cname)}</span><span class="set-pill pending">${total} ${t('badge_pending')}</span></div>
      ${lines}
      ${canCurrentUserDelete() ? `<div class="action-row">
        <button class="action-btn del" onclick="deletePendingOrder('${cname.replace(/'/g,"\\'")}')">${t('delete_btn')}</button>
      </div>` : ''}
    </div>`;
  }).join('');

  main.innerHTML = searchBar + (cards || `<div class="empty">${t('no_customer_found')}</div>`);
}

async function deletePendingOrder(cname){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`${t('delete_confirm_1')} ${cname}?`)) return;
  let rows = bookings.filter(b=>b.status==='pending' && !b.trashed && b.customerName===cname);
  if(pdSearchBrand.trim()){
    const bq = pdSearchBrand.trim().toLowerCase();
    rows = rows.filter(b=>(b.brand||'').toLowerCase().includes(bq));
  }
  if(pdSearchDate){
    rows = rows.filter(b=>dispatchDateKey(b.orderedAt)===pdSearchDate);
  }
  let total = 0;
  rows.forEach(b=>{
    b.trashed = true;
    b.trashedAt = new Date().toISOString();
    b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
    total += b.qty;
  });
  await saveData();
  await logActivity('Order Deleted', `${cname} — ${total} sets (from Pending tab)`);
  render();
}

async function deleteAllByBrand(){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  const bq = pdSearchBrand.trim();
  if(!bq) return;
  const bql = bq.toLowerCase();
  const matches = bookings.filter(b=>b.status==='pending' && !b.trashed && (b.brand||'').toLowerCase().includes(bql));
  if(!matches.length){ alert(t('no_pending_for_brand')); return; }
  const custCount = new Set(matches.map(b=>b.customerName)).size;
  const totalSets = matches.reduce((s,b)=>s+b.qty,0);

  if(!confirm(`${t('bulk_confirm_1')} "${bq}" — ${custCount} ${t('bulk_confirm_customers')}, ${totalSets} ${t('sets')}. ${t('bulk_confirm_continue')}`)) return;
  if(!confirm(t('bulk_confirm_2'))) return;
  if(!confirm(`${t('bulk_confirm_3')} ${totalSets} ${t('sets')} — "${bq}"?`)) return;

  matches.forEach(b=>{
    b.trashed = true;
    b.trashedAt = new Date().toISOString();
    b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  });
  await saveData();
  await logActivity('Bulk Order Deleted (Brand)', `${bq} — ${custCount} customers, ${totalSets} sets`);
  render();
}

function renderCustomers(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  let customers = [...new Set(activeBookings.map(b=>b.customerName))]
    .filter(c=>c.toLowerCase().includes(customerFilter.trim().toLowerCase()));

  if(customerBrandFilter.trim()){
    const bq = customerBrandFilter.trim().toLowerCase();
    const namesWithBrand = new Set(
      activeBookings.filter(b=>(b.brand||'').toLowerCase().includes(bq)).map(b=>b.customerName)
    );
    customers = customers.filter(c=>namesWithBrand.has(c));
  }

  if(customerDateFilter){
    const namesOnDate = new Set(
      activeBookings.filter(b=>
        dispatchDateKey(b.orderedAt)===customerDateFilter ||
        (b.dispatchedAt && dispatchDateKey(b.dispatchedAt)===customerDateFilter)
      ).map(b=>b.customerName)
    );
    customers = customers.filter(c=>namesOnDate.has(c));
  }

  if(!activeBookings.length){
    main.innerHTML = `<div class="card"><div class="empty">${t('no_order_yet')}</div></div>`;
    return;
  }

  const cards = customers.map(cname=>{
    const rows = activeBookings.filter(b=>b.customerName===cname);
    const total = rows.reduce((s,b)=>s+b.qty,0);
    const done = rows.filter(b=>b.status==='dispatched').reduce((s,b)=>s+b.qty,0);
    const pending = total - done;
    const isOpen = expandedCustomer === cname;

    let detail = '';
    if(isOpen){
      const dispatchedRows = rows.filter(b=>b.status==='dispatched');
      const pendingRows = rows.filter(b=>b.status==='pending');
      detail = `<div class="cust-detail">
        ${dispatchedRows.length ? `<div class="section-label">${t('ready_goods')}</div>` + dispatchedRows.map(b=>`
          <div class="li"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${b.qty}</span>
          <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></div>
        `).join('') : ''}
        ${pendingRows.length ? `<div class="section-label">${t('pending_order')}</div>` + pendingRows.map(b=>`
          <div class="li"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${b.qty}</span><span style="color:var(--rust);">${t('badge_pending')}</span></div>
        `).join('') : ''}
      </div>`;
    }

    return `<div class="cust-card" onclick="toggleCustomer('${cname.replace(/'/g,"\\'")}')" style="cursor:pointer;">
      <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>
        <span class="set-pill ${pending>0?'pending':'done'}">${pending>0 ? pending+' '+t('badge_pending') : t('complete')}</span>
      </div>
      <div class="summary-row">
        <span>${t('total')}: ${total}</span>
        <span>${t('dispatched')}: ${done}</span>
        <span>${t('pending_sets')}: ${pending}</span>
      </div>
      <div class="action-row" onclick="event.stopPropagation();">
        <button class="action-btn wa" onclick="shareWhatsAppCustomer('${cname.replace(/'/g,"\\'")}')">${t('whatsapp')}</button>
        <button class="action-btn pr" onclick="printCustomerOrder('${cname.replace(/'/g,"\\'")}')">${t('print')}</button>
        ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteCustomerOrderFull('${cname.replace(/'/g,"\\'")}')">${t('delete_btn')}</button>` : ''}
      </div>
      ${detail}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card filter-input" style="margin-bottom:14px;">
      <label>${t('search_customer')}</label>
      <input id="custFilter" placeholder="${t('type_name')}" value="${escapeHtml(customerFilter)}" oninput="onCustomerFilter(this.value)">
      <label style="margin-top:10px;">${t('search_by_brand')}</label>
      <input id="custBrandFilter" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(customerBrandFilter)}" oninput="onCustomerBrandFilter(this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="custDateFilter" type="date" value="${escapeHtml(customerDateFilter)}" oninput="onCustomerDateFilter(this.value)">
    </div>
    ${cards || `<div class="empty">${t('no_customer_found')}</div>`}
  `;
}

function onCustomerFilter(val){
  customerFilter = val;
  render();
  setTimeout(()=>{
    const el = document.getElementById('custFilter');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}

function onCustomerBrandFilter(val){
  customerBrandFilter = val;
  render();
  setTimeout(()=>{
    const el = document.getElementById('custBrandFilter');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}

function onCustomerDateFilter(val){
  customerDateFilter = val;
  render();
  setTimeout(()=>{ const el = document.getElementById('custDateFilter'); if(el) el.focus(); }, 0);
}

function toggleCustomer(cname){
  expandedCustomer = expandedCustomer === cname ? null : cname;
  render();
}

async function undoDispatch(bookingId){
  event.stopPropagation();
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  b.status = 'pending';
  b.dispatchedAt = null;
  await saveData();
  await logActivity('Dispatch Undone', `${b.customerName} — Design ${b.designNumber}, ${b.size} × ${b.qty}`);
  render();
}

/* ---------------- DELETED ORDERS TAB ---------------- */

function renderDeletedOrders(main){
  const trashedAll = bookings.filter(b=>b.trashed);
  const trashedCustomers = [...new Set(trashedAll.map(b=>b.customerName))];

  if(!trashedCustomers.length){
    main.innerHTML = `<div class="card"><div class="empty">${t('no_deleted_orders')}</div></div>`;
    return;
  }

  const cards = trashedCustomers.map(cname=>{
    const rows = trashedAll.filter(b=>b.customerName===cname)
      .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
    const total = rows.reduce((s,b)=>s+b.qty,0);
    const lines = rows.map(b=>
      `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''}</span><span>${b.qty} ${t('set')} (${b.status==='dispatched'?t('dispatched'):t('badge_pending')})</span></div>`
    ).join('');
    return `<div class="trash-card">
      <div class="trash-head">
        <span><b>${escapeHtml(cname)}</b> <span class="subtle">(${total} ${t('sets_deleted')})</span></span>
        <div class="trash-actions">
          <button class="restore-btn" onclick="restoreOrder('${cname.replace(/'/g,"\\'")}')">${t('restore')}</button>
          ${canCurrentUserDelete() ? `<button class="perm-del-btn" onclick="permanentDeleteOrder('${cname.replace(/'/g,"\\'")}')">${t('delete_permanently')}</button>` : ''}
        </div>
      </div>
      ${lines}
    </div>`;
  }).join('');

  main.innerHTML = `<div class="card"><h2>${t('deleted_orders')} (${trashedCustomers.length})</h2></div>${cards}`;
}

/* ---------------- ACTIVITY LOG TAB ---------------- */

function renderActivity(main){
  let filtered = activityLog;
  if(activityDateFilter){
    filtered = filtered.filter(a=>dispatchDateKey(a.timestamp)===activityDateFilter);
  }

  const filterBar = `
    <div class="card">
      <h2>${t('staff_activity')} (${filtered.length})</h2>
      <label>${t('by_date')}</label>
      <input id="activityDateFilter" type="date" value="${escapeHtml(activityDateFilter)}" oninput="onActivityDateFilter(this.value)">
      <button class="secondary" style="margin-top:10px;" onclick="shareActivityWhatsApp()">${t('share_whatsapp_pdf')}</button>
    </div>
  `;

  if(!filtered.length){
    main.innerHTML = filterBar + `<div class="empty">${t('no_activity')}${activityDateFilter ? ' '+t('on_this_date') : ' '+t('yet_word')}</div>`;
    return;
  }

  const items = filtered.map(a=>`
    <div class="log-card">
      <div class="log-top">
        <span class="log-staff">${escapeHtml(a.staffName)} <span class="subtle">(${escapeHtml(a.staffMobile)})</span></span>
        <span class="log-time">${fmtTime(a.timestamp)}</span>
      </div>
      <div class="log-action">${escapeHtml(a.action)}</div>
      <div class="log-detail">${escapeHtml(a.detail)}</div>
    </div>
  `).join('');
  main.innerHTML = filterBar + items;
}

function onActivityDateFilter(val){
  activityDateFilter = val;
  render();
  setTimeout(()=>{ const el = document.getElementById('activityDateFilter'); if(el) el.focus(); }, 0);
}

async function shareActivityWhatsApp(){
  let filtered = activityLog;
  if(activityDateFilter) filtered = filtered.filter(a=>dispatchDateKey(a.timestamp)===activityDateFilter);
  if(!filtered.length){ alert(t('no_activity_share')); return; }
  const rows = filtered.map(a=>[a.staffName, fmtTime(a.timestamp), a.action, a.detail]);
  const title = `${t('staff_activity')}${activityDateFilter ? ' — '+dispatchDateLabel(activityDateFilter) : ''}`;
  const blob = buildPdfBlob(title, `Subhash Sales Agencies · ${new Date().toLocaleDateString('en-IN')}`, ['Staff','Time','Action','Detail'], rows, null);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `activity-log${activityDateFilter?'-'+activityDateFilter:''}.pdf`, title, title);
}

applyStaticLanguage();
loadData();
</script>
</body>
</html>
