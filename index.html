<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Subhash Sales Agencies — Order & Dispatch</title>

<!-- Makes this installable as a real app icon on phone/PC, not just a browser tab -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0288D1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SSA Orders">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0288D1;
    --linen:#EAF4F8;
    --mustard:#29A3E8;
    --side:#0F2236;
    --side2:#17314A;
    --font:Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    --ink:#1B2430;
    --rust:#B4552F;
    --sage:#2E7D4F;
    --line:#D5DFEC;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--linen);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  body{ padding-bottom:76px; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .topbar h1{
    font-family:var(--font);
    font-weight:700;
    font-size:18px;
    margin:0;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sync-badge{
    font-size:11.5px;
    font-weight:600;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
    background:rgba(255,255,255,0.15);
    color:#fff;
  }
  .sync-badge:empty{ display:none; }
  .closing-badge{
    background:#FFD166;
    color:#3A2A0F;
    font-weight:700;
    font-size:12.5px;
    padding:6px 11px;
    border-radius:20px;
    white-space:nowrap;
  }
  .staff-badge{
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .staff-badge button{
    background:none; border:none; color:#FFD166;
    font-size:11.5px; font-weight:700; padding:0; text-decoration:underline;
  }
  main{ padding:14px; max-width:640px; margin:0 auto; }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:var(--font);
    font-weight:700;
    font-size:18px;
    margin:0 0 12px 0;
  }
  label{
    display:block;
    font-size:13px;
    color:#5b6472;
    margin-bottom:5px;
    font-weight:600;
  }
  input, select{
    width:100%;
    padding:12px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:var(--font);
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
    border-color:var(--navy);
  }
  /* Colour-coded fields on the Order form, so Customer / Brand / Design /
     Size are each instantly recognisable at a glance while taking an order. */
  .field-navy{ border-left:4px solid var(--navy) !important; background:#F5F9FF !important; }
  .field-sage{ border-left:4px solid var(--sage) !important; background:#F3FAF6 !important; }
  .field-rust{ border-left:4px solid var(--rust) !important; background:#FDF6F3 !important; }
  .field-mustard{ border-left:4px solid var(--mustard) !important; background:#F2F8FF !important; }
  .label-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:6px; vertical-align:middle;
  }
  .row{ display:flex; gap:8px; margin-bottom:10px; align-items:flex-end; }
  .row > *{ flex:1; }
  .row .btn-inline{ flex:none; width:52px; }
  button{ font-family:var(--font); cursor:pointer; }
  button.primary{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    margin-top:6px;
  }
  button.primary:active{ background:#01679F; }
  button.primary:disabled{ background:#B7BCC6; }
  button.secondary{
    width:100%;
    background:#EAF1FB;
    color:var(--navy);
    border:1px solid var(--line);
    padding:12px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
  }
  button.small{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:20px;
    font-weight:700;
    line-height:1;
    padding:12px 0;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#EAF1FB;
    border:1px solid var(--line);
    padding:7px 10px;
    border-radius:20px;
    font-size:13.5px;
    margin:0 6px 6px 0;
  }
  .chip button.x{
    background:none; border:none; color:var(--rust);
    font-size:16px; padding:0; line-height:1; font-weight:700;
  }
  .design-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .design-block .dhead{
    display:flex; justify-content:space-between; align-items:center;
    font-weight:700; margin-bottom:6px;
  }
  .empty{
    text-align:center; padding:34px 12px; color:#7e8896; font-size:14.5px;
  }
  .msg{ padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:12px; }
  .msg.err{ background:#F7E4DA; color:var(--rust); border:1px solid #E5B79E; }
  .msg.ok{ background:#E3EFE8; color:#245C3B; border:1px solid #BFDCC9; }
  .msg.info{ background:#EAF1FB; color:var(--navy); border:1px solid var(--line); }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--navy);
    display:flex;
    overflow-x:auto;
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.2);
  }
  .navbtn{
    flex:1 0 auto;
    min-width:52px;
    background:none; border:none; color:#C7D8F0;
    font-size:10.3px; font-weight:600;
    padding:8px 2px;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .navbtn.active{ color:#fff; background:rgba(255,255,255,.14); }
  .navbtn .ic{ font-size:16px; }

  .set-pill{
    display:inline-block; font-size:12.5px; font-weight:700;
    padding:4px 10px; border-radius:14px;
  }
  .set-pill.pending{ background:#F7E4DA; color:var(--rust); }
  .set-pill.done{ background:#E3EFE8; color:var(--sage); }

  .cust-card{
    border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;
  }
  .cust-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .cust-head .name{ font-weight:700; font-size:16px; }
  .size-btn{
    padding:9px 12px;
    border-radius:8px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-size:14px;
    font-weight:700;
    margin:0 8px 8px 0;
  }
  .size-btn:active{ background:var(--navy); color:#fff; }
  .size-btn.done{
    border:1.5px solid var(--line);
    color:#a3aec0;
    background:#EEF2F8;
    opacity:.55;
  }
  .summary-row{
    display:flex; gap:14px; font-size:13px; color:#5b6472; margin-top:2px;
  }
  .filter-input{ margin-bottom:12px; }
  .cust-detail{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:13.5px;
  }
  .cust-detail .li{
    display:flex; justify-content:space-between; padding:5px 0;
  }
  .undo-link{
    background:none; border:none; color:var(--rust); font-size:12px;
    text-decoration:underline; padding:0;
  }
  .pend-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .pend-cancel-btn{
    background:#fff; color:var(--rust); border:1.5px solid var(--rust);
    border-radius:8px; padding:5px 14px; font-size:12.5px; font-weight:700;
  }
  .pend-sel-row{
    display:flex; align-items:center; gap:10px; margin:0; padding:9px 0;
    font-weight:500; font-size:13.5px; color:var(--ink); border-bottom:1px solid var(--line);
  }
  .pend-sel-row input[type=checkbox]{ width:20px; height:20px; flex:none; margin:0; padding:0; }
  .pend-selall{ background:#EAF1FB; padding:9px 10px; border-radius:8px; border-bottom:none; margin-bottom:4px; }
  .pend-cancel-bar{ margin-top:10px; }
  .pend-cancel-bar .action-btn{ width:100%; }
  .pend-cancel-bar .action-btn:disabled{ opacity:.45; }
  .section-label{
    font-size:12px; font-weight:700; color:#5b6472; margin:10px 0 4px;
  }
  .item-line{
    display:flex; justify-content:space-between;
    padding:6px 0; font-size:14px; border-bottom:1px solid var(--line);
  }
  .item-line:last-child{ border-bottom:none; }
  .order-total-line{
    display:flex; justify-content:space-between; font-weight:700;
    padding-top:10px; margin-top:6px; border-top:2px solid var(--ink);
    font-size:15px;
  }
  .action-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .action-btn{
    flex:1; min-width:80px;
    border:none; border-radius:8px; padding:10px 8px;
    font-size:12.5px; font-weight:700; text-align:center;
  }
  .action-btn.wa{ background:#3F7B4F; color:#fff; }
  .action-btn.pr{ background:var(--navy); color:#fff; }
  .action-btn.del{ background:#fff; color:var(--rust); border:1.5px solid var(--rust); }
  .trash-card{
    border:1px dashed var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; background:#EEF2F8;
  }
  .trash-head{ display:flex; justify-content:space-between; align-items:center; }
  .restore-btn{
    background:var(--sage); color:#fff; border:none; border-radius:8px;
    padding:8px 12px; font-size:13px; font-weight:700;
  }
  .restore-btn.mini{ padding:3px 10px; font-size:11.5px; border-radius:6px; }
  .subtle{ color:#7e8896; font-size:12.5px; }

  .log-card{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .log-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .log-staff{ font-weight:700; font-size:14px; }
  .log-time{ font-size:11.5px; color:#7e8896; }
  .log-action{ font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:2px; }
  .log-detail{ font-size:13.5px; color:#3a4453; }

  .login-wrap{
    min-height:calc(100vh - 70px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:28px 22px; max-width:380px; width:100%;
  }
  .login-card h2{
    font-family:var(--font); font-weight:700; font-size:22px; margin:0 0 6px 0;
    color:var(--navy);
  }
  .login-card p{ font-size:13.5px; color:#5b6472; margin:0 0 18px 0; }
  .login-divider{ text-align:center; color:#9aa4b2; font-size:12px; margin:14px 0; }
  #googleSignInBtn{ display:flex; justify-content:center; margin:10px 0; }

  .cust-card.all-done{ opacity:.55; background:#EEF2F8; }
  .cust-card.all-done .name{ color:#a3aec0; }

  .colour-label{
    font-size:12.5px; font-weight:700; color:var(--navy); text-transform:uppercase;
    letter-spacing:.3px; margin:10px 0 5px 0;
  }
  .colour-label:first-child{ margin-top:2px; }
  /* Size presets sit directly under the Size row as horizontal chips
     (landscape, wrapping across the width) instead of a tall dropdown list. */
  .size-suggest-dropdown{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-top:10px; padding:10px;
    background:#F2F8FF; border:1px solid var(--line); border-radius:10px;
    max-height:150px; overflow-y:auto;
  }
  .size-suggest-item{
    padding:9px 14px; font-size:14px; font-weight:600; color:var(--navy);
    background:#fff; border:1.5px solid var(--navy); border-radius:20px;
  }
  .size-suggest-item:active{ background:var(--navy); color:#fff; }

  .date-section-label{
    font-family:var(--font); font-weight:700; font-size:15px;
    color:var(--navy); margin:18px 0 8px 2px; padding-bottom:4px;
    border-bottom:2px solid var(--line);
  }
  .date-section-label:first-child{ margin-top:0; }

  .lang-toggle{
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:700;
  }
  .lang-toggle:active{ background:rgba(255,255,255,.3); }

  .ssa-toast-wrap{ position:fixed; top:12px; left:0; right:0; z-index:9999; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .ssa-toast{ pointer-events:auto; max-width:92%; background:#0288D1; color:#fff; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.3); border-left:6px solid #FFC94D; }
  .item-line .st-pend{ color:var(--rust); font-weight:700; }
  .item-line .st-done{ color:#245C3B; font-weight:700; }
  .trash-actions{ display:flex; gap:8px; }
  .perm-del-btn{
    background:#fff; color:var(--rust); border:1.5px solid var(--rust);
    border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700;
  }
  /* ---- Voice order ---- */
  .voice-ov{ position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; }
  .voice-sheet{ background:#fff; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 24px rgba(0,0,0,.25); }
  .voice-head{ display:flex; justify-content:space-between; align-items:center; font-size:17px; color:var(--navy); }
  .voice-x{ border:none; background:none; font-size:20px; cursor:pointer; color:#555; width:auto; margin:0; padding:4px 8px; }
  .voice-status{ margin:8px 0 6px; font-size:14px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:8px; }
  .voice-dot{ width:11px; height:11px; border-radius:50%; background:#d33; display:inline-block; animation:voicePulse 1s infinite; }
  @keyframes voicePulse{ 0%{ box-shadow:0 0 0 0 rgba(221,51,51,.6);} 100%{ box-shadow:0 0 0 10px rgba(221,51,51,0);} }
  .voice-langs{ display:flex; gap:8px; margin-bottom:8px; }
  .voice-langs button{ flex:1; margin:0; padding:6px 8px; font-size:12.5px; border:1.5px solid #c9d0da; background:#fff; color:#445; border-radius:8px; cursor:pointer; }
  .voice-langs button.on{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .voice-live{ background:#F3F5F8; border-radius:8px; padding:8px 10px; font-size:14px; color:#556; font-style:italic; margin-bottom:8px; }
  .voice-summary{ border:1.5px solid #dfe4ea; border-radius:10px; padding:8px 10px; font-size:14px; }
  .vo-row{ padding:2px 0; }
  .vo-item{ padding:4px 8px; margin-top:4px; background:#EEF4F0; border-radius:6px; font-size:13.5px; }
  .vo-pend{ background:#FFF6DD; }
  .voice-hint{ margin:10px 0 4px; font-size:12.5px; color:#667; }
  .voice-hint summary{ cursor:pointer; font-weight:600; color:var(--navy); }
  .voice-hint div{ margin-top:6px; line-height:1.5; }
  .voice-actions{ display:flex; gap:10px; margin-top:12px; align-items:center; }
  .voice-mic{ flex:1; margin:0; padding:12px 10px; border-radius:10px; border:2px solid var(--navy); background:#fff; color:var(--navy); font-size:15px; font-weight:700; cursor:pointer; }
  .voice-mic.live{ border-color:#d33; color:#d33; }

  /* =====================================================================
     VastraApp-style look: blue header, dark sidebar (desktop), white cards
     ===================================================================== */
  body{ font-family:var(--font); }
  body.nologin{ padding-left:0 !important; }
  .page-title{ display:none; font-size:20px; font-weight:500; }
  .side-brand,.side-foot{ display:none; }
  .topbar{ box-shadow:none; }
  main.wide{ max-width:1180px; }
  .btn-pill{ background:var(--navy); color:#fff; border:none; border-radius:20px; padding:10px 16px; font-size:13.5px; font-weight:700; white-space:nowrap; }
  .btn-pill.alt{ background:#1F7A4D; }
  .btn-pill.ghost{ background:#fff; color:var(--navy); border:1px solid var(--line); }
  .pill-select{ width:auto; background:#fff; color:var(--navy); border:none; border-radius:20px; padding:8px 14px; font-weight:700; font-size:14px; }
  .pill-select.sm{ padding:6px 10px; font-size:13px; border:1px solid var(--line); }

  @media(min-width:900px){
    body{ padding-left:248px; padding-bottom:0; }
    .bottom-nav{ top:0; bottom:auto; right:auto; width:248px; height:100vh; flex-direction:column; overflow-y:auto; overflow-x:hidden; background:var(--side); padding:0 10px 10px; box-shadow:none; }
    .side-brand{ display:flex; align-items:center; gap:12px; padding:18px 6px 16px; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,.12); color:#fff; }
    .side-brand img{ width:44px; height:44px; border-radius:50%; background:#fff; object-fit:cover; flex:none; }
    .side-brand b{ display:block; font-size:15px; line-height:1.25; }
    .side-brand span{ font-size:11.5px; opacity:.7; }
    .side-foot{ display:block; margin-top:auto; padding:14px 8px 4px; color:#9FB4CB; font-size:12.5px; }
    .navbtn{ flex:none; flex-direction:row; justify-content:flex-start; gap:12px; font-size:14px; font-weight:600; padding:12px 14px; margin-top:8px; background:var(--side2); color:#E6EEF7; border-radius:6px; }
    .navbtn.active{ background:var(--side2); color:#41B6F8; }
    .navbtn .ic{ font-size:17px; width:22px; text-align:center; }
    .topbar{ padding:16px 24px; }
    .topbar h1{ display:none; }
    .page-title{ display:block; }
    main{ max-width:760px; padding:20px; }
    main.wide{ max-width:1180px; }
  }

  /* ---- Dashboard ---- */
  .dash-bar{ display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:10px; font-size:12px; color:#5b6472; flex-wrap:wrap; }
  .dash-hero{ background:var(--navy); border-radius:12px; padding:16px; margin-bottom:18px; }
  .dash-head{ display:flex; justify-content:space-between; align-items:center; color:#fff; margin-bottom:14px; gap:10px; }
  .dash-head h2{ margin:0; font-size:21px; font-weight:400; }
  .dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .dcard{ background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .dtitle{ font-weight:500; font-size:16px; display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .dtitle i{ font-style:normal; font-size:20px; }
  .dstats{ display:flex; }
  .dstat{ flex:1; padding:0 12px; border-left:1px solid var(--line); min-width:0; }
  .dstat:first-child{ border-left:none; padding-left:0; }
  .dstat small{ display:block; color:#6b7684; font-size:12.5px; margin-bottom:6px; }
  .dstat b{ font-size:17px; font-weight:500; word-break:break-word; }
  .up{ color:#1F7A4D; font-size:12px; margin-left:6px; font-weight:700; }
  .dn{ color:#E5534B; font-size:12px; margin-left:6px; font-weight:700; }
  @media(min-width:760px){ .dcard.span2{ grid-column:span 2; } }
  .dash-sec{ font-size:19px; color:#7b8794; margin:6px 0 12px; font-weight:400; }

function canCurrentUserSeeLoc_(){
  if(!currentStaff || !currentStaff.mobile) return false;
  if(currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()) return true;
  const entry = staffApprovals.find(s=>s.email === currentStaff.mobile);
  return !!(entry && entry.status === 'approved' && entry.canSeeLocation);
}

  if(!currentStaff) return false;
  if(!currentStaff.mobile) return true;
  if(currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()) return true;
  const entry = staffApprovals.find(s=>s.email === currentStaff.mobile);
  return !!(entry && entry.canDelete);
}

  { key:'pendingOrders',    label:'Pending' },

  { key:'deletedOrders',    label:'Deleted' },
  { key:'activity',         label:'Activity' }
];

function canAccessTab(tabKey){
  if(!currentStaff) return false;
  if(tabKey === 'book' || tabKey === 'dispatch') return true; // always allowed
  if(!currentStaff.mobile) return true; // legacy name-only login predates this system
  if(currentStaff.mobile.toLowerCase() === OWNER_EMAIL.toLowerCase()) return true;
  if(tabKey === 'approvals') return false; // owner-only, handled separately
  const entry = staffApprovals.find(s=>s.email === currentStaff.mobile);
  return !!(entry && Array.isArray(entry.allowedTabs) && entry.allowedTabs.includes(tabKey));
}

async function toggleTabPermission(email, tabKey){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  if(!Array.isArray(s.allowedTabs)) s.allowedTabs = [];
  const has = s.allowedTabs.includes(tabKey);
  s.allowedTabs = has ? s.allowedTabs.filter(t=>t!==tabKey) : [...s.allowedTabs, tabKey];
  await saveApprovals();
  await logActivity(has ? 'Tab Access Removed' : 'Tab Access Granted', `${s.name} (${email}) — ${tabKey}`);
  render();
}

// Gives instant feedback the moment someone taps a button that then has to
// wait on a network round-trip (delete/restore/dispatch/approve etc.) —
// disables the exact button clicked and swaps its label, so it's obvious
// something is happening rather than the screen just sitting there until
// the whole tab re-renders a second or two later.
function markBusy(label){
  try{
    const ev = (typeof event !== 'undefined') ? event : null;
    const btn = ev && ev.target && ev.target.closest ? ev.target.closest('button') : null;
    if(btn && !btn.disabled){ btn.disabled = true; btn.textContent = label; }
    return btn;
  }catch(e){ return null; }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function t(key){
  return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
}

function toggleLang(){
  currentLang = currentLang === 'hi' ? 'en' : 'hi';
  try{ localStorage.setItem('ssa_lang', currentLang); }catch(e){}
  applyStaticLanguage();
  render();
}

// Text that lives outside main (nav bar, page title) is only re-applied here,
// since it isn't rebuilt on every render() the way tab content is.
function applyStaticLanguage(){
  document.title = t('app_title') + ' — Order & Dispatch';
  const h1 = document.querySelector('.topbar h1');
  if(h1) h1.textContent = t('app_title');
  const langBtn = document.getElementById('langToggleBtn');
  if(langBtn) langBtn.textContent = t('lang_toggle');
  const navMap = { book:'nav_order', dispatch:'nav_article', dispatchedOrders:'nav_dispatched',
    pendingOrders:'nav_pending', customers:'nav_customers', deletedOrders:'nav_deleted',
    activity:'nav_activity', approvals:'nav_approvals', dashboard:'nav_dashboard', catalog:'nav_catalog' };
  document.querySelectorAll('.navbtn').forEach(btn=>{
    const key = navMap[btn.dataset.tab];
    if(!key) return;
    const ic = btn.querySelector('.ic');
    btn.innerHTML = '';
    if(ic) btn.appendChild(ic);
    btn.appendChild(document.createTextNode(t(key)));
  });
}

/* ---------- Order unit: Set / Pcs / Box ----------
   Every booking can carry a `unit` ('set' | 'pcs' | 'box'). Old bookings have no
   unit and are treated as 'set', so nothing existing changes. */
const UNIT_KEYS = ['set','pcs','box'];
const UNIT_EN = { set:'Set', pcs:'Pcs', box:'Box' };
function unitOf_(x){ const u = x && x.unit; return UNIT_EN[u] ? u : 'set'; }
function unitEn_(u){ return UNIT_EN[u] || 'Set'; }
function unitUi_(u, plural){ if(u==='pcs') return t('pcs'); if(u==='box') return t('box'); return plural ? t('sets') : t('set'); }
function sumByUnit_(items){
  const m = {};
  (items||[]).forEach(x=>{ const u = unitOf_(x); m[u] = (m[u]||0) + (Number(x.qty)||0); });
  return m;
}
// "5 Set + 10 Pcs" (English, for PDFs)
function totalsPdf_(items){
  const m = sumByUnit_(items);
  const parts = UNIT_KEYS.filter(u=>m[u]).map(u=>`${m[u]} ${unitEn_(u)}`);
  return parts.length ? parts.join(' + ') : '0 Set';
}
// Same, in the app language (screen + WhatsApp text)
function totalsUi_(items){
  const m = sumByUnit_(items);
  const parts = UNIT_KEYS.filter(u=>m[u]).map(u=>`${m[u]} ${unitUi_(u, true)}`);
  return parts.length ? parts.join(' + ') : `0 ${t('sets')}`;
}
// Plain number when everything is in Sets (looks exactly like before), full text otherwise
function totalsShort_(items){
  const m = sumByUnit_(items);
  const used = UNIT_KEYS.filter(u=>m[u]);
  if(!used.length) return '0';
  if(used.length===1 && used[0]==='set') return String(m.set);
  return totalsUi_(items);
}
function qtyUi_(b){ return `${b.qty} ${unitUi_(unitOf_(b))}`; }                 // "1 Set" / "1 Pcs" / "1 Box"
function qtyShort_(b){ const u = unitOf_(b); return u==='set' ? String(b.qty) : `${b.qty} ${unitUi_(u)}`; }
// PDF / Excel quantity column: header is the unit when every row has the same unit, else "Qty"
function unitHdr_(items){
  const us = new Set((items||[]).map(unitOf_));
  if(us.size===0) return 'Set';
  return us.size===1 ? unitEn_([...us][0]) : 'Qty';
}
function qtyCell_(x, hdr){ return hdr==='Qty' ? `${x.qty} ${unitEn_(unitOf_(x))}` : String(x.qty); }
function xlQty_(x, hdr){ return hdr==='Qty' ? `${x.qty} ${unitEn_(unitOf_(x))}` : x.qty; }
function xlTotal_(items){
  const m = sumByUnit_(items); const used = UNIT_KEYS.filter(u=>m[u]);
  return used.length<=1 ? (used.length ? m[used[0]] : 0) : totalsPdf_(items);
}
function xlHdr_(prefix, hdr){ return hdr==='Set' ? `${prefix} Sets` : `${prefix} ${hdr}`; }
function unitSelectHtml_(id, cur, style, onchange){
  return `<select id="${id}" ${onchange ? `onchange="${onchange}"` : ''} style="${style||''}">${UNIT_KEYS.map(u=>`<option value="${u}" ${u===cur?'selected':''}>${unitUi_(u)}</option>`).join('')}</select>`;
}

// Amount of one line = Qty x Price per pc, counted only for lines ordered in Pcs
// (a Set / Box has no fixed pcs count, so no amount can be worked out for it).
function rowAmount_(b){
  if(unitOf_(b)!=='pcs') return 0;
  const pr = parseFloat(b.pricePerPcs);
  return (pr > 0 && b.qty > 0) ? Math.round(pr * b.qty * 100) / 100 : 0;
}
function fmtAmt_(n){ return (Math.round(n * 100) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
// " | Total Amount: Rs 1,200" for the PDF footer (empty when the order has no pcs amount)
function amtFooter_(pp){ return pp && pp.hasAmount ? `   |   Total Amount: Rs ${fmtAmt_(pp.amountTotal)}` : ''; }

// Adds a "Price" column to an order PDF, but only when at least one line in
// it actually has a price. When some lines are in Pcs it also adds an "Amount (Rs)"
// column (Qty x Price) and returns the order's total amount.
// tableRows[i] must correspond to srcRows[i].
function pdfWithPrice_(columns, tableRows, srcRows, afterCol){
  if(!srcRows.some(b=>b.pricePerPcs)) return { columns: columns, tableRows: tableRows, hasAmount:false, amountTotal:0 };
  const hasAmount = srcRows.some(b=>rowAmount_(b) > 0);
  const amountTotal = srcRows.reduce((s,b)=>s+rowAmount_(b),0);
  const idx = columns.indexOf(afterCol) + 1;
  const cols = columns.slice();
  cols.splice(idx, 0, 'Price (Rs)');
  if(hasAmount) cols.splice(idx + 1, 0, 'Amount (Rs)');
  const rows = tableRows.map((r,i)=>{
    const c = r.slice();
    c.splice(idx, 0, srcRows[i].pricePerPcs ? String(srcRows[i].pricePerPcs) : '-');
    if(hasAmount){ const a = rowAmount_(srcRows[i]); c.splice(idx + 1, 0, a ? fmtAmt_(a) : '-'); }
    return c;
  });
  return { columns: cols, tableRows: rows, hasAmount, amountTotal };
}

function buildPdfBlob(title, subtitle, columns, rows, footerText, extraOpts){
  if(!window.jspdf || !window.jspdf.jsPDF) return null;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('times', 'normal');          // Times New Roman style for every PDF

    // Subtitle: the company name and today's date are no longer printed inside the title box
    // (today's date sits beside the page number instead) — only extra info such as a date range stays.
    const todayStr = new Date().toLocaleDateString('en-IN');
    subtitle = String(subtitle || '').split(/\s[|·]\s/).map(p=>p.trim())
      .filter(p=>p && p !== COMPANY_NAME && p !== todayStr).join('   |   ');
    const headingTxt = (extraOpts && extraOpts.heading) || '';

    const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    // Letterhead + title boxes (FIRST page only). Returns the Y where the table starts.
    const drawHeader = ()=>{
    // Double border: a firmer outer line plus a fine inner line, so the boxes stand out.
    const dblRect = (x, y, w, h)=>{
      doc.setLineWidth(0.6); doc.rect(x, y, w, h);
      doc.setLineWidth(0.2); doc.rect(x + 1.3, y + 1.3, w - 2.6, h - 2.6);
    };
    const bx = 14, bw = pageW - 28;                 // content box: 14mm side margins
    doc.setDrawColor(40,50,65);
    doc.setLineWidth(0.4);

    // ---- Letterhead box: logo + name / address / contact, centred, with a full border ----
    const hy = 13, hh = 28;
    if(headingTxt){                                 // top heading, e.g. "Order Status"
      doc.setFont('times', 'bold');
      doc.setFontSize(14);
      doc.setTextColor(20,20,20);
      doc.text(String(headingTxt), pageW / 2, 9.5, { align: 'center' });
      doc.setFont('times', 'normal');
    }
    dblRect(bx, hy, bw, hh);
    const nameTxt = COMPANY_NAME;
    const addrTxt = `Address : ${COMPANY_ADDRESS}`;
    const contTxt = `Contact No : ${COMPANY_CONTACT}`;
    doc.setFontSize(13); const wName = doc.getTextWidth(nameTxt);
    doc.setFontSize(9);  const wAddr = doc.getTextWidth(addrTxt), wCont = doc.getTextWidth(contTxt);
    const textW = Math.max(wName, wAddr, wCont);
    const logoW = 16, logoH = 13.7, gap = 4;
    const groupW = logoW + gap + textW;
    const gx = bx + (bw - groupW) / 2;              // whole logo+text group centred in the box
    const tcx = gx + logoW + gap + textW / 2;       // centre line of the text block
    try{ doc.addImage(COMPANY_LOGO_B64, 'JPEG', gx, hy + (hh - logoH) / 2, logoW, logoH); }catch(e){ console.error('Logo embed failed', e); }
    doc.setFontSize(13);
    doc.setTextColor(20,20,20);
    doc.text(nameTxt, tcx, hy + 9.5, { align: 'center' });
    doc.setFontSize(9);
    doc.setTextColor(90,100,115);
    doc.text(addrTxt, tcx, hy + 15.5, { align: 'center' });
    doc.text(contTxt, tcx, hy + 20.5, { align: 'center' });

    // ---- Title box (also bordered): report title + subtitle ----
    const ty = hy + hh + 3;
    doc.setFontSize(14);
    const tLines = doc.splitTextToSize(String(title || ''), bw - 8);
    doc.setFontSize(10);
    const sLines = doc.splitTextToSize(String(subtitle || ''), bw - 8);
    const th = 5.5 + tLines.length * 6.5 + sLines.length * 5 + 3;
    dblRect(bx, ty, bw, th);
    doc.setFontSize(14);
    doc.setTextColor(20,20,20);
    tLines.forEach((ln,i)=> doc.text(ln, pageW / 2, ty + 5.5 + 4.5 + i * 6.5, { align: 'center' }));
    doc.setFontSize(10);
    doc.setTextColor(90,100,115);
    sLines.forEach((ln,i)=> doc.text(ln, pageW / 2, ty + 5.5 + tLines.length * 6.5 + 2 + i * 5, { align: 'center' }));
    doc.setTextColor(20,20,20);
    doc.setLineWidth(0.2);
    return ty + th + 5;
    };
    const tableStart = drawHeader();          // page 1 header

    // Optional "continued" headings: when one group (e.g. a customer) runs over onto the
    // next page, a heading row with that group's name is put at the top of that page.
    const contCfg = extraOpts && extraOpts.continuation;
    const repeatCfg = extraOpts && extraOpts.repeatLabel;
    const tableOpts = Object.assign({}, extraOpts || {});
    delete tableOpts.continuation;
    delete tableOpts.heading;
    delete tableOpts.repeatLabel;
    const baseOpts = Object.assign({
      head: [columns],
      headStyles: { fillColor: [22,86,166], textColor: [255,255,255] },
      margin: { top: 14, right: 14, bottom: 14, left: 14 },
      rowPageBreak: 'avoid',           // a row is never cut in half between two pages
      theme: 'grid'
    }, tableOpts, {
      styles: Object.assign({ fontSize: 9, cellPadding: 3 }, tableOpts.styles || {}, { font: 'times' })
    });
    let bodyRows = rows;
    if(contCfg){
      try{
        let cur = rows.map((r,i)=>({ row:r, label: contCfg.labels[i], isHead: !!contCfg.isHeading[i], isCont:false }));
        // One page at a time, top to bottom: a heading added at the top of page N only moves
        // rows on page N and later, so the headings already placed on earlier pages stay
        // exactly at the top of their pages (no repeats, none in the middle of a page).
        for(let pass = 0; pass < 120; pass++){
          const sd = new jsPDF();
          const firstOnPage = {};
          sd.autoTable(Object.assign({}, baseOpts, {
            startY: tableStart,
            body: cur.map(x=>x.row),
            didDrawCell: (d)=>{
              if(d.section === 'body'){
                const pn = sd.internal.getNumberOfPages();
                if(!(pn in firstOnPage)) firstOnPage[pn] = d.row.index;
              }
            }
          }));
          let target = -1;
          const pages = Object.keys(firstOnPage).map(Number).sort((x,y)=>x-y);
          for(const pn of pages){
            if(pn === 1) continue;
            const idx = firstOnPage[pn];
            const it = cur[idx];
            if(it && !it.isHead && !it.isCont && it.label){ target = idx; break; }
          }
          if(target < 0) break;
          cur.splice(target, 0, { row: contCfg.makeRow(cur[target].label), label: cur[target].label, isHead:false, isCont:true });
        }
        bodyRows = cur.map(x=>x.row);
      }catch(e){ console.error('Continued-heading layout skipped', e); bodyRows = rows; }
    }
    // "=" rows that land at the TOP of a new page get the article number written out again.
    if(repeatCfg){
      try{
        const sd = new jsPDF();
        const firstOnPage = {};
        sd.autoTable(Object.assign({}, baseOpts, {
          startY: tableStart,
          body: bodyRows,
          didDrawCell: (d)=>{
            if(d.section === 'body'){
              const pn = sd.internal.getNumberOfPages();
              if(!(pn in firstOnPage)) firstOnPage[pn] = d.row.index;
            }
          }
        }));
        Object.keys(firstOnPage).forEach(pn=>{
          if(Number(pn) === 1) return;
          const i = firstOnPage[pn];
          if(!repeatCfg.isFirst[i] && bodyRows[i] && bodyRows[i][repeatCfg.col]){
            const cell = bodyRows[i][repeatCfg.col];
            bodyRows[i][repeatCfg.col] = Object.assign({}, cell, { content: repeatCfg.articles[i], styles: Object.assign({}, cell.styles, { fontStyle:'bold', halign:'left' }) });
          }
        });
      }catch(e){ console.error('Repeat article label skipped', e); }
    }
    doc.autoTable(Object.assign({}, baseOpts, { startY: tableStart, body: bodyRows }));
    if(footerText){
      const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || tableStart;
      let y = finalY + 10;
      if(y > pageH - 14){ doc.addPage(); y = 24; }
      doc.setFontSize(11);
      doc.setTextColor(20,20,20);
      doc.text(footerText, 14, y);
    }
    // Today's date + small page number ("Page 1 of 4") in the top-RIGHT corner of every page.
    const totalPages = doc.getNumberOfPages();
    for(let i = 1; i <= totalPages; i++){
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(60,70,85);
      doc.text(`${todayStr}      Page ${i} of ${totalPages}`, pageW - 14, 7, { align: 'right' });
    }
    return doc.output('blob');
  }catch(e){ console.error('PDF build failed', e); return null; }
}

function showPdfActions_(blob, filename, title, shareText){

        <div style="font-weight:700;font-size:15px;color:#1B2430;">📄 PDF ready</div>

      <button id="pdfActDl" style="width:100%;background:#1656A6;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;margin-bottom:8px;">⬇️ Download / Save PDF</button>
      <button id="pdfActOpen" style="width:100%;background:#EAF1FB;color:#1656A6;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">🖨️ Open / Print</button>
    </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.getElementById('pdfActClose').onclick = close;
  document.getElementById('pdfActWa').onclick = async ()=>{ await sharePdfBlob(blob, filename, title, shareText || title); };
  document.getElementById('pdfActDl').onclick = ()=>{

    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();

function openPdfBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(!w){
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

async function sharePdfBlob(blob, filename, shareTitle, shareText){
  let file = null, canNative = false;
  try{
    file = new File([blob], filename, { type: 'application/pdf' });
    canNative = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    if(canNative){
      // Important: don't pass "text" alongside "files" here. On Android,
      // sharing a file + text together to WhatsApp's direct-share contact
      // shortcut makes WhatsApp misread it as an empty text message and
      // refuse to send ("Can't send empty message"), even though a file is
      // attached. Sharing the file alone (with just a title) avoids that.
      await navigator.share({ files: [file], title: shareTitle });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // user cancelled the share sheet
    if(canNative && e && e.name === 'NotAllowedError'){
      // The phone only lets a page open the share sheet right after a tap.
      // If too much time passed since the tap (slow network while saving),
      // ask for one fresh tap instead of dropping to a download.
      showShareAgainPrompt_(file, blob, filename, shareTitle, shareText);
      return;
    }
    console.error('Native share failed, falling back to download', e);
  }
  downloadAndOpenWhatsApp_(blob, filename, shareText);
}

// Fallback for browsers without file-sharing support (mostly desktop):
// download the PDF, then open WhatsApp so it can be attached manually.
function downloadAndOpenWhatsApp_(blob, filename, shareText){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  window.open(`https://wa.me/?text=${encodeURIComponent(shareText + `\n\n📎 PDF downloaded as "${filename}" — please attach it from your Downloads folder here.`)}`, '_blank');
}

function showShareAgainPrompt_(file, blob, filename, shareTitle, shareText){
  const old = document.getElementById('shareAgainBar');
  if(old) old.remove();
  const bar = document.createElement('div');
  bar.id = 'shareAgainBar';
  bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:80px;z-index:999;background:#0F5132;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);';
  bar.innerHTML = `<span style="flex:1;font-size:13.5px;font-weight:600;">Order saved. Tap to send the PDF on WhatsApp</span>
    <button id="shareAgainBtn" style="background:#25D366;color:#063;border:none;border-radius:10px;padding:10px 14px;font-weight:700;">Share PDF</button>
    <button id="shareAgainClose" style="background:none;border:none;color:#fff;font-size:20px;">✕</button>`;
  document.body.appendChild(bar);
  document.getElementById('shareAgainClose').onclick = ()=>bar.remove();
  document.getElementById('shareAgainBtn').onclick = ()=>{
    // this tap is a fresh user gesture, so the share sheet is allowed
    navigator.share({ files: [file], title: shareTitle })
      .then(()=>bar.remove())
      .catch(e=>{
        if(e && e.name === 'AbortError') return;
        bar.remove();
        downloadAndOpenWhatsApp_(blob, filename, shareText);
      });
  };
}

async function storageGet(key){
  if(cloudAvailable && navigator.onLine){
    try{
      const res = await fetch(`${SHEET_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if(data && data.value !== null && data.value !== undefined){
        // Cache every successful online read locally too — not just what
        // this device itself saves. Otherwise a staff member who only ever
        // READS staffApprovals (never writes it) has nothing cached for
        // when they go offline, and the app falls back to showing no
        // approved tabs at all even though the owner granted them access.
        // Don't overwrite this device's own not-yet-uploaded changes with older cloud data.
        if(!isKeyBusy_(key)){ try{ localStorage.setItem('ssa_'+key, data.value); }catch(e){} }
        return data.value;
      }
      return null;
    }catch(e){ console.error('Sheet fetch failed, using local backup', e); }
  }
  try{ return localStorage.getItem('ssa_'+key); }
  catch(e){ return null; }
}
const pushInFlight_ = new Set();   // keys currently uploading
const pushQueued_ = new Set();     // keys changed again while uploading -> upload once more after
async function storageSet(key, value){
  // Saved on this device instantly. The upload to Google Sheets (slow) then
  // runs IN THE BACKGROUND, so the screen never waits for it.
  try{ localStorage.setItem('ssa_'+key, value); }
  catch(e){ console.error('local storage failed', e); }

  if(cloudAvailable && navigator.onLine){ pushKeyInBackground_(key); return; }
  markKeyDirty_(key);
}

function pushKeyInBackground_(key){
  markKeyDirty_(key);                         // stays "Syncing…" until the upload really finishes
  if(pushInFlight_.has(key)){ pushQueued_.add(key); return; }
  pushInFlight_.add(key);
  (async ()=>{
    try{
      const value = localStorage.getItem('ssa_'+key);
      if(value === null){ markKeySynced_(key); return; }
      await fetch(SHEET_SCRIPT_URL, {
        method:'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ key, value })
      });
      if(!pushQueued_.has(key)) markKeySynced_(key);
    }catch(e){
      console.error('Sheet save failed, will retry when back online', e);  // key stays dirty -> retried automatically
    }finally{
      pushInFlight_.delete(key);
      if(pushQueued_.has(key)){ pushQueued_.delete(key); pushKeyInBackground_(key); }
    }
  })();
}

/* ---------------- OFFLINE QUEUE: remembers which keys still need to reach
   Google Sheets, and pushes them the moment internet is back. This is what
   lets the app be used with no signal at all — orders save instantly to
   this device, then quietly catch up to the cloud later. ---------------- */
let dirtyKeys = [];
try{ dirtyKeys = JSON.parse(localStorage.getItem('ssa_dirty_keys') || '[]'); }catch(e){ dirtyKeys = []; }

function markKeyDirty_(key){
  if(!dirtyKeys.includes(key)) dirtyKeys.push(key);
  try{ localStorage.setItem('ssa_dirty_keys', JSON.stringify(dirtyKeys)); }catch(e){}
  updateSyncBadge_();
}
function markKeySynced_(key){
  if(dirtyKeys.includes(key)){
    dirtyKeys = dirtyKeys.filter(k=>k!==key);
    try{ localStorage.setItem('ssa_dirty_keys', JSON.stringify(dirtyKeys)); }catch(e){}
  }
  updateSyncBadge_();
}

let isFlushing_ = false;
async function flushDirtyKeys_(){
  if(isFlushing_ || !cloudAvailable || !navigator.onLine || !dirtyKeys.length) return;
  isFlushing_ = true;
  try{
    for(const key of [...dirtyKeys]){
      if(pushInFlight_.has(key)) continue;   // already uploading
      try{
        const value = localStorage.getItem('ssa_'+key);
        if(value === null){ markKeySynced_(key); continue; }
        await fetch(SHEET_SCRIPT_URL, {
          method:'POST',
          headers: {'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ key, value })
        });
        markKeySynced_(key);
      }catch(e){ console.error('Retry sync failed for', key, e); }
    }
  } finally { isFlushing_ = false; }
}

function updateSyncBadge_(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(!navigator.onLine){
    el.textContent = '🔴 Offline — saving on this device';
    el.className = 'sync-badge offline';
  } else if(dirtyKeys.length){
    el.textContent = '🟡 Syncing…';
    el.className = 'sync-badge syncing';
  } else {
    el.textContent = '🟢 Synced';
    el.className = 'sync-badge synced';
  }
}

// Google Sheets auto-converts cell text that LOOKS like a number (e.g. an
// article/design number such as "101") into an actual JS number when the
// data is read back. Every part of this app assumes these fields are text
// and calls string methods on them (.toLowerCase(), .localeCompare(), etc).
// If even one booking comes back as a number, those calls throw, the render
// stops partway through, and the screen freezes on stale content — which
// looks like "tabs stopped working" even though the tap itself worked fine.
// Forcing these fields back to strings the moment data is loaded fixes this
// for good, regardless of what type Sheets decides to hand back.
function normalizeBookingFields_(arr){
  if(!arr) return;
  arr.forEach(function(b){
    ['designNumber','customerName','brand','colour','size'].forEach(function(field){
      if(b[field] !== undefined && b[field] !== null) b[field] = String(b[field]);
    });
  });
}

// Cloud values last applied, so an unchanged refresh doesn't redraw the screen.
let lastCloudRaw_ = { b:null, a:null, s:null, c:null };
let cloudTick_ = 0;

async function fetchCloudState_(){
  // all three requests go out together (not one after another)
  // catalog list is read now and then (not every 20s) to keep Google Sheets traffic low; the customer-orders inbox is read every time
  cloudTick_++;
  const wantCat = cloudTick_ === 1 || cloudTick_ % 5 === 0 || currentTab === 'catalog' || currentTab === 'dashboard';
  const r = await Promise.all([ storageGet('bookings'), storageGet('activityLog'), storageGet('staffApprovals'), storageGet('catalogInbox'), wantCat ? catLoadAll_().catch(()=>null) : Promise.resolve(undefined) ]);
  return { b:r[0], a:r[1], s:r[2], i:r[3], c:r[4] };
}
// A key is "busy" while this device still has changes on their way to the cloud;
// a refresh must not overwrite those local changes with older cloud data.
function isKeyBusy_(key){ return dirtyKeys.includes(key) || pushInFlight_.has(key) || pushQueued_.has(key); }

function applyCloudState_(st){
  let changed = false;
  lastSyncAt_ = new Date();
  try{ if(st.i !== undefined) catalogInbox = st.i ? (JSON.parse(st.i) || []) : []; }catch(e){ console.error('inbox parse', e); }
  try{
    if(st.c && !catBusy_() && st.c.sig !== lastCloudRaw_.c){
      catalog = st.c.list; catPagesSaved_ = st.c.pages; lastCloudRaw_.c = st.c.sig; changed = true;
    }
  }catch(e){ console.error('catalog parse', e); }
  try{
    if(!isKeyBusy_('bookings') && st.b !== lastCloudRaw_.b){
      const nb = st.b ? JSON.parse(st.b) : [];
      normalizeBookingFields_(nb);
      detectNewOrders_(nb);
      bookings = nb; lastCloudRaw_.b = st.b; changed = true;
    }
  }catch(e){ console.error('bookings parse', e); }
  try{
    if(!isKeyBusy_('activityLog') && st.a !== lastCloudRaw_.a){
      activityLog = st.a ? JSON.parse(st.a) : []; lastCloudRaw_.a = st.a; changed = true;
    }
  }catch(e){ console.error('activity parse', e); }
  try{
    if(!isKeyBusy_('staffApprovals') && st.s !== lastCloudRaw_.s){
      staffApprovals = st.s ? JSON.parse(st.s) : []; lastCloudRaw_.s = st.s; changed = true;
    }
  }catch(e){ console.error('approvals parse', e); }
  return changed;
}

// Redraws after fresh data arrives, without disturbing whatever the person is typing/editing.
function rerenderAfterData_(){
  if(currentTab === 'book' || editingPendingGroup){ renderTopbarRight(); updateDatalists(); return; }
  const ae = document.activeElement;
  const typing = ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT');
  if(typing) renderTopbarRight(); else render();
}

async function loadData(){
  try{
    const saved = localStorage.getItem('ssa_currentStaff');
    if(saved) currentStaff = JSON.parse(saved);
  }catch(e){}

  // 1) Show the app INSTANTLY from this device's saved copy (no waiting for the internet).
  let cached = false;
  try{
    const lb = localStorage.getItem('ssa_bookings');
    if(lb !== null){
      bookings = JSON.parse(lb) || [];
      normalizeBookingFields_(bookings);
      const la = localStorage.getItem('ssa_activityLog'); activityLog = la ? JSON.parse(la) : [];
      const ls = localStorage.getItem('ssa_staffApprovals'); staffApprovals = ls ? JSON.parse(ls) : [];
      seenBookingIds_ = new Set(bookings.map(b=>b.id));
      cached = true;
    }
  }catch(e){ bookings = []; activityLog = []; staffApprovals = []; cached = false; }
  if(cached){ loaded = true; render(); updateSyncBadge_(); }

  // 2) Then quietly bring in the latest from Google Sheets.
  let changed = false;
  try{
    const st = await fetchCloudState_();
    changed = applyCloudState_(st);
    if(await importCatalogOrders_()) changed = true;
  }catch(e){ console.error('Initial cloud load failed', e); }

  await purgeOldRecords();
  loaded = true;
  if(!cached) render();
  else if(changed) rerenderAfterData_();
  updateSyncBadge_();
  startAutoRefresh_();
}

/* ---------------- AUTO-REFRESH: quietly re-checks Google Sheets every 20s
   so everyone sees each other's updates without hitting refresh, and syncs
   any offline changes the moment internet is back. The underlying data is
   ALWAYS kept current, on every tab including Order — only the Order form's
   own body is left untouched while on it (so typing is never interrupted);
   the topbar's Pending/Synced badge still updates live even there, since
   it sits outside the form and re-drawing it can't disturb anything. */
let autoRefreshTimer_ = null;
function startAutoRefresh_(){
  if(autoRefreshTimer_) return;
  autoRefreshTimer_ = setInterval(async ()=>{
    if(!navigator.onLine || document.hidden) return;
    await flushDirtyKeys_();
    await silentRefresh_();
  }, 20000);

  window.addEventListener('online', async ()=>{
    updateSyncBadge_();
    await flushDirtyKeys_();
    await silentRefresh_();
  });
  window.addEventListener('offline', updateSyncBadge_);

  document.addEventListener('visibilitychange', async ()=>{
    if(!document.hidden && navigator.onLine){
      await flushDirtyKeys_();
      await silentRefresh_();
    }
  });

  // Extra safety nets for mobile: some mobile browsers (and installed PWAs)
  // don't fire visibilitychange reliably when switching apps or waking the
  // screen back up, but do fire 'focus' and 'pageshow'. Covering all three
  // means coming back to the app almost always pulls fresh data immediately,
  // rather than waiting for the next 20s tick.
  window.addEventListener('focus', async ()=>{
    if(navigator.onLine){ await flushDirtyKeys_(); await silentRefresh_(); }
  });
  window.addEventListener('pageshow', async (e)=>{
    if(e.persisted && navigator.onLine){ await flushDirtyKeys_(); await silentRefresh_(); }
  });
}

async function silentRefresh_(){
  if(!currentStaff) return;
  try{
    const st = await fetchCloudState_();
    let changed = applyCloudState_(st);
    if(await importCatalogOrders_()) changed = true;
    if(!changed){ renderTopbarRight(); return; }   // nothing new: no redraw, no flicker
    rerenderAfterData_();
  }catch(e){ console.error('Auto-refresh failed', e); }
}

// Any order (pending or dispatched) placed more than 12 months ago is removed
// automatically — from Pending, Dispatched and Customers alike, since all
// three are just different views of the same `bookings` array. Old Activity
// Log entries beyond 12 months are cleared the same way. Runs once whenever
// the app loads, on whichever device opens it first.
async function purgeOldRecords(){
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 12);

  const removedCustomers = new Set();
  const beforeBookings = bookings.length;
  bookings = bookings.filter(b=>{
    const keep = new Date(b.orderedAt) >= cutoff;
    if(!keep) removedCustomers.add(b.customerName);
    return keep;
  });
  const removedBookingsCount = beforeBookings - bookings.length;

  const beforeActivity = activityLog.length;
  activityLog = activityLog.filter(a=> new Date(a.timestamp) >= cutoff);
  const removedActivityCount = beforeActivity - activityLog.length;

  if(removedBookingsCount > 0 || removedActivityCount > 0){
    activityLog.unshift({
      id: uid(),
      staffName: 'System',
      staffMobile: '',
      action: 'Auto Cleanup (12+ months old)',
      detail: `Removed ${removedBookingsCount} order line(s)${removedCustomers.size ? ' for ' + [...removedCustomers].join(', ') : ''}, and ${removedActivityCount} old activity log entr${removedActivityCount===1?'y':'ies'}.`,
      timestamp: new Date().toISOString()
    });
    await saveData();
    await saveActivity();
  }
}
async function saveData(){
  try{ await storageSet('bookings', JSON.stringify(bookings)); }
  catch(e){ console.error('save failed', e); }
}
async function saveActivity(){
  try{ await storageSet('activityLog', JSON.stringify(activityLog)); }
  catch(e){ console.error('activity save failed', e); }
}
async function saveApprovals(){
  try{ await storageSet('staffApprovals', JSON.stringify(staffApprovals)); }
  catch(e){ console.error('approvals save failed', e); }
}
async function notifyOwnerOfRequest(name, email){
  if(!cloudAvailable) return;
  try{
    await fetch(SHEET_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'notifyStaffRequest', name, email })
    });
  }catch(e){ console.error('owner notification failed', e); }
}
async function logActivity(action, detail){
  if(!currentStaff) return;
  activityLog.unshift({
    id: uid(),

    staffMobile: currentStaff.mobile,
    action,
    detail,
    timestamp: new Date().toISOString()
  });
  await saveActivity();
}

  // screen dims or the tab drops out of focus for even a moment, so the data
  // can go stale without any visible sign. Tapping a tab is a sure sign the
  // person is actively using the app right now, so pull fresh data on every
  // tap too — cheap, and it means switching tabs always shows the latest.
  if(navigator.onLine) silentRefresh_();
});

   Whenever ANOTHER staff member creates an order, this device shows an alert
   (in-app banner + phone/browser notification if allowed). Only order
   creation triggers it. The bell button in the top bar turns it on/off

let notifyOrders = true;
try{ notifyOrders = localStorage.getItem('ssa_notify_orders') !== '0'; }catch(e){}
let seenBookingIds_ = null;

function updateNotifyBtn_(){

async function toggleNotify(){
  notifyOrders = !notifyOrders;

  }
  if(notifyOrders && 'Notification' in window && Notification.permission === 'denied'){
    alert(t('notif_blocked'));
  }
  if(notifyOrders) registerPush_(); else unregisterPush_();
  showInAppToast_(notifyOrders ? t('notif_on_msg') : t('notif_off_msg'));

// Ask for notification permission once, on the first tap anywhere (browsers
// only allow the permission prompt right after a user tap).
document.addEventListener('click', function askNotifPermOnce_(){
  document.removeEventListener('click', askNotifPermOnce_);
  if(PUBLIC_MODE) return;
  if(notifyOrders && 'Notification' in window && Notification.permission === 'default'){
    try{ Promise.resolve(Notification.requestPermission()).then(()=>registerPush_()); }catch(e){}
  }

function showInAppToast_(text){
  let wrap = document.getElementById('ssaToastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'ssaToastWrap';
    wrap.className = 'ssa-toast-wrap';
    document.body.appendChild(wrap);
  }
  const el = document.createElement('div');
  el.className = 'ssa-toast';
  el.textContent = text;
  el.onclick = ()=> el.remove();
  wrap.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 8000);

function showOrderNotification_(title, body, tag){
  showInAppToast_(title + ' — ' + body);
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      const opts = { body: body, icon: 'icon-192.png', badge: 'icon-192.png', tag: tag || ('ssa-order-' + Date.now()) };
      if(navigator.serviceWorker && navigator.serviceWorker.ready){
        navigator.serviceWorker.ready
          .then(reg=>reg.showNotification(title, opts))
          .catch(()=>{ try{ new Notification(title, opts); }catch(e){} });
      } else { new Notification(title, opts); }
    }
  }catch(e){ console.error('Notification failed', e); }
}

function detectNewOrders_(list){
  if(!seenBookingIds_){ seenBookingIds_ = new Set(list.map(b=>b.id)); return; }
  const fresh = list.filter(b=>!seenBookingIds_.has(b.id));
  list.forEach(b=>seenBookingIds_.add(b.id));
  if(!fresh.length || !notifyOrders || !currentStaff) return;
  const groups = {};
  fresh.forEach(b=>{
    const ob = b.orderedBy;
    const mine = ob && ob.name === currentStaff.name && (ob.mobile||'') === (currentStaff.mobile||'');
    if(mine) return;                                                   // own orders: no alert
    if(b.status !== 'pending' || b.trashed || b.addedLater) return;
    if(Date.now() - new Date(b.orderedAt).getTime() > 6*60*60*1000) return; // ignore old orders arriving late
    const key = b.customerName + '|' + b.orderedAt;
    if(!groups[key]) groups[key] = { key:key, customer:b.customerName, brand:b.brand, by:(ob && ob.name) || '', items:[] };
    groups[key].items.push({ qty:b.qty, unit:unitOf_(b) });
  });
  Object.values(groups).forEach(g=>{
    showOrderNotification_(t('new_order_title'), `${g.customer}${g.brand ? ' ('+g.brand+')' : ''} · ${totalsUi_(g.items)}${g.by ? ' · ' + g.by : ''}`, 'ssa-' + g.key);
  });
}


/* ---------------- BACKGROUND PUSH (works even when the app is CLOSED) ----------------
   Uses Firebase Cloud Messaging. After an order is saved, this device asks the
   Google Apps Script to push "New Order" to every OTHER registered device.
   Needs the one-time setup: fill FIREBASE_CONFIG + FCM_VAPID_KEY below (and the
   same FIREBASE_CONFIG in sw.js) and add the Apps Script push code.
   Until filled in, this part stays silent and the normal in-app alerts keep working. */
const FIREBASE_CONFIG = {
  apiKey: 'PASTE_API_KEY',
  authDomain: 'PASTE_PROJECT_ID.firebaseapp.com',
  projectId: 'PASTE_PROJECT_ID',
  messagingSenderId: 'PASTE_SENDER_ID',
  appId: 'PASTE_APP_ID'
};
const FCM_VAPID_KEY = 'PASTE_VAPID_PUBLIC_KEY';
const pushConfigured = !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE') && !String(FCM_VAPID_KEY).startsWith('PASTE');

let myPushToken_ = null;
try{ myPushToken_ = localStorage.getItem('ssa_push_token') || null; }catch(e){}
let pushTried_ = false;
let fbSdkPromise_ = null;

function loadScriptOnce_(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url; s.onload = resolve; s.onerror = ()=>reject(new Error('load failed '+url));
    document.head.appendChild(s);
  });
}
function loadFirebaseSdk_(){
  if(window.firebase && firebase.messaging) return Promise.resolve();
  if(!fbSdkPromise_){
    fbSdkPromise_ = loadScriptOnce_('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js')
      .then(()=>loadScriptOnce_('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js'))
      .catch(e=>{ fbSdkPromise_ = null; throw e; });
  }
  return fbSdkPromise_;
}
function postToSheet_(obj){
  return fetch(SHEET_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(obj) });
}

async function registerPush_(){
  if(!pushConfigured || !cloudAvailable || !notifyOrders || !currentStaff || !navigator.onLine) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  try{
    await loadFirebaseSdk_();
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const messaging = firebase.messaging();
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return;
    myPushToken_ = token;
    try{ localStorage.setItem('ssa_push_token', token); }catch(e){}
    await postToSheet_({ action:'registerPush', token: token, name: currentStaff.name });
  }catch(e){ console.error('Push registration failed', e); }
}

async function unregisterPush_(){
  const token = myPushToken_;
  if(!token) return;
  try{ if(cloudAvailable && navigator.onLine) await postToSheet_({ action:'unregisterPush', token: token }); }catch(e){}
  try{ if(window.firebase && firebase.apps.length) await firebase.messaging().deleteToken(); }catch(e){}
  myPushToken_ = null;
  try{ localStorage.removeItem('ssa_push_token'); }catch(e){}
}

// Called right after an order is saved: the Apps Script pushes it to every
// other registered device (this device's own token is skipped).
function sendOrderPush_(cust, brand, sets, orderedAt){
  if(!pushConfigured || !cloudAvailable || !navigator.onLine) return;
  try{
    postToSheet_({
      action: 'sendOrderPush',
      senderToken: myPushToken_ || '',
      title: 'New Order',
      body: `${cust}${brand ? ' ('+brand+')' : ''} · ${sets}${currentStaff ? ' · ' + currentStaff.name : ''}`,
      tag: 'ssa-' + cust + '|' + orderedAt
    }).catch(()=>{});
  }catch(e){}
}

  document.querySelectorAll('.navbtn[data-tab]').forEach(btn=>{

  main.className = (currentTab==='dashboard' || currentTab==='catalog') ? 'wide' : '';
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));

  else if(currentTab==='catalog') renderCatalog(main);
  else if(currentTab==='book') renderBook(main);
  else if(currentTab==='dispatch') renderDispatch(main);
  else if(currentTab==='dispatchedOrders') renderDispatchedOrders(main);
  else if(currentTab==='pendingOrders') renderPendingOrders(main);
  else if(currentTab==='deletedOrders') renderDeletedOrders(main);
  else if(currentTab==='activity') renderActivity(main);
  else if(currentTab==='approvals') renderApprovals(main);
  else renderCustomers(main);

function initGoogleButton(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  try{
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
    const el = document.getElementById('googleSignInBtn');
    if(el) google.accounts.id.renderButton(el, { theme:'outline', size:'large', width:270 });
  }catch(e){ console.error('Google sign-in init failed', e); }
}

function parseJwt(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

async function handleGoogleCredential(response){
  const payload = parseJwt(response.credential);
  if(!payload || !payload.email) return;
  const email = payload.email;
  const nameEl = document.getElementById('loginName');
  const typedName = nameEl ? nameEl.value.trim() : '';
  const name = typedName || payload.name || email;

  // The owner's own Google account always gets straight in, and unlocks the
  // Approvals tab for approving/rejecting everyone else.
  if(email.toLowerCase() === OWNER_EMAIL.toLowerCase()){
    currentStaff = { name, mobile: email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
    render();
    return;
  }

  const existing = staffApprovals.find(s=>s.email===email);
  if(existing && existing.status === 'approved'){
    currentStaff = { name: existing.name, mobile: email };
    try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
    loginWaitingEmail = null;
    render();
    return;
  }

  if(!existing){
    staffApprovals.push({ name, email, status:'pending', requestedAt: new Date().toISOString() });
    await saveApprovals();
    notifyOwnerOfRequest(name, email); // fire-and-forget; owner gets an email
  }
  loginWaitingEmail = email;
  render();
}

  currentStaff = { name, mobile: '' };
  try{ localStorage.setItem('ssa_currentStaff', JSON.stringify(currentStaff)); }catch(e){}
  render();
}

async function approveStaff(email){
  const s = staffApprovals.find(x=>x.email===email);
  if(!s) return;
  markBusy(t('processing_word'));
  s.status = 'approved';
  s.approvedAt = new Date().toISOString();
  if(s.canDelete === undefined) s.canDelete = false; // owner must explicitly grant delete rights

  render();
}

// Lets staff move between the Order form's fields using the keyboard's
// Up/Down arrow keys instead of having to click each field by hand —
// Down moves to the next field, Up moves back to the previous one.
const ORDER_FORM_FIELD_SEQUENCE = ['custName','custCity','custBrand','designNo','sizeVal','qtyVal','designColour','designPrice'];
// Customer name as it is stored: "<name> <city>" (the app has always kept the city inside the
// customer name, e.g. "ARVIND DRESSES MANDSOUR"). If the same customer already exists, its
// existing spelling is reused so the orders stay under ONE customer.
function effectiveCustomerName_(){
  const val = (id, fallback)=>{ const el = document.getElementById(id); return String(el ? el.value : (fallback || '')).trim().replace(/\s+/g,' '); };
  const name = val('custName', draftCustomer), city = val('custCity', draftCity);
  if(!name) return '';
  let full = name;
  if(city && !normKey_(name).endsWith(normKey_(city))) full = name + ' ' + city;
  const existing = bookings.find(b=>normKey_(b.customerName) === normKey_(full));
  return existing ? String(existing.customerName) : full;
}

function handleOrderFormArrowNav(e, fieldId){
  if(e.key === ' ' && fieldId === 'designNo'){
    // Design numbers never contain spaces — typing one jumps straight to
    // Size instead of putting a space into the Design Number box.
    e.preventDefault();
    const el = document.getElementById('sizeVal');
    if(el) el.focus();
    return;
  }
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const idx = ORDER_FORM_FIELD_SEQUENCE.indexOf(fieldId);
  if(idx === -1) return;
  const step = e.key === 'ArrowDown' ? 1 : -1;
  // skip any field that is currently hidden (Colour/Price can be hidden)
  let i = idx + step, el = null;
  while(i >= 0 && i < ORDER_FORM_FIELD_SEQUENCE.length){
    el = document.getElementById(ORDER_FORM_FIELD_SEQUENCE[i]);
    if(el) break;
    i += step;
  }
  if(el){ el.focus(); if(el.select) el.select(); }
}
